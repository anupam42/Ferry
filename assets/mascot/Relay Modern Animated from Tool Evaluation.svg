<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">Meet Relay — animated Ferry mascot</title><desc id="desc">Relay floats gently on a clean light background with a subtle animated sync ring and text introduction.</desc>
<defs><clipPath id="clip"><path d="M 102,125 C 132,59 191,19 251,22 C 319,24 363,74 379,137 C 401,138 425,155 426,184 C 425,231 390,282 342,300 C 294,321 251,294 211,283 C 171,271 150,286 113,308 C 88,323 73,306 78,281 L 83,260 C 44,275 13,263 16,234 C 19,194 54,153 102,125 Z"/></clipPath><radialGradient id="wash"><stop stop-color="#e5f4ff"/><stop offset="1" stop-color="#f8fbfe"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter></defs>
<style>
@keyframes rise {0%{opacity:0;transform:translateY(24px)} 12%,90%{opacity:1;transform:translateY(0)}100%{opacity:1}}
@keyframes float {0%,100%{transform:translateY(0px) rotate(-1deg)}50%{transform:translateY(-16px) rotate(1deg)}}
@keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@keyframes draw {0%{stroke-dashoffset:180}25%,100%{stroke-dashoffset:0}}
@keyframes shimmer {0%,100%{opacity:.25}50%{opacity:.8}}
@keyframes progress {0%{stroke-dashoffset:370}100%{stroke-dashoffset:0}}
.intro{animation:rise 1s ease-out both}.sub{animation:rise 1s .55s ease-out both}.mascot{transform-origin:225px 165px;animation:float 3.5s ease-in-out infinite}.shadow{transform-origin:540px 780px;animation:breathe 3.5s ease-in-out infinite}.spark{animation:shimmer 2s ease-in-out infinite}.ring{stroke-dasharray:180;animation:draw 2s ease-out both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<rect width="1080" height="1080" fill="url(#wash)"/>
<rect x="48" y="48" width="984" height="984" rx="48" fill="none" stroke="#dce9f4" stroke-width="2"/>
<rect x="104" y="96" width="142" height="52" rx="26" fill="#102f53"/><text x="175" y="130" font-size="25" font-weight="700" text-anchor="middle" fill="white" font-family="Arial,sans-serif">FERRY</text>
<circle cx="960" cy="122" r="10" fill="#18b9aa"/>
<g class="intro"><text x="540" y="256" text-anchor="middle" font-size="81" font-weight="800" fill="#102d50" font-family="Arial,sans-serif">Meet Relay.</text></g>
