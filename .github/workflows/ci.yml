name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ESLint and Prettier, once (Windows checkouts can have CRLF line endings, which Prettier would flag)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Configure git for tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # build a standalone binary for this runner (with the web app in it) and make sure it really runs
      - run: bun run build:web
      - run: bun build src/main.ts --compile --outfile dist/ferry
      - name: Smoke-test the binary
        shell: bash
        run: |
          export FERRY_HOME="$RUNNER_TEMP/ferry-home"
          mkdir -p "$RUNNER_TEMP/s" && echo hi > "$RUNNER_TEMP/s/a.txt"
          ./dist/ferry version
          ./dist/ferry --once "$RUNNER_TEMP/s" "$RUNNER_TEMP/t"
          test "$(cat "$RUNNER_TEMP/t/a.txt")" = hi
          ./dist/ferry status --json
          # the web app is in the binary: the page, its script and its styles
          ./dist/ferry ui --no-open --port 7979 > "$RUNNER_TEMP/ui.log" 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:7979/ > "$RUNNER_TEMP/page.html" && break; sleep 0.2; done
          grep -q '<script type="module" src="/app.js">' "$RUNNER_TEMP/page.html"
          curl -sf -o /dev/null http://127.0.0.1:7979/app.js
          curl -sf -o /dev/null http://127.0.0.1:7979/app.css
          kill %1
