<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script>
  // pick the theme before anything is drawn, so the page never flashes the wrong one
  (() => {
    const saved = localStorage.getItem("ferry-theme"); // light | dark | system (or unset: system)
    const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    const root = document.documentElement;
    root.dataset.theme = dark ? "dark" : "light";
    // accent colour, interface size and motion from Settings → Appearance
    let look = {};
    try { look = JSON.parse(localStorage.getItem("ferry-look") || "{}"); } catch {}
    for (const k of ["accent", "bg", "size", "motion", "rail"]) if (look[k]) root.dataset[k] = look[k];
  })();
</script>
<style>
/* ---------- themes (brand: navy #092348, blue #2586E6, mint #66E4C0) ---------- */
:root, [data-theme="light"] {
  --bg: linear-gradient(135deg, #DDF6EE 0%, #E4EEFF 48%, #ECE6FF 100%);
  --rail: rgba(255,255,255,.62); --card: rgba(255,255,255,.78); --card-solid: #FFFFFF; --card2: rgba(240,245,252,.9);
  --line: rgba(9,35,72,.09); --text: #0B2147; --muted: #5E6C86; --faint: #94A0B6;
  --accent: #2586E6; --accent-2: #3CCBB0; --accent-text: #FFFFFF; --accent-soft: rgba(37,134,230,.12);
  --pill: #FFFFFF; --pill-text: #0B2147;
  --green: #12805A; --green-soft: #DDF7EC; --red: #C8343F; --red-soft: #FDE7E9; --amber: #A3620A; --amber-soft: #FFF1D6;
  --violet: #6D4BD8; --violet-soft: #ECE6FF;
  --ins: #CFF5E3; --ins-text: #0B5D3E; --del: #FFD9DD; --del-text: #8E1D29;
  --shadow: 0 10px 30px rgba(9,35,72,.08), 0 2px 6px rgba(9,35,72,.05);
  --overlay: rgba(9,35,72,.28);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: linear-gradient(135deg, #071430 0%, #0D1E40 50%, #1A1844 100%);
  --rail: rgba(14,25,50,.7); --card: rgba(17,29,56,.82); --card-solid: #13213F; --card2: rgba(26,40,72,.9);
  --line: rgba(226,236,255,.09); --text: #E8EEF9; --muted: #A2AECA; --faint: #6E7A96;
  --accent: #4C9DF5; --accent-2: #4FD8BD; --accent-text: #061127; --accent-soft: rgba(76,157,245,.16);
  --pill: #1B2B4F; --pill-text: #E8EEF9;
  --green: #4ADE9B; --green-soft: rgba(74,222,155,.13); --red: #FF7B86; --red-soft: rgba(255,123,134,.13); --amber: #F7BE55; --amber-soft: rgba(247,190,85,.13);
  --violet: #B79CFF; --violet-soft: rgba(183,156,255,.14);
  --ins: rgba(74,222,155,.2); --ins-text: #8FF0C3; --del: rgba(255,123,134,.2); --del-text: #FFB3BA;
  --shadow: 0 12px 34px rgba(0,0,0,.35);
  --overlay: rgba(2,8,22,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 14.5px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- layout ---------- */
/* Interface size zooms the page; zoom also scales vh, so heights divide by it to keep fitting the window */
:root { --zoom: 1; } [data-size="small"] { --zoom: .9; } [data-size="large"] { --zoom: 1.1; }
body { zoom: var(--zoom); }
.app { display: grid; grid-template-columns: var(--rail-w) 320px minmax(0, 1fr); gap: 18px; padding: 18px; min-height: calc(100vh / var(--zoom)); }
@media (max-width: 1100px) {
  /* the list sits above the page; the rail spans both so the page starts right under the list */
  .app { grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .rail { grid-column: 1; grid-row: 1 / span 2; }
  .pairs-col { grid-column: 2; grid-row: 1; } .main { grid-column: 2; grid-row: 2; }
  .app.settings-mode .main { grid-row: 1 / span 2; }
}

.rail { background: var(--rail); backdrop-filter: blur(16px); border-radius: 30px; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; position: sticky; top: 18px; height: calc(100vh / var(--zoom) - 36px); box-shadow: var(--shadow);
  overflow-y: auto; scrollbar-width: none; z-index: 5; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { flex: none; }
.rail .grow { flex: 1; }
.rail-btn { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--pill); color: var(--text); display: grid; place-items: center; cursor: pointer; position: relative; box-shadow: 0 2px 8px rgba(9,35,72,.06); transition: transform .15s; }
.rail-btn:hover { transform: translateY(-2px); }
.rail-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.rail-btn svg { width: 22px; height: 22px; }
.avatar { width: 62px; height: 62px; border-radius: 50%; background: var(--card-solid); display: grid; place-items: center; position: relative; box-shadow: 0 4px 14px rgba(9,35,72,.12); }
.avatar img { width: 50px; height: 38px; }
.avatar .dot { position: absolute; right: 2px; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--card-solid); background: var(--faint); }
/* ---------- the rail: three widths ---------- */
:root { --rail-w: 92px; }
[data-rail="thin"] { --rail-w: 64px; }
[data-rail="wide"] { --rail-w: 210px; }
.rail { position: sticky; transition: none; }
.rail-label { display: none; }
.rail-grip { position: absolute; top: 50%; right: 0; /* inside the edge: the rail scrolls, so anything past it is clipped */ width: 14px; height: 64px; margin-top: -32px; cursor: ew-resize; z-index: 6; touch-action: none; outline: none; border-radius: 99px; }
.rail-grip::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 4px; border-radius: 99px; background: var(--faint); opacity: 0; transition: opacity .15s, background .15s, top .2s, bottom .2s; }
.rail:hover .rail-grip::before { opacity: .45; }
.rail-grip:hover::before, .rail-grip:focus-visible::before, .rail-dragging .rail-grip::before { opacity: 1; background: var(--accent); top: 0; bottom: 0; }
.rail-dragging, .rail-dragging * { cursor: ew-resize !important; user-select: none; }
.app { transition: grid-template-columns .28s cubic-bezier(.3,1,.4,1); }
.rail-dragging .app { transition: none; }
/* thin: small round icons */
[data-rail="thin"] .rail { padding: 12px 0; gap: 10px; border-radius: 24px; }
[data-rail="thin"] .rail-btn { width: 42px; height: 42px; }
[data-rail="thin"] .rail-btn svg { width: 19px; height: 19px; }
[data-rail="thin"] .rail .avatar { width: 48px; height: 48px; }
[data-rail="thin"] .rail .avatar img { width: 38px; height: 29px; }
[data-rail="thin"] .rail .avatar .dot { width: 12px; height: 12px; right: 0; top: 2px; }
[data-rail="thin"] .rail-btn .badge { top: -2px; right: -4px; min-width: 18px; height: 18px; font-size: 10.5px; }
/* wide: pills with names, and Relay with the app's name */
[data-rail="wide"] .rail { align-items: stretch; padding: 16px 12px; gap: 8px; }
[data-rail="wide"] .rail-label { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-rail="wide"] .rail-btn { width: auto; height: 46px; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; justify-content: flex-start; box-shadow: none; background: transparent; }
[data-rail="wide"] .rail-btn:hover { transform: none; background: var(--pill); }
[data-rail="wide"] .rail-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
[data-rail="wide"] .rail-btn .badge { position: static; margin-left: auto; order: 3; border: 0; }
[data-rail="wide"] .rail .avatar.rail-home { width: auto; height: 64px; border-radius: 20px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; margin-bottom: 6px; }
[data-rail="wide"] .rail .avatar .dot { left: 48px; right: auto; top: 8px; }
.rail-brand { text-align: left; font-size: 17px !important; font-weight: 800 !important; letter-spacing: -.01em; line-height: 1.15; }
.rail-brand small { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
/* ---------- pull to refresh: Relay drops in from the top ---------- */
.ptr { --pull: 0px; --k: 0; position: fixed; left: 50%; top: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  /* Relay's top is 70px above the screen at rest and 16px below it at the trigger point; the label rides below */
  transform: translate(-50%, calc(var(--pull) - 70px)); opacity: 0; transition: opacity .15s; }
.ptr.on { opacity: 1; }
.ptr-dragging, .ptr-dragging * { user-select: none !important; cursor: grabbing !important; }
.ptr.snap, .ptr.leaving, .ptr.busy, .ptr.done { transition: transform .26s cubic-bezier(.3,1.3,.5,1), opacity .2s; }
.ptr.leaving { transform: translate(-50%, -110%); opacity: 0; }
.ptr-bubble { position: relative; width: 60px; height: 60px; border-radius: 50%; background: var(--card-solid); box-shadow: 0 10px 28px rgba(9,35,72,.22); display: grid; place-items: center;
  /* stretches a little as you pull, like it's hanging on */
  transform: scale(calc(.7 + var(--k) * .3)) rotate(calc((1 - var(--k)) * -25deg)); }
.ptr-face { width: 42px; height: 32px; transform-origin: 50% 80%; }
.ptr.ready .ptr-face { animation: relay-wiggle .45s ease-in-out infinite alternate; }
.ptr.busy .ptr-face { animation: ptr-bob .7s ease-in-out infinite alternate; }
.ptr.done .ptr-face { animation: relay-jump .6s cubic-bezier(.3,1.4,.5,1); }
@keyframes ptr-bob { from { transform: translateY(1px) scale(1); } to { transform: translateY(-2px) scale(1.04); } }
.ptr-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ptr-track { fill: none; stroke: var(--line); stroke-width: 3; }
/* the ring fills as you pull; at the trigger it's full */
.ptr-arc { fill: none; stroke: var(--accent); transform-box: fill-box; transform-origin: center; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: calc(var(--k) * 100) 100; transition: stroke .2s; }
.ptr.ready .ptr-arc { stroke: var(--accent-2); }
/* refreshing: a short arc that spins */
.ptr.busy .ptr-arc { stroke-dasharray: 28 100; animation: ptr-spin .8s linear infinite; }
@keyframes ptr-spin { to { transform: rotate(360deg); } }
.ptr.done .ptr-arc { stroke: var(--green); stroke-dasharray: 100 100; }
.ptr-text { font-size: 12.5px; font-weight: 700; color: var(--text); background: var(--card-solid); padding: 4px 12px; border-radius: 99px; box-shadow: 0 4px 12px rgba(9,35,72,.12); opacity: calc(var(--k) * 1.4 - .3); }
.ptr.busy .ptr-text, .ptr.done .ptr-text { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .ptr-face, .ptr-arc { animation: none !important; } .ptr-bubble { transform: none; } }
[data-motion="reduce"] .ptr-face, [data-motion="reduce"] .ptr-arc { animation: none !important; }
/* ---------- Relay in the rail: idles, perks up on hover, jumps on the way home ---------- */
.rail-home { border: 0; padding: 0; cursor: pointer; color: var(--text); font: inherit; transition: box-shadow .2s, transform .2s; }
.rail-home:hover { box-shadow: 0 0 0 3px var(--accent-soft), 0 6px 18px rgba(9,35,72,.16); }
.rail-home:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent); }
.rail-face-wrap { display: grid; place-items: center; flex: none; }
.rail-home img { transform-origin: 50% 85%; animation: relay-idle 5.5s ease-in-out infinite; }
/* a slow float with a little look-around, then a happy hop every few seconds */
@keyframes relay-idle {
  0%, 100% { transform: translateY(0) rotate(0); }
  18% { transform: translateY(-2px) rotate(-3deg); }
  36% { transform: translateY(0) rotate(0); }
  54% { transform: translateY(-2px) rotate(3deg); }
  70% { transform: translateY(0) rotate(0); }
  76% { transform: translateY(-6px) scale(1.04, .96); }
  80% { transform: translateY(0) scale(.96, 1.04); }
  84% { transform: translateY(0) scale(1); }
}
.rail-home:hover img { animation: relay-wiggle .55s ease-in-out infinite alternate; }
@keyframes relay-wiggle { from { transform: rotate(-7deg) translateY(-1px); } to { transform: rotate(7deg) translateY(-3px); } }
/* clicked: squash, jump, land; a ring bursts out behind */
.rail-home.jump img { animation: relay-jump .6s cubic-bezier(.3,1.4,.5,1); }
@keyframes relay-jump {
  0% { transform: scale(1); } 15% { transform: scale(1.18, .78) translateY(3px); }
  45% { transform: scale(.92, 1.1) translateY(-12px) rotate(-6deg); }
  70% { transform: scale(1.06, .94) translateY(0); } 100% { transform: scale(1); }
}
.rail-face-wrap { position: relative; }
.rail-home.jump .rail-face-wrap::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--accent); animation: relay-burst .6s ease-out forwards; pointer-events: none; }
@keyframes relay-burst { from { transform: scale(.6); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
/* online: the dot breathes */
.avatar .dot.ok, .avatar .dot.on { animation: dot-breathe 2.4s ease-in-out infinite; }
@keyframes dot-breathe { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 45%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
@media (prefers-reduced-motion: reduce) { .rail-home img, .rail-home.jump img, .rail-home.jump .rail-face-wrap::after, .avatar .dot { animation: none !important; } .app { transition: none; } }
[data-motion="reduce"] .rail-home img, [data-motion="reduce"] .rail-home.jump img, [data-motion="reduce"] .avatar .dot { animation: none !important; }
.dot.ok { background: #2BC48A !important; } .dot.bad { background: #FF5C6C !important; }

.card { background: var(--card); backdrop-filter: blur(18px); border-radius: 26px; box-shadow: var(--shadow); }

/* ---------- pairs column ---------- */
.pairs-col { display: flex; flex-direction: column; gap: 14px; }
.pairs-head { padding: 18px 18px 12px; display: flex; align-items: center; gap: 10px; }
.pairs-head h2 { font-size: 17px; margin: 0; flex: 1; }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #FF7A59; color: #fff; font-size: 12px; font-weight: 700; }
.count.blue { background: var(--accent); }
.count.red { background: #E5484D; }
.pair-list { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.pair { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 18px; border: 2px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.pair:hover { background: var(--accent-soft); }
/* the selected one: a border in Relay's gradient (the accent pair, so it follows Settings → Accent) */
.pair.sel { background: linear-gradient(var(--card-solid), var(--card-solid)) padding-box, linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 18%, transparent); }
.pair img { width: 44px; height: 32px; }
.pair > div { min-width: 0; }
a.btn { text-decoration: none; }
.pill svg { width: 14px; height: 14px; flex: none; }
.pair .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-empty { padding: 4px 18px 18px; color: var(--muted); font-size: 13px; }

/* ---------- buttons, pills ---------- */
.btn { border: 0; border-radius: 99px; padding: 9px 18px; background: var(--pill); color: var(--pill-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 550; box-shadow: 0 2px 8px rgba(9,35,72,.06); white-space: nowrap; transition: transform .12s, filter .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--text); color: var(--card-solid); }
[data-theme="dark"] .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #061127; }
.btn.brand { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--red); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.icon { padding: 8px; border-radius: 50%; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--card2); color: var(--muted); white-space: nowrap; }
.pill.green { background: var(--green-soft); color: var(--green); } .pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.violet { background: var(--violet-soft); color: var(--violet); }
.pill.solid-blue { background: var(--accent); color: #fff; } .pill.solid-green { background: #19A974; color: #fff; } .pill.solid-red { background: #E5484D; color: #fff; } .pill.solid-violet { background: #8B6CF0; color: #fff; }

/* ---------- main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; padding: 6px 4px 0; }
.crumbs b { color: var(--text); font-weight: 600; }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 0 4px; }
.title-row h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
.title-row .grow { flex: 1; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.paths { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 4px; font-size: 12.5px; color: var(--muted); }
.paths code { background: var(--card); padding: 3px 10px; border-radius: 99px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--text); max-width: 100%; overflow-wrap: anywhere; }

.hero { display: flex; align-items: center; gap: 18px; padding: 14px 22px; }
.hero img { width: 112px; height: 82px; flex: none; }
.hero img.anim { width: 150px; height: 71px; }
.bubble { position: relative; background: var(--card-solid); border-radius: 20px; padding: 12px 16px; flex: 1; min-width: 0; box-shadow: 0 2px 10px rgba(9,35,72,.06); }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--card-solid); border-left: 0; }
.bubble .say { font-weight: 650; font-size: 15.5px; }
.bubble .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
.track { height: 9px; border-radius: 99px; background: var(--card2); overflow: hidden; margin-top: 8px; }
.track .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .35s ease; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 4px; }
.toolbar .grow { flex: 1; }
.tab { border: 0; border-radius: 99px; padding: 10px 20px; background: var(--pill); color: var(--pill-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 2px 8px rgba(9,35,72,.06); }
.tab svg { width: 18px; height: 18px; }
.tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.tab .count { margin-left: 2px; }
/* the repository view's floating dock: views, then fetch / pull / push */
/* a folder pair's command bar: status chip | approve | pause · sync | ⋯ */
.cmdbar { display: inline-flex; align-items: center; gap: 4px; padding: 5px; border-radius: 99px; background: var(--card-solid); box-shadow: 0 8px 24px rgba(9,35,72,.09), 0 1px 3px rgba(9,35,72,.06); border: 1px solid var(--line); }
.cb-chip { --c: var(--green); display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 99px; white-space: nowrap; font-size: 13.5px;
  border: 1.5px solid transparent; background: linear-gradient(var(--card-solid), var(--card-solid)) padding-box, linear-gradient(120deg, var(--c), color-mix(in srgb, var(--c) 35%, var(--accent-2)) 55%, color-mix(in srgb, var(--c) 30%, var(--violet))) border-box; }
.cb-chip.t-green { --c: var(--green); } .cb-chip.t-blue { --c: var(--accent); } .cb-chip.t-amber { --c: var(--amber); } .cb-chip.t-red { --c: var(--red); }
.cb-chip b { font-weight: 700; }
.cb-chip small { color: var(--faint); font-size: 12px; }
.cb-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.cb-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: var(--c); opacity: .35; animation: cb-pulse 2s ease-out infinite; }
.cb-chip.t-amber .cb-dot::after, .cb-chip.t-red .cb-dot::after { animation: none; opacity: 0; }
.cb-chip.live .cb-dot::after { animation-duration: 1s; }
@keyframes cb-pulse { 0% { transform: scale(.4); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }

/* remote activity: pull breathes amber when commits are waiting, push breathes blue when you have some to share */

.gdock-btn.incoming svg { animation: gd-drop 1.8s ease-in-out infinite; }

.gdock-btn.outgoing.blocked svg { animation: none; }

/* running: the arrow keeps travelling; fetch's cloud breathes */

.gdock-btn.k-pull.working svg { animation: gd-fall .9s cubic-bezier(.5,0,.5,1) infinite; }

/* finished: a green check that pops */
.gdock-btn.done { color: var(--green); background: var(--green-soft); }
.gdock-btn.done svg { animation: gd-pop .45s cubic-bezier(.3,1.6,.5,1); }

/* backgrounds: a light and a dark version of each */
:root {
  --bg-relay-l: linear-gradient(135deg, #DDF6EE 0%, #E4EEFF 48%, #ECE6FF 100%); --bg-relay-d: linear-gradient(135deg, #071430 0%, #0D1E40 50%, #1A1844 100%);
  --bg-plain-l: #F3F5FA; --bg-plain-d: #0B1328;
  --bg-sky-l: linear-gradient(160deg, #DCEBFF 0%, #EEF5FF 55%, #F7FAFF 100%); --bg-sky-d: linear-gradient(160deg, #061A36 0%, #0A2546 55%, #0C2C52 100%);
  --bg-mint-l: linear-gradient(160deg, #D9F5EA 0%, #EAF9F3 55%, #F5FCF9 100%); --bg-mint-d: linear-gradient(160deg, #04201B 0%, #082B26 55%, #0B332E 100%);
  --bg-lavender-l: linear-gradient(160deg, #E9E2FF 0%, #F2EEFF 55%, #F9F7FF 100%); --bg-lavender-d: linear-gradient(160deg, #130E31 0%, #1C1542 55%, #221A4E 100%);
  --bg-sand-l: linear-gradient(160deg, #F8EBDA 0%, #FCF4EA 55%, #FFFAF4 100%); --bg-sand-d: linear-gradient(160deg, #1C140C 0%, #261B11 55%, #2D2115 100%);
}
[data-bg="plain"] { --bg: var(--bg-plain-l); } [data-theme="dark"][data-bg="plain"] { --bg: var(--bg-plain-d); }
[data-bg="sky"] { --bg: var(--bg-sky-l); } [data-theme="dark"][data-bg="sky"] { --bg: var(--bg-sky-d); }
[data-bg="mint"] { --bg: var(--bg-mint-l); } [data-theme="dark"][data-bg="mint"] { --bg: var(--bg-mint-d); }
[data-bg="lavender"] { --bg: var(--bg-lavender-l); } [data-theme="dark"][data-bg="lavender"] { --bg: var(--bg-lavender-d); }
[data-bg="sand"] { --bg: var(--bg-sand-l); } [data-theme="dark"][data-bg="sand"] { --bg: var(--bg-sand-d); }
/* accents */
[data-accent="ocean"] { --accent: #0E7CC2; --accent-2: #2BB3D9; }
[data-accent="forest"] { --accent: #1E8C5A; --accent-2: #6DB85C; }

[data-accent="grape"] { --accent: #7C4DDB; --accent-2: #C94FBE; }
[data-accent="graphite"] { --accent: #3D4A63; --accent-2: #7A8AA8; }
[data-theme="dark"][data-accent="ocean"] { --accent: #3FA9F5; --accent-2: #5FD3F0; }
[data-theme="dark"][data-accent="forest"] { --accent: #3CCB7F; --accent-2: #9BE07E; }
[data-theme="dark"][data-accent="sunset"] { --accent: #FF7A45; --accent-2: #FFC15C; }
[data-theme="dark"][data-accent="grape"] { --accent: #A47CFF; --accent-2: #F07FE3; }

[data-accent] { --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent); }

/* ---------- history graph ---------- */
.h-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 2px 16px 10px; }
.h-search { max-width: 340px; }
.h-scroll { overflow-x: auto; }
.h-rows { --graph-w: 34px; }
.h-row { display: grid; grid-template-columns: var(--graph-w) minmax(130px, 200px) 84px minmax(0, 1fr) minmax(112px, 152px); align-items: center; column-gap: 14px; height: 44px; padding: 0 16px 0 6px; cursor: pointer; border-radius: 12px; }
.h-row:not(.h-head):hover, .h-row:focus-visible { background: var(--accent-soft); outline: none; }
.h-row.is-head .h-subject { font-weight: 700; }
.h-head { height: 34px; cursor: default; font-size: 12.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 2px; }
.h-graph { height: 44px; display: block; overflow: visible; /* HEAD's halo reaches past the cell */ }
.h-graph .graph { display: block; }
.graph .edge { fill: none; stroke-width: 2; stroke-linecap: round; }
.graph .node { fill: var(--lane); stroke: var(--card-solid); stroke-width: 2; }
.graph .node.merge { fill: var(--card-solid); stroke: var(--lane); stroke-width: 2.5; }
.graph .node.head { stroke: var(--text); stroke-width: 2.5; }
.h-rows.searching .h-graph svg { visibility: hidden; }
/* the living graph: it draws itself in, light flows up every lane toward HEAD, and HEAD pulses */
.h-graph .graph { overflow: visible; }
.graph .edge { stroke-dasharray: 1; transition: stroke-width .15s; }
.graph .edge.draw { animation: g-draw .34s cubic-bezier(.4,0,.2,1) backwards; animation-delay: var(--d, 0ms); }
@keyframes g-draw { from { stroke-dashoffset: 1; } }
.graph .node { transform-box: fill-box; transform-origin: center; transition: transform .2s cubic-bezier(.3,1.6,.5,1), filter .2s; }
.graph .node.pop { animation: g-pop .42s cubic-bezier(.3,1.7,.5,1) backwards; animation-delay: calc(var(--d, 0ms) + 120ms); }
@keyframes g-pop { from { transform: scale(0); } }
/* points of light travelling up the lanes toward HEAD: a bead in the lane's colour with a bright dot at its heart.
   The pattern repeats every two rows (88px); odd rows start 44px along it, so the light lines up from row to row. */
.graph .flow { fill: none; stroke: var(--lane); stroke-width: 5.5; stroke-linecap: round; stroke-dasharray: 3 85; opacity: 0; pointer-events: none;
  animation: g-flow 3.2s linear infinite, g-fade-in .6s ease forwards; animation-delay: 0s, calc(var(--d, 0ms) + 400ms); }
.graph .flow.core { stroke: #fff; stroke-width: 2.4; stroke-dasharray: .01 87.99; animation-name: g-flow-core, g-fade-in; }
@keyframes g-flow { from { stroke-dashoffset: var(--ph); } to { stroke-dashoffset: calc(var(--ph) + 88px); } }
/* the core dot sits in the middle of its bead (1.5px in) */
@keyframes g-flow-core { from { stroke-dashoffset: calc(var(--ph) - 1.5px); } to { stroke-dashoffset: calc(var(--ph) + 86.5px); } }
@keyframes g-fade-in { to { opacity: .85; } }
/* HEAD: a soft halo that keeps rippling out */
.graph .halo { fill: var(--lane); transform-box: fill-box; transform-origin: center; pointer-events: none; animation: g-halo 2.4s cubic-bezier(.2,.6,.3,1) infinite; animation-delay: calc(var(--d, 0ms) + 500ms); opacity: 0; }
@keyframes g-halo { 0% { transform: scale(1); opacity: .45; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
/* merges: a dashed ring that turns when you hover the row */
.graph .ring { fill: none; stroke: var(--lane); stroke-width: 1.5; stroke-dasharray: 2.5 3.4; opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .2s; pointer-events: none; }
/* hovering (or focusing) a row wakes it up */
.h-row:hover .graph .node, .h-row:focus-visible .graph .node { transform: scale(1.35); filter: drop-shadow(0 0 4px var(--lane)); }
.h-row:hover .graph .edge, .h-row:focus-visible .graph .edge { stroke-width: 3; }
.h-row:hover .graph .ring, .h-row:focus-visible .graph .ring { opacity: .9; animation: g-spin 3s linear infinite; }
@keyframes g-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .graph .edge.draw, .graph .node.pop, .graph .halo, .graph .ring { animation: none !important; }
  .graph .flow { display: none; }
  .graph .node { transition: none; }

<div class="app">

  </nav>

      <div style="padding:0 18px 12px"><button class="btn brand" id="add-btn" style="width:100%;justify-content:center"></button></div>

</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
(() => {
  // ---------- plumbing ----------
  const params = new URLSearchParams(location.search);
  if (params.get("token")) {
    sessionStorage.setItem("ferry-token", params.get("token"));
    history.replaceState(null, "", location.pathname);
  }
  const token = sessionStorage.getItem("ferry-token") || "";
  const $ = (sel, root = document) => root.querySelector(sel);
  const enc = encodeURIComponent;

  /** h("div", {class, onclick}, ...children): text children are never parsed as HTML. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? "" : v);

    return el;
  }

  // line icons (static markup only, never user text)

    tree: '<path d="M12 3v18M12 8l-6 4M12 12l6 4"/>',
    cloud: '<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
    plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    user: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20a6 6 0 0 0-4-5.6"/>',
    palette: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.2-9-7.2z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/>',
    db: '<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-13M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    more: '<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
    undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    expand: '<path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/>',
    shrink: '<path d="M4 14h6v6M20 10h-6V4M14 10l6.5-6.5M10 14l-6.5 6.5"/>',
    shield: '<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/>',
    ticket: '<path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 5v12"/>',
  };
  function icon(name) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);

    return s;
  }

  /**
   * Relay while something loads. "comparing" uses the animated comparing art
   * (for diffs); other moods bob. card: false for use inside an existing card.
   */
  const relayLoading = (say, { mood = "focused", sub = "", card = true } = {}) => h("div", { class: (card ? "card " : "") + "relay-loading", role: "status", "aria-live": "polite" },
    h("img", { src: face(mood), alt: "", class: mood === "comparing" ? "wide" : "" }),
    h("div", {}, h("b", {}, say, h("span", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i"))), sub ? h("small", {}, sub) : null));

  async function api(method, url, body) {
    const headers = { "X-Ferry": "web" };
    if (token) headers.Authorization = "Bearer " + token;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const res = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) {
      let msg = text.trim() || res.statusText, code = "";
      try { const j = JSON.parse(text); msg = j.error || msg; code = j.code || ""; } catch {}
      const err = new Error(msg);
      err.code = code;
      throw err;
    }
    return (res.headers.get("Content-Type") || "").includes("json") ? JSON.parse(text) : text;
  }
  const pairURL = (name, action) => `/pairs/${enc(name)}/${action}`;

  function toast(msg, bad = false, mood) {
    const t = h("div", { class: "toast" + (bad ? " bad" : "") }, h("img", { src: face(mood || (bad ? "sad" : "happy")), alt: "" }), h("span", {}, msg));
    $("#toasts").append(t);
    setTimeout(() => t.remove(), bad ? 7000 : 3800);
  }
  async function act(label, f, mood) {
    try {
      const r = await f();
      if (label) toast(label, false, mood);
      return r;
    } catch (e) {
      toast(e.message, true);
      return null;
    }
  }

  function ago(iso) {
    const t = Date.parse(iso);
    if (!t || String(iso).startsWith("0001")) return "never";
    if (localStorage.getItem("ferry-time") === "exact") return new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    const d = (Date.now() - t) / 1000;
    if (d < 45) return "just now";
    if (d < 3600) return Math.round(d / 60) + " min ago";
    if (d < 86400) return Math.round(d / 3600) + " h ago";
    return new Date(t).toLocaleString();
  }
  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const plural = (n, w, many) => `${n} ${n === 1 ? w : many || w + "s"}`;

  // ---------- state ----------
  const S = {
    remote: {}, remoteBusy: "", remoteDone: null, // per-repo remote checks; the fetch/pull/push running now
    pairBusy: "", pairDone: null, // the pair whose "sync everything" is running / just finished
    info: null, pairs: [], sel: localStorage.getItem("ferry-sel") || "", tab: "files", q: "",
    log: new Map(), lastError: new Map(), cleared: new Map(), closed: new Set(JSON.parse(localStorage.getItem("ferry-closed") || "[]")),

    mode: ({ sync: "sync", git: "git" })[localStorage.getItem("ferry-start")] || (localStorage.getItem("ferry-mode") === "git" ? "git" : "sync"),
    repos: [], repoSel: localStorage.getItem("ferry-repo") || "", repo: null, gitTab: "changes", gitBump: 0, logSkip: 0,
  };
  // ferry ui --dev: after a hot reload, come back to the same tab and scroll position
  const devState = JSON.parse(sessionStorage.getItem("ferry-dev-state") || "null");
  sessionStorage.removeItem("ferry-dev-state");
  if (devState) Object.assign(S, { tab: devState.tab, gitTab: devState.gitTab, insightsWho: devState.insightsWho });
  function devReload() {
    sessionStorage.setItem("ferry-dev-state", JSON.stringify({ tab: S.tab, gitTab: S.gitTab, insightsWho: S.insightsWho, scroll: window.scrollY }));
    location.reload();
  }
  /** A save that only touched <style>: swap the new styles in, nothing else changes. */
  async function devSwapStyles() {
    try {
      const html = await (await fetch("/" + (token ? "?token=" + enc(token) : ""), { cache: "no-store" })).text();
      const fresh = [...new DOMParser().parseFromString(html, "text/html").querySelectorAll("style")];
      const mine = [...document.querySelectorAll("style")];
      if (fresh.length !== mine.length) return devReload();
      fresh.forEach((st, i) => { if (mine[i].textContent !== st.textContent) mine[i].textContent = st.textContent; });
    } catch {
      devReload();
    }
  }

  /** Relay's face and words for a pair's state. */
  function mood(p) {
    const err = S.lastError.get(p.name);
    if (p.comparing) {
      const { done, total } = p.comparing;
      return { face: "comparing", anim: true, say: "I'm comparing your files…", hint: `${done} of ${total} checked by content`, progress: total ? done / total : 0, tone: "blue", label: `comparing ${done}/${total}` };
    }
    if (p.conflicts.length) return { face: "worried", say: `${plural(p.conflicts.length, "file")} changed in both folders.`, hint: "Pick which version to keep below. Nothing is overwritten until you decide.", tone: "red", label: plural(p.conflicts.length, "conflict") };
    if (err && Date.now() - err.at < 120000) return { face: "sad", say: "Something went wrong.", hint: err.msg, tone: "red", label: "error" };
    if (p.pending_batch > 0) return { face: "surprised", say: `That's a lot: ${p.pending_batch} changes at once.`, hint: "Approve them when you're ready (button above).", tone: "amber", label: "waiting for you" };
    if (p.user_paused) return { face: "sleepy", say: "Paused. Taking a nap.", hint: "I'll catch up on everything you change when you resume.", tone: "amber", label: "paused" };
    if (p.guard_reason) return { face: "thinking", say: "Paused for a moment.", hint: p.guard_reason, tone: "amber", label: "paused" };
    if (p.pending || !p.watcher) return { face: "focused", say: "Syncing…", hint: "Copying what changed.", tone: "blue", label: "syncing" };
    const fresh = p.last_sync && Date.now() - Date.parse(p.last_sync) < 8000;
    const last = p.last_sync && !p.last_sync.startsWith("0001") ? " · last copy " + ago(p.last_sync) : "";
    return { face: fresh ? "party" : "happy", say: fresh ? "Done! Everything's copied." : "All synced.", hint: `The target matches your working folder${last}.`, tone: "green", label: "watching" };
  }

  async function refresh() {
    try {
      S.pairs = await api("GET", "/status");
      setConn(true);
    } catch {
      setConn(false);
      return;
    }
    if (!S.pairs.some((p) => p.name === S.sel)) S.sel = S.pairs[0] ? S.pairs[0].name : "";
    if (S.mode === "git") await loadRepos();
    render();
    if (S.pairs.some((p) => p.comparing)) {
      clearTimeout(S.fast);
      S.fast = setTimeout(refresh, 400);
    }
  }
  let refreshTimer = null;
  const refreshSoon = () => {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refresh, 250);
  };

  // "running" means ferry answers; the live-updates stream reconnecting by itself is not an outage
  function setConn(ok) {
    $("#conn-dot").className = "dot " + (ok ? "ok" : "bad");
    $("#conn-text").textContent = ok ? "Ferry is running · updates are live" : "Can't reach Ferry. Is “ferry ui” still running in your terminal?";
  }

  function connectEvents() {
    const es = new EventSource("/events" + (token ? "?token=" + enc(token) : ""));
    const onEv = (m) => {
      let ev;
      try {
        ev = JSON.parse(m.data);
      } catch {
        return;
      }
      const list = S.log.get(ev.pair) || [];
      list.push(ev);
      if (list.length > 400) list.splice(0, list.length - 400);
      S.log.set(ev.pair, list);
      if (NOTABLE.has(ev.kind)) addNote(ev);
      if (ev.kind === "error") {
        S.lastError.set(ev.pair, { at: Date.now(), msg: (ev.message || "error") + (ev.path ? " (" + ev.path + ")" : "") });
        toast(`${ev.pair}: ${ev.message || "error"}`, true);
      }
      if (ev.kind === "commit") toast(`${ev.pair}: ${ev.message}`, false, "party");
      if (ev.kind === "conflict" && ev.held && document.hidden) document.title = "(!) Ferry";
      refreshSoon();
    };
    for (const k of ["info", "add", "update", "delete", "rename", "conflict", "resolved", "skip", "warn", "error", "synced", "paused", "resumed", "git", "commit", "kept"]) es.addEventListener(k, onEv);
    if (S.info && S.info.dev) {
      // the page was saved: styles swap in place, anything else reloads where you were
      es.addEventListener("dev", (m) => { let d = {}; try { d = JSON.parse(m.data); } catch {} d.kind === "css" ? devSwapStyles() : devReload(); });
      // ferry restarted (its code changed): reload once it answers again
      es.onopen = async () => {
        const info = await api("GET", "/info").catch(() => null);
        if (info && info.dev && info.dev.boot !== S.info.dev.boot) devReload();
      };
    }
    es.onerror = () => refreshSoon(); // the browser reconnects by itself; just check that ferry still answers
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "Ferry"; });

  // ---------- notifications ----------
  const NOTABLE = new Set(["conflict", "resolved", "error", "warn", "skip", "commit", "synced", "paused", "resumed", "info"]);
  S.notes = [];
  S.lastRead = Number(localStorage.getItem("ferry-read") || 0);
  S.prefs = JSON.parse(localStorage.getItem("ferry-note-prefs") || '{"desktop":false,"routine":false}');
  S.noteFilter = "all";

  /** What an event means for a person: category, Relay's face, a sentence, and something to do about it. Null for noise. */
  function describe(ev) {
    const file = ev.path ? ev.path.split("/").pop() : "";
    const goPair = (tab) => () => { closeNotes(); S.mode = "sync"; localStorage.setItem("ferry-mode", "sync"); S.sel = ev.pair; S.tab = tab; S.shown = ""; S.ui = null; refresh(); };
    const seeChanges = ev.path ? { label: "See changes", run: () => { const p = S.pairs.find((x) => x.name === ev.pair); if (p) { closeNotes(); showDiff(p, ev.path, false); } } } : null;
    const m = ev.message || "";
    switch (ev.kind) {
      case "conflict":
        return ev.held
          ? { cat: "needs", mood: "worried", title: `${file} changed in both folders`, detail: "Pick which version to keep. Nothing is overwritten until you do.", action: { label: "Resolve", run: goPair("files") } }
          : { cat: "sync", mood: "thinking", title: `Settled a conflict in ${file}`, detail: m };
      case "resolved": return { cat: "sync", mood: "happy", title: `${file}: sorted out`, detail: m };
      case "error": return { cat: "errors", mood: "sad", title: cap(m.split(":")[0]) || "Something went wrong", detail: (ev.path ? ev.path + " · " : "") + m, action: { label: "Details", run: goPair("activity") } };
      case "warn":
        if (/possible secret/i.test(m)) return { cat: "needs", mood: "surprised", title: `${file} might contain a password or key`, detail: "Check it before you commit. " + m.replace(/^possible secret: /i, "Found: ").replace(/ — check before committing$/, "."), action: seeChanges };
        if (/waiting for approval|large batch/i.test(m)) return { cat: "needs", mood: "surprised", title: m.replace(/ \(press y in the dashboard\)/, ""), detail: "A big batch of changes is waiting. Approve it when you're ready.", action: { label: "Review", run: goPair("files") } };
        if (/merged with \d+ conflict/i.test(m)) return { cat: "needs", mood: "worried", title: `${file} has conflict markers`, detail: m, action: seeChanges };
        return { cat: "errors", mood: "thinking", title: cap(m.split(":")[0]), detail: m };
      case "skip":
        return /secret/i.test(m)
          ? { cat: "needs", mood: "surprised", title: `Held back ${file}: it looks like a secret`, detail: m }
          : { cat: "sync", mood: "thinking", title: `Skipped ${file}`, detail: m };
      case "commit": {
        if (/^pushed /.test(m)) return { cat: "commits", mood: "party", title: `Pushed ${m.slice(7)}`, detail: "Your commits are on the remote." };
        if (/^opened pull request /.test(m)) return { cat: "commits", mood: "excited", title: "Opened a pull request", detail: m.slice(20), action: { label: "Open", run: () => window.open(m.slice(20), "_blank", "noopener") } };
        const [hash, ...rest] = m.split(" ");
        return { cat: "commits", mood: "party", title: `Committed: ${rest.join(" ")}`, detail: "commit " + hash };
      }
      case "synced": {
        const n = Object.fromEntries([...m.matchAll(/([+~\-↻!])(\d+)/g)].map((x) => [x[1], +x[2]]));
        const parts = [n["+"] && `${n["+"]} added`, n["~"] && `${n["~"]} updated`, n["-"] && `${n["-"]} deleted`, n["↻"] && `${n["↻"]} renamed`].filter(Boolean);
        const total = (n["+"] || 0) + (n["~"] || 0) + (n["-"] || 0) + (n["↻"] || 0);
        if (n["!"]) return { cat: "errors", mood: "sad", title: `${plural(n["!"], "file")} couldn't be copied`, detail: parts.join(", "), action: { label: "Details", run: goPair("activity") } };
        return { cat: "sync", mood: "happy", title: `Copied ${plural(total, "file")}`, detail: parts.join(", "), action: { label: "See files", run: goPair("files") } };
      }
      case "paused": return { cat: "sync", mood: "sleepy", title: m === "paused by user" ? "Paused" : "Paused for a moment", detail: m === "paused by user" ? "Syncing stopped until you resume." : m };
      case "resumed": return { cat: "sync", mood: "happy", title: "Back to syncing", detail: m === "resumed" ? "" : m };
      case "info":
        if (/^(undid|restored to|pulled|pushed|uploaded|ignored|pruned)/i.test(m) || /ignored from now on/.test(m)) return { cat: "sync", mood: "wink", title: (ev.path ? ev.path + ": " : "") + m.charAt(0).toUpperCase() + m.slice(1), detail: "" };
        return null;
    }
    return null;
  }

  const CAT = { needs: "Needs you", errors: "Errors", commits: "Commits", sync: "Syncs" };
  const cap = (x) => (x ? x.charAt(0).toUpperCase() + x.slice(1) : x);
  /** Today: "5 min ago"; earlier days sit under their own heading, so just the time. */
  const noteTime = (iso) => (new Date(iso).toDateString() === new Date().toDateString() ? ago(iso) : new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  const important = (d) => d && d.cat !== "sync";
  function unread() { return S.notes.filter((ev) => Date.parse(ev.time) > S.lastRead && important(describe(ev))).length; }
  function paintBadge() {
    const n = unread();
    const b = $("#note-badge");
    if (!b) return;
    b.textContent = n > 99 ? "99+" : n;
    b.classList.toggle("hidden", n === 0);
    $("#nav-activity").title = n ? `Notifications: ${n} new` : "Notifications";
  }

  function addNote(ev) {
    S.notes.push(ev);
    if (S.notes.length > 500) S.notes.splice(0, S.notes.length - 500);
    paintBadge();
    S.noteDrawer?.paint();
    const d = describe(ev);
    if (d && (d.cat === "needs" || d.cat === "errors") && S.prefs.desktop && document.hidden && "Notification" in window && Notification.permission === "granted") {
      const n = new Notification("Ferry · " + ev.pair, { body: d.title + (d.detail ? "\n" + d.detail : ""), icon: "/logo.svg", tag: ev.pair + "|" + (ev.path || ev.kind) });
      n.onclick = () => { window.focus(); d.action?.run(); n.close(); };
    }
  }

  function closeNotes() { S.noteDrawer?.close(); }

  function openNotifications() {
    if (S.noteDrawer) return closeNotes();
    const seenBefore = S.lastRead;
    const dr = drawer({ title: "Notifications", sub: "What Ferry did, and anything that needs you", onClose: () => {
      // everything shown up to now counts as read
      const newest = S.notes.reduce((t, ev) => Math.max(t, Date.parse(ev.time) || 0), S.lastRead);
      S.lastRead = newest;
      localStorage.setItem("ferry-read", String(newest));
      S.noteDrawer = null;
      paintBadge();
      render();
    } });
    const head = h("div");
    const filters = h("div", { class: "filters", role: "group", "aria-label": "Show" });
    const list = h("div", { role: "list" });
    dr.body.append(head, filters, list);

    const desktop = h("input", { type: "checkbox", checked: S.prefs.desktop ? true : null });
    desktop.onchange = async () => {
      if (desktop.checked && "Notification" in window && Notification.permission !== "granted") {
        const p = await Notification.requestPermission();
        if (p !== "granted") { desktop.checked = false; toast("Your browser didn't allow pop-ups. You can allow them in its site settings.", true); }
      }
      S.prefs.desktop = desktop.checked;
      localStorage.setItem("ferry-note-prefs", JSON.stringify(S.prefs));
    };
    const routine = h("input", { type: "checkbox", checked: S.prefs.routine ? true : null });
    routine.onchange = () => { S.prefs.routine = routine.checked; localStorage.setItem("ferry-note-prefs", JSON.stringify(S.prefs)); paint(); };
    const markAll = h("button", { class: "btn small", onclick: () => { S.lastRead = Date.now(); localStorage.setItem("ferry-read", String(S.lastRead)); paint(); paintBadge(); } }, "Mark all as read");
    dr.foot.replaceChildren(h("div", { class: "note-prefs left" },
      h("label", { class: "check" }, desktop, h("span", {}, "Pop up on my desktop when something needs me", h("small", { class: "hint" }, "Only while this tab is in the background."))),
      h("label", { class: "check" }, routine, h("span", {}, "Include routine syncs under “All”"))), markAll);

    function paint() {
      const items = S.notes.map((ev) => ({ ev, d: describe(ev) })).filter((x) => x.d).reverse();
      const counts = { all: 0, needs: 0, errors: 0, commits: 0, sync: 0 };
      for (const x of items) { counts[x.d.cat]++; if (x.d.cat !== "sync" || S.prefs.routine) counts.all++; }
      const needsNow = items.filter((x) => x.d.cat === "needs" && Date.parse(x.ev.time) > seenBefore).length;
      const errorsNow = items.filter((x) => x.d.cat === "errors" && Date.parse(x.ev.time) > seenBefore).length;
      const open = S.pairs.reduce((n, p) => n + p.conflicts.length, 0);
      const mood = open || needsNow ? "worried" : errorsNow ? "sad" : items.length ? "happy" : "sleepy";
      const say = open ? `${plural(open, "conflict")} still ${open === 1 ? "needs" : "need"} your decision.` : needsNow ? `${plural(needsNow, "thing")} ${needsNow === 1 ? "needs" : "need"} you.` : errorsNow ? `${plural(errorsNow, "problem")} since you last looked.` : items.length ? "You're all caught up!" : "It's quiet here.";
      const hint = open || needsNow ? "They're at the top of the list." : items.length ? "Everything below is just so you know." : "Notifications appear here as Ferry syncs, commits and pushes.";
      head.replaceChildren(h("div", { class: "narrator" }, h("img", { src: face(mood), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, say), h("div", { class: "hint" }, hint))));
      filters.replaceChildren(...["all", "needs", "errors", "commits", "sync"].map((f) => h("button", { class: S.noteFilter === f ? "on" : "", "aria-pressed": S.noteFilter === f ? "true" : "false", onclick: () => { S.noteFilter = f; paint(); } },
        f === "all" ? "All" : CAT[f], counts[f] ? h("span", { class: "n" }, counts[f]) : null)));
      let shown = items.filter((x) => S.noteFilter === "all" ? (x.d.cat !== "sync" || S.prefs.routine) : x.d.cat === S.noteFilter);
      // what needs you comes first; then newest first
      if (S.noteFilter === "all") shown = [...shown.filter((x) => x.d.cat === "needs"), ...shown.filter((x) => x.d.cat !== "needs")];
      list.replaceChildren();
      if (!shown.length) {
        list.append(h("div", { class: "empty-row", style: { textAlign: "center" } }, S.noteFilter === "all" && counts.sync && !S.prefs.routine ? `Nothing important. ${plural(counts.sync, "routine sync")} hidden: see “Syncs”.` : "Nothing here."));
        return;
      }
      const day = (t) => {
        const d = new Date(t), today = new Date();
        const y = new Date(); y.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return "Today";
        if (d.toDateString() === y.toDateString()) return "Yesterday";
        return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
      };
      let group = "";
      for (const { ev, d } of shown.slice(0, 200)) {
        const g = S.noteFilter === "all" && d.cat === "needs" ? "Needs you" : day(ev.time);
        if (g !== group) { group = g; list.append(h("div", { class: "note-group" }, g)); }
        const fresh = Date.parse(ev.time) > seenBefore;
        list.append(h("div", { class: "note" + (fresh ? " unread" : ""), role: "listitem" },
          h("img", { src: face(d.mood), alt: "" }),
          h("div", {}, h("div", { class: "t" }, d.title), d.detail ? h("div", { class: "d" }, d.detail) : "",
            h("div", { class: "meta" }, h("span", { class: "pill" }, ev.pair), h("span", {}, noteTime(ev.time)), h("span", {}, "· " + CAT[d.cat]))),
          h("div", { class: "acts" }, d.action ? h("button", { class: "btn small" + (d.cat === "needs" ? " brand" : ""), onclick: d.action.run }, d.action.label) : "")));
      }
    }
    S.noteDrawer = { close: dr.close, paint };
    paint();
    render();
  }

  // ---------- rail ----------
  // ---------- the rail's width: thin, regular or wide (with labels) ----------
  const RAIL_SIZES = [["thin", "Thin"], ["", "Regular"], ["wide", "Wide"]];
  function setRail(v, announce = false) {
    setLook("rail", v);
    const i = Math.max(0, RAIL_SIZES.findIndex(([k]) => k === v));
    const grip = $("#rail-grip");
    grip.setAttribute("aria-valuenow", String(i));
    grip.setAttribute("aria-valuetext", RAIL_SIZES[i][1]);
    if (announce) toast(`Sidebar: ${RAIL_SIZES[i][1].toLowerCase()}`, false, "wink");
    if (S.mode === "settings") { S.setShown = ""; render(); }
  }
  /** Drag the rail's edge to snap between the three widths; ←/→ or double-click on it too. */
  function setupRailGrip() {
    const grip = $("#rail-grip"), rail = $(".rail");
    const cur = () => Math.max(0, RAIL_SIZES.findIndex(([k]) => k === (getLook().rail || "")));
    setRail(getLook().rail || "");
    grip.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setRail(RAIL_SIZES[Math.min(2, cur() + 1)][0], true); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setRail(RAIL_SIZES[Math.max(0, cur() - 1)][0], true); }
    });
    grip.addEventListener("dblclick", () => setRail(RAIL_SIZES[(cur() + 1) % 3][0], true));
    grip.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      document.documentElement.classList.add("rail-dragging");
      const left = rail.getBoundingClientRect().left;
      const zoom = parseFloat(getComputedStyle(document.body).zoom) || 1;
      // snap points sit between the widths (64 / 92 / 210 px)
      const move = (ev) => {
        const w = (ev.clientX - left) / zoom;
        const want = w < 78 ? "thin" : w < 150 ? "" : "wide";
        if (want !== (getLook().rail || "")) setRail(want);
      };
      const up = () => { document.documentElement.classList.remove("rail-dragging"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up); };
      grip.addEventListener("pointermove", move);
      grip.addEventListener("pointerup", up);
      grip.addEventListener("pointercancel", up);
    });
  }

  /** Relay in the rail: idles, perks up on hover, and celebrates on the way home. */
  function setupRailMascot(goHome) {
    const btn = $("#rail-home"), img = $("#rail-face");
    let resting = null; // the face render() wants, restored after a reaction
    const react = (mood, ms) => {
      if (resting == null) resting = img.getAttribute("src");
      btn.dataset.reacting = "1";
      img.src = face(mood);
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { delete btn.dataset.reacting; img.src = resting || face("happy"); resting = null; }, ms);
    };
    btn.addEventListener("mouseenter", () => { if (!btn.classList.contains("jump")) react("excited", 1400); });
    btn.addEventListener("click", () => {
      btn.classList.remove("jump"); void btn.offsetWidth; btn.classList.add("jump");
      react("party", 1100);
      setTimeout(() => btn.classList.remove("jump"), 700);
      goHome();
    });
  }

  // ---------- pull to refresh, with Relay ----------
  /**
   * At the top of the page, pull down (touch) or keep scrolling up (trackpad
   * or wheel): Relay drops in and follows the pull, a ring fills as it nears
   * the point of no return, and letting go refreshes what's on screen. Off
   * while a drawer, dialog or the big compare window is open, or while typing.
   */
  function setupPullToRefresh() {
    const ring = sv("svg", { class: "ptr-ring", viewBox: "0 0 60 60", "aria-hidden": "true" });
    const track = sv("circle", { cx: 30, cy: 30, r: 27, class: "ptr-track" });
    const arc = sv("circle", { cx: 30, cy: 30, r: 27, class: "ptr-arc", pathLength: "100" });
    ring.append(track, arc);
    const img = h("img", { class: "ptr-face", src: face("sleepy"), alt: "" });
    const label = h("span", { class: "ptr-text" }, "Pull to refresh");
    const el = h("div", { class: "ptr", role: "status", "aria-live": "polite" }, h("div", { class: "ptr-bubble" }, ring, img), label);
    document.body.append(el);
    const TRIGGER = 86, MAX = 150;
    let pull = 0, busy = false, armed = false;
    const blocked = (t) => busy || window.scrollY > 0 || document.querySelector('[aria-modal="true"]') ||
      (t && t.closest && t.closest("input, textarea, select, [contenteditable], .drawer, .cmp-wrap, .sx-div, .drawer-grip, .rail-grip"));
    const show = (p) => {
      pull = Math.max(0, Math.min(MAX, p));
      const k = Math.min(1, pull / TRIGGER);
      el.style.setProperty("--pull", pull + "px");
      el.style.setProperty("--k", k.toFixed(3));
      el.classList.toggle("on", pull > 2);
      const ready = pull >= TRIGGER;
      if (ready !== armed) {
        armed = ready;
        label.textContent = ready ? "Let go to refresh" : "Pull to refresh";
        img.src = face(ready ? "excited" : "sleepy");
        el.classList.toggle("ready", ready);
      }
    };
    const reset = () => { el.classList.remove("on", "ready", "busy", "done"); el.style.removeProperty("--pull"); pull = 0; armed = false; label.textContent = "Pull to refresh"; img.src = face("sleepy"); };
    const run = async () => {
      busy = true;
      el.classList.add("busy");
      el.style.setProperty("--pull", TRIGGER + "px");
      label.textContent = "Refreshing…";
      img.src = face("focused");
      const started = Date.now();
      try {
        if (S.mode === "git") { await checkRemote(true, false); await refreshGit(); }
        else { S.shown = ""; S.bump = (S.bump || 0) + 1; await refresh(); }
      } catch {}
      // stay long enough to read, even when it's instant
      await new Promise((r) => setTimeout(r, Math.max(0, 900 - (Date.now() - started))));
      el.classList.remove("busy"); el.classList.add("done");
      label.textContent = "Up to date";
      img.src = face("party");
      await new Promise((r) => setTimeout(r, 750));
      el.classList.add("leaving");
      await new Promise((r) => setTimeout(r, 260));
      el.classList.remove("leaving");
      reset();
      busy = false;
    };
    const release = () => { if (busy) return; if (pull >= TRIGGER) run(); else { el.classList.add("snap"); reset(); setTimeout(() => el.classList.remove("snap"), 260); } };

    // touch: pull with a little resistance, so it feels like stretching
    let startY = null;
    document.addEventListener("touchstart", (e) => { startY = e.touches.length === 1 && !blocked(e.target) ? e.touches[0].clientY : null; }, { passive: true });

    document.addEventListener("touchend", () => { if (startY != null) release(); startY = null; });

    // mouse: press on an empty part of the page and drag down, like pulling it with your finger.
    // It only takes over for a mostly vertical drag (sideways drags stay text selection), and not on controls or rows.
    let drag = null;
    const NOT_HERE = "button, a, input, textarea, select, label, summary, [role=slider], [role=separator], [role=row], .h-row, .fb-row, .gdock, .rail, .cmdbar, .pair, .sx, .md, pre, code";

      idle = setTimeout(release, 220);

  // ---------- Relay asks ----------
  /**
   * Relay asks a question from the bottom of the screen and reacts to where
   * you are about to click. With hold: true the risky choice has to be
   * pressed and held, so a slip of the mouse can't do it. Resolves true/false.
   * The safe "no" is the highlighted button, unless primary: "yes" (for asks
   * that build something rather than remove it).
   */
  function relayAsk({ mood: m = "thinking", title, text, yes = "Yes", no = "Cancel", hold = false, yesMood = "sad", noMood = "happy", fields = null, primary = "no" }) {
    return new Promise((resolve) => {
      const img = h("img", { class: "face bob", src: face(m), alt: "Relay" });
      const say = h("h3", {}, title);
      const sub = h("p", {}, text);
      const inputs = {};
      const form = fields ? h("div", { class: "ask-fields" }, fields.map((f) => {
        const el = f.type === "check" ? h("input", { type: "checkbox", checked: f.value ? true : null }) : h("input", { type: "text", value: f.value || "", placeholder: f.placeholder || "" });
        inputs[f.name] = el;
        return f.type === "check" ? h("label", { class: "check" }, el, h("span", {}, f.label)) : h("label", { class: "field" }, h("span", { class: "label" }, f.label), el, f.hint ? h("small", {}, f.hint) : null);
      })) : null;
      const values = () => Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.type === "checkbox" ? el.checked : el.value.trim()]));
      const yesFirst = primary === "yes" && !hold;
      const noBtn = h("button", { class: "btn" + (yesFirst ? " ghost" : " brand") }, no);
      const yesBtn = h("button", { class: "btn" + (hold ? " hold danger" : yesFirst ? " brand" : "") }, h("i", { class: "prog" }), h("span", {}, hold ? "Hold to " + yes.toLowerCase() : yes));
      const wrap = h("div", { class: "ask-wrap", role: "alertdialog", "aria-modal": "true", "aria-label": title },
        h("div", { class: "ask" }, img, say, sub, form, h("div", { class: "row" }, noBtn, yesBtn),
          hold ? h("div", { class: "note" }, "Press and hold for a second (or hold Space), so a slip of the mouse can't do it.") : null));
      let done = false;
      const finish = (v, last) => {
        if (done) return;
        done = true;
        const end = () => { wrap.classList.remove("open"); setTimeout(() => wrap.remove(), 220); document.removeEventListener("keydown", onKey); resolve(v); };
        if (last) { img.src = face(last.mood); say.textContent = last.say; sub.textContent = last.text || ""; setTimeout(end, 950); }
        else end();
      };
      const onKey = (e) => { if (e.key === "Escape") finish(false); };
      document.addEventListener("keydown", onKey);
      wrap.addEventListener("click", (e) => { if (e.target === wrap) finish(false); });
      noBtn.onclick = () => finish(false, hold ? { mood: "party", say: "Yay, I'll keep going!" } : null);
      noBtn.onmouseenter = noBtn.onfocus = () => { if (!done) img.src = face(noMood); };
      yesBtn.onmouseenter = yesBtn.onfocus = () => { if (!done) img.src = face(yesMood); };
      [noBtn, yesBtn].forEach((b) => { b.onmouseleave = () => { if (!done) img.src = face(m); }; });
      if (!hold) yesBtn.onclick = () => finish(fields ? values() : true);
      if (fields) Object.values(inputs).forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") yesBtn.click(); }));
      else {
        let start = 0, raf = 0;
        const tick = () => {
          const pr = Math.min(1, (performance.now() - start) / 1100);
          yesBtn.style.setProperty("--p", pr);
          if (pr >= 1) return finish(true, { mood: "sleepy", say: "Okay. I'll stop here.", text: "Your files stay exactly where they are." });
          raf = requestAnimationFrame(tick);
        };
        const down = (e) => {
          if (done || start) return;
          if (e.type === "keydown" && ((e.key !== " " && e.key !== "Enter") || e.repeat)) return;
          e.preventDefault();
          start = performance.now();
          img.src = face("sad");
          say.textContent = "Are you sure? Keep holding…";
          raf = requestAnimationFrame(tick);
        };
        const up = () => {
          if (done || !start) return;
          cancelAnimationFrame(raf);
          start = 0;
          yesBtn.style.setProperty("--p", 0);
          img.src = face("happy");
          say.textContent = "Phew! I'm still here.";
        };
        yesBtn.addEventListener("pointerdown", down);
        yesBtn.addEventListener("keydown", down);
        ["pointerup", "pointerleave", "pointercancel", "keyup", "blur"].forEach((ev) => yesBtn.addEventListener(ev, up));

      document.body.append(wrap);
      requestAnimationFrame(() => { wrap.classList.add("open"); (fields ? Object.values(inputs)[0] : noBtn).focus(); });
    });

  // ---------- change story (diff) ----------
  /** Groups unified-diff lines into changes, each with a little context before and after. */
  function parseDiff(lines) {
    const notes = [], changes = [];
    let oldNo = 1, newNo = 1, maxNo = 0, ctx = [], cur = null;
    const close = () => { if (cur) { changes.push(cur); cur = null; } };
    for (const l of lines) {
      if (l.op === "@") {
        const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l.text);
        if (m) { close(); oldNo = +m[1]; newNo = +m[2]; ctx = []; continue; }
        notes.push(l.text);
        continue;
      }
      if (l.op === " ") {
        const row = { text: l.text, oldNo, newNo };
        if (cur) {
          cur.after.push(row);
          if (cur.after.length >= 2) close();
        }
        ctx.push(row);
        if (ctx.length > 2) ctx.shift();
        oldNo++; newNo++;
      } else {
        if (cur && cur.after.length) close();
        if (!cur) cur = { removed: [], added: [], before: ctx.slice(), after: [], at: newNo };
        if (l.op === "-") { cur.removed.push({ text: l.text, oldNo }); oldNo++; }
        else { cur.added.push({ text: l.text, newNo }); newNo++; }
      }
      maxNo = Math.max(maxNo, oldNo - 1, newNo - 1);
    }
    close();
    for (const c of changes) c.kind = c.removed.length && c.added.length ? "edit" : c.added.length ? "add" : "del";
    return { notes, changes, maxNo };
  }

  /** Word-level differences between two lines: [{t, op}] with op "", "+" or "-". */
  function wordDiff(a, b) {
    const A = a.match(/\s+|\w+|[^\w\s]/g) || [], B = b.match(/\s+|\w+|[^\w\s]/g) || [];
    if (A.length * B.length > 60000) return [{ t: a, op: "-" }, { t: b, op: "+" }];
    const dp = Array.from({ length: A.length + 1 }, () => new Int32Array(B.length + 1));
    for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = [];
    let i = 0, j = 0;
    const push = (t, op) => { const last = out[out.length - 1]; if (last && last.op === op) last.t += t; else out.push({ t, op }); };
    while (i < A.length || j < B.length) {
      if (i < A.length && j < B.length && A[i] === B[j]) { push(A[i], ""); i++; j++; }
      else if (j < B.length && (i >= A.length || dp[i][j + 1] >= dp[i + 1][j])) { push(B[j], "+"); j++; }
      else { push(A[i], "-"); i++; }
    }
    return out;
  }
  const sideText = (parts, keep) => h("div", { class: "txt" }, parts.filter((x) => x.op === "" || x.op === keep).map((x) => x.op === "" ? x.t : h(keep === "+" ? "ins" : "del", { class: "w" }, x.t)));

  /** One plain sentence about what changed, for people who don't read diffs. */
  function story(d, file) {
    let added = 0, removed = 0, edited = 0;
    for (const c of d.changes) {
      const pairs = c.kind === "edit" ? Math.min(c.removed.length, c.added.length) : 0;
      edited += pairs;
      added += c.added.length - pairs;
      removed += c.removed.length - pairs;
    }
    const parts = [];
    if (added) parts.push(`added ${plural(added, "new line")}`);
    if (edited) parts.push(`edited ${plural(edited, "line")}`);
    if (removed) parts.push(`removed ${plural(removed, "line")}`);
    const what = parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts[0] || "changed nothing visible";
    let where = "";
    if (d.changes.length && d.maxNo > 20) {
      const pos = d.changes.map((c) => c.at / d.maxNo);
      const avg = pos.reduce((a, b) => a + b, 0) / pos.length;
      where = d.changes.length > 1 && Math.max(...pos) - Math.min(...pos) > .5 ? ", in different parts of the file"
        : avg < .33 ? " near the top" : avg > .66 ? " near the end" : " in the middle";
    }
    return { title: `I found ${plural(d.changes.length, "change")} in ${file}.`, detail: `You ${what}${where}.`, added, removed, edited };
  }

  /** Renders a diff (from /diff?format=json or the Git client) as Relay's change story into body. */
  /**
   * The change map: the whole file as a track, each change a numbered pin at
   * its place (and as wide as it is), coloured by what happened: edited lines
   * amber, new green, removed red, split when one change does several.
   * Hovering or focusing a pin says what it is; clicking jumps to it.
   */
  function changeMap(parsed, marks, go) {
    const total = Math.max(1, parsed.maxNo);
    const pct = (line) => Math.max(0, Math.min(100, ((line - 1) / total) * 100));
    const n = parsed.changes.length;
    const kinds = new Set();
    // pins sit above their change, nudged apart so neighbours never cover each other
    const centres = parsed.changes.map((c) => pct(c.at) + Math.max(1.2, ((c.added.length || c.removed.length) / total) * 100) / 2);
    const gap = Math.min(4.2, 100 / Math.max(1, n));
    const pins = centres.slice();
    for (let k = 1; k < n; k++) pins[k] = Math.max(pins[k], pins[k - 1] + gap);
    for (let k = n - 1; k >= 0; k--) pins[k] = Math.min(pins[k], k === n - 1 ? 99 : pins[k + 1] - gap);
    const track = h("div", { class: "map-track", role: "group", "aria-label": `${plural(n, "change")} across the file` });
    parsed.changes.forEach((c, k) => {
      const edited = Math.min(c.added.length, c.removed.length);
      const extraAdd = c.added.length - edited, extraDel = c.removed.length - edited;
      const size = edited + extraAdd + extraDel;
      const left = pct(c.at);
      const width = Math.min(100 - left, Math.max(1.2, ((c.added.length || c.removed.length) / total) * 100));
      // colour stripes in proportion: edited, then new, then removed
      const parts = [[edited, "var(--map-edit)"], [extraAdd, "var(--map-add)"], [extraDel, "var(--map-del)"]].filter(([v]) => v > 0);
      if (edited) kinds.add("edit"); if (extraAdd) kinds.add("add"); if (extraDel) kinds.add("del");

      const bg = parts.length === 1 ? parts[0][1] : "linear-gradient(90deg," + parts.map(([v, col]) => { const a = acc; acc += (v / size) * 100; return `${col} ${a}% ${acc}%`; }).join(",") + ")";
      const first = c.added.length ? c.added[0] : null, last = c.added.length ? c.added[c.added.length - 1] : null;
      const where = first ? (first.newNo === last.newNo ? `Line ${first.newNo}` : `Lines ${first.newNo}–${last.newNo}`) : `After line ${Math.max(1, c.at - 1)}`;
      const what = [edited ? plural(edited, "line") + " edited" : "", extraAdd ? `${extraAdd} new` : "", extraDel ? `${extraDel} removed` : ""].filter(Boolean).join(", ");

      const side = pins[k] > 72 ? "right" : pins[k] < 28 ? "left" : "mid";

        h("span", { class: "pin", style: { left: pinAt + "%" } }, String(k + 1)),
