<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script>
  // pick the theme before anything is drawn, so the page never flashes the wrong one
  (() => {
    const saved = localStorage.getItem("ferry-theme"); // light | dark | system (or unset: system)
    const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    const root = document.documentElement;
    root.dataset.theme = dark ? "dark" : "light";
    // accent colour, interface size and motion from Settings → Appearance
    let look = {};
    try { look = JSON.parse(localStorage.getItem("ferry-look") || "{}"); } catch {}
    for (const k of ["accent", "bg", "size", "motion"]) if (look[k]) root.dataset[k] = look[k];
  })();
</script>
<style>
/* ---------- themes (brand: navy #092348, blue #2586E6, mint #66E4C0) ---------- */
:root, [data-theme="light"] {
  --bg: linear-gradient(135deg, #DDF6EE 0%, #E4EEFF 48%, #ECE6FF 100%);
  --rail: rgba(255,255,255,.62); --card: rgba(255,255,255,.78); --card-solid: #FFFFFF; --card2: rgba(240,245,252,.9);
  --line: rgba(9,35,72,.09); --text: #0B2147; --muted: #5E6C86; --faint: #94A0B6;
  --accent: #2586E6; --accent-2: #3CCBB0; --accent-text: #FFFFFF; --accent-soft: rgba(37,134,230,.12);
  --pill: #FFFFFF; --pill-text: #0B2147;
  --green: #12805A; --green-soft: #DDF7EC; --red: #C8343F; --red-soft: #FDE7E9; --amber: #A3620A; --amber-soft: #FFF1D6;
  --violet: #6D4BD8; --violet-soft: #ECE6FF;
  --ins: #CFF5E3; --ins-text: #0B5D3E; --del: #FFD9DD; --del-text: #8E1D29;
  --shadow: 0 10px 30px rgba(9,35,72,.08), 0 2px 6px rgba(9,35,72,.05);
  --overlay: rgba(9,35,72,.28);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: linear-gradient(135deg, #071430 0%, #0D1E40 50%, #1A1844 100%);
  --rail: rgba(14,25,50,.7); --card: rgba(17,29,56,.82); --card-solid: #13213F; --card2: rgba(26,40,72,.9);
  --line: rgba(226,236,255,.09); --text: #E8EEF9; --muted: #A2AECA; --faint: #6E7A96;
  --accent: #4C9DF5; --accent-2: #4FD8BD; --accent-text: #061127; --accent-soft: rgba(76,157,245,.16);
  --pill: #1B2B4F; --pill-text: #E8EEF9;
  --green: #4ADE9B; --green-soft: rgba(74,222,155,.13); --red: #FF7B86; --red-soft: rgba(255,123,134,.13); --amber: #F7BE55; --amber-soft: rgba(247,190,85,.13);
  --violet: #B79CFF; --violet-soft: rgba(183,156,255,.14);
  --ins: rgba(74,222,155,.2); --ins-text: #8FF0C3; --del: rgba(255,123,134,.2); --del-text: #FFB3BA;
  --shadow: 0 12px 34px rgba(0,0,0,.35);
  --overlay: rgba(2,8,22,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 14.5px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------- layout ---------- */
/* Interface size zooms the page; zoom also scales vh, so heights divide by it to keep fitting the window */
:root { --zoom: 1; } [data-size="small"] { --zoom: .9; } [data-size="large"] { --zoom: 1.1; }
body { zoom: var(--zoom); }
.app { display: grid; grid-template-columns: 92px 320px minmax(0, 1fr); gap: 18px; padding: 18px; min-height: calc(100vh / var(--zoom)); }
@media (max-width: 1100px) {
  /* the list sits above the page; the rail spans both so the page starts right under the list */
  .app { grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .rail { grid-column: 1; grid-row: 1 / span 2; }
  .pairs-col { grid-column: 2; grid-row: 1; } .main { grid-column: 2; grid-row: 2; }
  .app.settings-mode .main { grid-row: 1 / span 2; }
}

.rail { background: var(--rail); backdrop-filter: blur(16px); border-radius: 30px; padding: 16px 0; display: flex; flex-direction: column; align-items: center; gap: 14px; position: sticky; top: 18px; height: calc(100vh / var(--zoom) - 36px); box-shadow: var(--shadow);
  overflow-y: auto; scrollbar-width: none; z-index: 5; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { flex: none; }
.rail .grow { flex: 1; }
.rail-btn { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--pill); color: var(--text); display: grid; place-items: center; cursor: pointer; position: relative; box-shadow: 0 2px 8px rgba(9,35,72,.06); transition: transform .15s; }
.rail-btn:hover { transform: translateY(-2px); }
.rail-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.rail-btn svg { width: 22px; height: 22px; }
.avatar { width: 62px; height: 62px; border-radius: 50%; background: var(--card-solid); display: grid; place-items: center; position: relative; box-shadow: 0 4px 14px rgba(9,35,72,.12); }
.avatar img { width: 50px; height: 38px; }
.avatar .dot { position: absolute; right: 2px; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--card-solid); background: var(--faint); }
.dot.ok { background: #2BC48A !important; } .dot.bad { background: #FF5C6C !important; }

.card { background: var(--card); backdrop-filter: blur(18px); border-radius: 26px; box-shadow: var(--shadow); }

/* ---------- pairs column ---------- */
.pairs-col { display: flex; flex-direction: column; gap: 14px; }
.pairs-head { padding: 18px 18px 12px; display: flex; align-items: center; gap: 10px; }
.pairs-head h2 { font-size: 17px; margin: 0; flex: 1; }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #FF7A59; color: #fff; font-size: 12px; font-weight: 700; }
.count.blue { background: var(--accent); }
.count.red { background: #E5484D; }
.pair-list { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.pair { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 18px; border: 2px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.pair:hover { background: var(--accent-soft); }
/* the selected one: a border in Relay's gradient (the accent pair, so it follows Settings → Accent) */
.pair.sel { background: linear-gradient(var(--card-solid), var(--card-solid)) padding-box, linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 18%, transparent); }
.pair img { width: 44px; height: 32px; }
.pair > div { min-width: 0; }
a.btn { text-decoration: none; }
.pill svg { width: 14px; height: 14px; flex: none; }
.pair .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-empty { padding: 4px 18px 18px; color: var(--muted); font-size: 13px; }

/* ---------- buttons, pills ---------- */
.btn { border: 0; border-radius: 99px; padding: 9px 18px; background: var(--pill); color: var(--pill-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 550; box-shadow: 0 2px 8px rgba(9,35,72,.06); white-space: nowrap; transition: transform .12s, filter .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--text); color: var(--card-solid); }
[data-theme="dark"] .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #061127; }
.btn.brand { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--red); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.btn.icon { padding: 8px; border-radius: 50%; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--card2); color: var(--muted); white-space: nowrap; }
.pill.green { background: var(--green-soft); color: var(--green); } .pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.violet { background: var(--violet-soft); color: var(--violet); }
.pill.solid-blue { background: var(--accent); color: #fff; } .pill.solid-green { background: #19A974; color: #fff; } .pill.solid-red { background: #E5484D; color: #fff; } .pill.solid-violet { background: #8B6CF0; color: #fff; }

/* ---------- main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; padding: 6px 4px 0; }
.crumbs b { color: var(--text); font-weight: 600; }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 0 4px; }
.title-row h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
.title-row .grow { flex: 1; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.paths { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 4px; font-size: 12.5px; color: var(--muted); }
.paths code { background: var(--card); padding: 3px 10px; border-radius: 99px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--text); max-width: 100%; overflow-wrap: anywhere; }

.hero { display: flex; align-items: center; gap: 18px; padding: 14px 22px; }
.hero img { width: 112px; height: 82px; flex: none; }
.hero img.anim { width: 150px; height: 71px; }
.bubble { position: relative; background: var(--card-solid); border-radius: 20px; padding: 12px 16px; flex: 1; min-width: 0; box-shadow: 0 2px 10px rgba(9,35,72,.06); }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--card-solid); border-left: 0; }
.bubble .say { font-weight: 650; font-size: 15.5px; }
.bubble .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
.track { height: 9px; border-radius: 99px; background: var(--card2); overflow: hidden; margin-top: 8px; }
.track .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .35s ease; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 0 4px; }
.toolbar .grow { flex: 1; }
.tab { border: 0; border-radius: 99px; padding: 10px 20px; background: var(--pill); color: var(--pill-text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 2px 8px rgba(9,35,72,.06); }
.tab svg { width: 18px; height: 18px; }
.tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.tab .count { margin-left: 2px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--pill); border-radius: 99px; padding: 8px 16px; min-width: 240px; box-shadow: 0 2px 8px rgba(9,35,72,.06); }
.search input[type=text] { border: 0; outline: 0; background: none; flex: 1; min-width: 0; padding: 2px 0; border-radius: 0; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }

/* ---------- sections (collapsible groups) ---------- */
.body { display: flex; flex-direction: column; gap: 14px; }
.section { padding: 8px 8px 12px; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.section-head .toggle { border: 0; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; padding: 0; }
.section-head .caret { width: 18px; height: 18px; transition: transform .2s; color: var(--muted); display: inline-flex; }
.section.closed .caret { transform: rotate(-90deg); }
.section.closed .section-body { display: none; }
.section-title { display: inline-flex; align-items: center; gap: 10px; background: var(--card-solid); border-radius: 99px; padding: 6px 16px; font-weight: 700; font-size: 16px; box-shadow: 0 2px 8px rgba(9,35,72,.05); }
.section-head .grow { flex: 1; }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 14px; }
.table td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
.table tr:hover td { background: var(--accent-soft); }
.table .file { font-weight: 600; overflow-wrap: anywhere; }
.table .file small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.table .end { text-align: right; white-space: nowrap; }
.empty-row { padding: 18px 16px; color: var(--muted); }
@media (max-width: 800px) { .table .opt { display: none; } }

.callout { margin: 0 12px 10px; padding: 12px 16px; border-radius: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.callout.amber { background: var(--amber-soft); color: var(--amber); }
.callout .grow { flex: 1; min-width: 220px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 4px 12px 14px; }
.tile { background: var(--card-solid); border-radius: 20px; padding: 14px 16px; }
.tile .v { font-size: 26px; font-weight: 800; }
.tile .l { color: var(--muted); font-size: 13px; }
.bars { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 56px 1fr 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .t { height: 12px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar .f { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

.field { display: block; margin: 0 0 16px; }
.field > .label, .field .label { display: block; font-weight: 650; margin-bottom: 6px; }
.field small, .hint { display: block; color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.field-error { color: var(--red) !important; font-weight: 600; }
input[type=text], input[type=password], input[type=search], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card-solid); border-radius: 14px; padding: 10px 14px; }
textarea { min-height: 70px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
input.invalid { border-color: var(--red); }
.inline { display: flex; gap: 8px; align-items: center; }
.inline > input[type=text] { flex: 1; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .choices { grid-template-columns: 1fr; } }
.choice { border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; cursor: pointer; background: var(--card-solid); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-right: 6px; accent-color: var(--accent); }
.choice small { display: block; color: var(--muted); margin-top: 4px; }
details.more { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; }
details.more > summary { cursor: pointer; font-weight: 650; padding: 6px 0; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .25s; z-index: 30; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(560px, calc(100vw - 24px)); background: var(--card-solid); border-radius: 28px; box-shadow: -20px 0 60px rgba(9,35,72,.25); z-index: 31; display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.drawer.wide { width: min(900px, calc(100vw - 24px)); }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
.drawer-head .sub { color: var(--muted); font-size: 13px; }
.drawer-body { padding: 18px 22px; overflow: auto; flex: 1; }
.drawer-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.drawer-foot .left { margin-right: auto; }
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }

/* folder picker (inside the add drawer) */
.crumbpath { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.crumbpath button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 3px 7px; border-radius: 8px; }
.crumbpath button:hover { background: var(--accent-soft); }
.crumbpath .here { color: var(--text); font-weight: 700; cursor: default; }
.crumbpath .here:hover { background: none; }
.crumbpath .sep { color: var(--faint); }
.dirs { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.dir { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 11px 16px; cursor: pointer; border-top: 1px solid var(--line); }
.dir:first-child { border-top: 0; }
.dir:hover { background: var(--accent-soft); }
.dir svg { width: 18px; height: 18px; color: var(--accent); }
.dir .chev { margin-left: auto; color: var(--faint); }

/* ---------- change story (diff) ---------- */
.narrator { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.narrator img { width: 86px; height: 63px; flex: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.map { --map-add: #2BC48A; --map-del: #FF5C6C; --map-edit: #F5B33D; margin-bottom: 18px; }
.map-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.map-legend { display: flex; gap: 14px; font-weight: 500; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 10px; height: 10px; border-radius: 3px; }
.map-track { position: relative; height: 30px; margin-top: 30px; border-radius: 10px; background: var(--card2); }
.map-track .grid { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--muted) 18%, transparent); }
.map .mk { position: absolute; top: 6px; bottom: 6px; min-width: 7px; border-radius: 5px; border: 0; padding: 0; cursor: pointer;
  box-shadow: 0 0 0 2px var(--card2); transition: top .15s, bottom .15s, box-shadow .15s; }
.map .mk:hover, .map .mk.on { top: 2px; bottom: 2px; }
.map .mk.on { box-shadow: 0 0 0 2px var(--card2), 0 0 0 4px var(--text); }
.map .mk:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card2), 0 0 0 4px var(--accent); }
.map .pin { position: absolute; bottom: calc(100% + 8px); transform: translateX(-50%); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1; color: var(--text); background: var(--card-solid); border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent); box-shadow: 0 1px 4px rgba(9,35,72,.18); transition: transform .15s; }
.map .pin::after { content: ""; position: absolute; top: 100%; left: 50%; width: 2px; height: 6px; margin-left: -1px; background: color-mix(in srgb, var(--muted) 45%, transparent); }
.map .mk.on .pin { background: var(--text); color: var(--card-solid); transform: translateX(-50%) scale(1.1); }
.map .tip { position: absolute; top: calc(100% + 10px); transform: translateX(-50%); z-index: 5; width: max-content; max-width: 280px; padding: 9px 12px; border-radius: 12px;
  background: var(--text); color: var(--card-solid); font-size: 12px; line-height: 1.45; text-align: left; box-shadow: 0 8px 24px rgba(9,35,72,.28); pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .12s; }
.map .tip.left { transform: translateX(-14px); } .map .tip.right { transform: translateX(calc(-100% + 14px)); }
.map .tip b, .map .tip span, .map .tip code { display: block; }
.map .tip code { margin-top: 4px; font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .8; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.map .mk:hover .tip, .map .mk:focus-visible .tip { opacity: 1; visibility: visible; }
.map-ruler { position: relative; height: 22px; margin-top: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.map-ruler .tick { position: absolute; top: 0; transform: translateX(-50%); padding-top: 5px; }
.map-ruler .tick::before { content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 4px; background: currentColor; opacity: .5; }
.map-ruler .start { left: 0; transform: none; } .map-ruler .start::before { left: 0; }
.map-ruler .end { right: 0; left: auto; transform: none; } .map-ruler .end::before { left: auto; right: 0; }
@media (prefers-reduced-motion: reduce) { .map .mk, .map .pin, .map .tip { transition: none; } }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; font-size: 12.5px; }
.side { border-radius: 14px; padding: 8px 12px; background: var(--card2); }
.side b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.change { border-radius: 20px; border: 2px solid var(--line); margin-bottom: 14px; overflow: hidden; scroll-margin-top: 10px; }
.change.on { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.change-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: var(--card2); font-size: 13.5px; }
.change-head .grow { flex: 1; }
.change-head .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; flex: none; }
.ic.add { background: #19A974; } .ic.del { background: #E5484D; } .ic.edit { background: #E8A120; }
.lines { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.ln { display: grid; grid-template-columns: 54px 22px 1fr; align-items: start; }
.ln .no { color: var(--faint); text-align: right; padding: 3px 8px 3px 0; user-select: none; }
.ln .op { text-align: center; padding: 3px 0; user-select: none; font-weight: 700; }
.ln .tx { padding: 3px 12px 3px 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.ctx { color: var(--muted); }
.ln.add { background: var(--ins); } .ln.add .op, .ln.add .tx { color: var(--ins-text); }
.ln.del { background: var(--del); } .ln.del .op, .ln.del .tx { color: var(--del-text); }
.ln.del .tx { text-decoration: line-through; text-decoration-thickness: 1px; }
.edit-pair { padding: 8px 12px 10px; }
.edit-pair .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 2px; font-family: ui-rounded, system-ui, sans-serif; }
.edit-pair .txt { white-space: pre-wrap; overflow-wrap: anywhere; padding: 6px 10px; border-radius: 10px; background: var(--card2); }
ins.w { background: var(--ins); color: var(--ins-text); text-decoration: none; border-radius: 4px; padding: 0 2px; font-weight: 700; }
del.w { background: var(--del); color: var(--del-text); border-radius: 4px; padding: 0 2px; }
.classic { border-radius: 16px; background: var(--card2); padding: 8px 0; }
.classic .hdr { color: var(--accent); padding: 4px 14px; }
.seg { display: inline-flex; background: var(--card2); border-radius: 99px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 5px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--card-solid); color: var(--text); box-shadow: 0 1px 4px rgba(9,35,72,.1); }

/* ---------- Relay asks (confirmations) ---------- */
.ask-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: end center; padding: 24px; background: var(--overlay); opacity: 0; transition: opacity .2s; }
.ask-wrap.open { opacity: 1; }
.ask { width: min(520px, 100%); background: var(--card-solid); border-radius: 30px; padding: 22px; box-shadow: 0 30px 80px rgba(9,35,72,.35); transform: translateY(40px); transition: transform .3s cubic-bezier(.2,.8,.2,1); text-align: center; margin-top: 80px; }
.ask-wrap.open .ask { transform: none; }
.ask .face { width: 150px; height: 110px; margin: -80px auto 4px; display: block; filter: drop-shadow(0 10px 20px rgba(9,35,72,.25)); }
.ask .face.bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.ask h3 { margin: 0 0 6px; font-size: 19px; }
.ask p { margin: 0 0 18px; color: var(--muted); }
.ask .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.hold { position: relative; overflow: hidden; }
.hold .prog { position: absolute; inset: 0; background: var(--red-soft); transform-origin: left; transform: scaleX(var(--p, 0)); }
.hold span { position: relative; }
.ask .note { font-size: 12px; color: var(--faint); margin-top: 10px; }
.ask-fields { text-align: left; margin: 0 0 16px; }
@media (prefers-reduced-motion: reduce) { .ask, .ask-wrap { transition: none; } .ask .face.bob { animation: none; } }

/* ---------- misc ---------- */
.empty { text-align: center; padding: 50px 20px; }
.empty img { width: 190px; height: 140px; }
.empty h2 { margin: 10px 0 6px; font-size: 22px; }
.empty p { color: var(--muted); max-width: 480px; margin: 0 auto 16px; }
.float { animation: bob 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .float { animation: none; } }
/* ---------- settings ---------- */
.app.settings-mode { grid-template-columns: 92px minmax(0, 1fr); }
.app.settings-mode .pairs-col { display: none; }
.set-page { max-width: 1120px; margin: 0 auto; padding: 14px 24px 40px; width: 100%; }
.set-eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.set-eyebrow svg { width: 15px; height: 15px; }
.set-title { margin: 8px 0 4px; font-size: 30px; letter-spacing: -.01em; }
.set-sub { margin: 0 0 22px; color: var(--muted); }
.set-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.set-nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 18px; }
.set-nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-size: 14.5px; font-weight: 500; text-align: left; cursor: pointer; }
.set-nav-btn svg { width: 18px; height: 18px; }
.set-nav-btn:hover { background: var(--card2); color: var(--text); }
.set-nav-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.set-card { padding: 0; overflow: hidden; }
.set-card-head { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.set-card-head h2 { margin: 0; font-size: 17px; }
.set-chip { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.set-chip svg { width: 18px; height: 18px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row.tall { align-items: flex-start; }
.set-label { min-width: 0; flex: 1; }
.set-label b { display: block; font-size: 14.5px; font-weight: 600; }
.set-label small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; max-width: 460px; }
.set-control { flex: none; display: flex; justify-content: flex-end; }
.set-control input[type=text] { width: 300px; }
.set-control select { width: 260px; }
.set-inline { display: flex; align-items: center; gap: 10px; }
.set-path { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; unicode-bidi: plaintext; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; background: var(--card2); }
.set-banner { margin: 14px 22px 2px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--text); font-size: 13px; }
.set-banner.warn { background: var(--amber-soft); color: var(--amber); }
.set-group { padding: 16px 22px 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.set-group + .set-row { padding-top: 10px; }
.set-note { display: flex; align-items: center; gap: 12px; padding: 14px 22px; color: var(--muted); font-size: 13px; background: var(--card2); }
.set-note img { width: 46px; height: 34px; }
.set-about { display: flex; align-items: center; gap: 18px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.set-about img { width: 120px; height: 90px; } .set-about b { font-size: 18px; } .set-about p { margin: 4px 0 0; color: var(--muted); max-width: 520px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.swatch-btn { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .12s; }
.swatch-btn:hover { transform: scale(1.08); }
.swatch-btn.on { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px color-mix(in srgb, var(--text) 35%, transparent); }
.swatch-btn svg { width: 15px; height: 15px; stroke-width: 3; }
.switch { position: relative; display: inline-block; width: 44px; height: 26px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: color-mix(in srgb, var(--muted) 35%, transparent); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-picks { display: flex; gap: 12px; }
.theme-pick { width: 132px; padding: 8px; border-radius: 16px; border: 2px solid var(--line); background: var(--card-solid); cursor: pointer; color: var(--text); text-align: left; }
.theme-pick.on { border-color: var(--accent); }
.theme-name { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 4px 2px; font-weight: 600; font-size: 13.5px; }
.theme-name svg { width: 16px; height: 16px; color: var(--accent); stroke-width: 3; }
.theme-preview { display: grid; grid-template-columns: 18px 1fr; grid-template-rows: 1fr 1fr; gap: 5px; height: 70px; padding: 7px; border-radius: 10px; }
.theme-preview i { border-radius: 5px; } .theme-preview i:first-child { grid-row: span 2; }
.theme-preview.light { background: linear-gradient(135deg, #DDF6EE, #E4EEFF 50%, #ECE6FF); } .theme-preview.light i { background: #fff; } .theme-preview.light i:nth-child(2) { background: linear-gradient(135deg, #2586E6, #3CCBB0); }
.theme-preview.dark { background: linear-gradient(135deg, #071430, #1A1844); } .theme-preview.dark i { background: #13213F; } .theme-preview.dark i:nth-child(2) { background: linear-gradient(135deg, #4C9DF5, #4FD8BD); }
.theme-preview.system { background: linear-gradient(115deg, #E4EEFF 0 50%, #0D1E40 50% 100%); } .theme-preview.system i { background: linear-gradient(115deg, #fff 0 50%, #13213F 50%); }
@media (max-width: 1000px) { .set-grid { grid-template-columns: 1fr; } .set-nav { position: static; flex-direction: row; flex-wrap: wrap; } .set-row { flex-wrap: wrap; } .set-control input[type=text], .set-control select { width: 100%; } }
.bg-picks { display: grid; grid-template-columns: repeat(3, 92px); gap: 12px; }
.bg-pick { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.bg-preview { width: 92px; height: 54px; border-radius: 12px; display: grid; place-items: center; color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
.bg-preview svg { width: 18px; height: 18px; stroke-width: 3; padding: 3px; border-radius: 50%; background: var(--card-solid); }
.bg-pick.on { color: var(--text); } .bg-pick.on .bg-preview { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--accent); }
.bg-pick:focus-visible { outline: none; } .bg-pick:focus-visible .bg-preview { box-shadow: 0 0 0 2px var(--card-solid), 0 0 0 4px var(--text); }
/* backgrounds: a light and a dark version of each */
:root {
  --bg-relay-l: linear-gradient(135deg, #DDF6EE 0%, #E4EEFF 48%, #ECE6FF 100%); --bg-relay-d: linear-gradient(135deg, #071430 0%, #0D1E40 50%, #1A1844 100%);
  --bg-plain-l: #F3F5FA; --bg-plain-d: #0B1328;
  --bg-sky-l: linear-gradient(160deg, #DCEBFF 0%, #EEF5FF 55%, #F7FAFF 100%); --bg-sky-d: linear-gradient(160deg, #061A36 0%, #0A2546 55%, #0C2C52 100%);
  --bg-mint-l: linear-gradient(160deg, #D9F5EA 0%, #EAF9F3 55%, #F5FCF9 100%); --bg-mint-d: linear-gradient(160deg, #04201B 0%, #082B26 55%, #0B332E 100%);
  --bg-lavender-l: linear-gradient(160deg, #E9E2FF 0%, #F2EEFF 55%, #F9F7FF 100%); --bg-lavender-d: linear-gradient(160deg, #130E31 0%, #1C1542 55%, #221A4E 100%);
  --bg-sand-l: linear-gradient(160deg, #F8EBDA 0%, #FCF4EA 55%, #FFFAF4 100%); --bg-sand-d: linear-gradient(160deg, #1C140C 0%, #261B11 55%, #2D2115 100%);
}
[data-bg="plain"] { --bg: var(--bg-plain-l); } [data-theme="dark"][data-bg="plain"] { --bg: var(--bg-plain-d); }
[data-bg="sky"] { --bg: var(--bg-sky-l); } [data-theme="dark"][data-bg="sky"] { --bg: var(--bg-sky-d); }
[data-bg="mint"] { --bg: var(--bg-mint-l); } [data-theme="dark"][data-bg="mint"] { --bg: var(--bg-mint-d); }
[data-bg="lavender"] { --bg: var(--bg-lavender-l); } [data-theme="dark"][data-bg="lavender"] { --bg: var(--bg-lavender-d); }
[data-bg="sand"] { --bg: var(--bg-sand-l); } [data-theme="dark"][data-bg="sand"] { --bg: var(--bg-sand-d); }
/* accents */
[data-accent="ocean"] { --accent: #0E7CC2; --accent-2: #2BB3D9; }
[data-accent="forest"] { --accent: #1E8C5A; --accent-2: #6DB85C; }
[data-accent="sunset"] { --accent: #D9531F; --accent-2: #EFA233; }
[data-accent="grape"] { --accent: #7C4DDB; --accent-2: #C94FBE; }
[data-accent="graphite"] { --accent: #3D4A63; --accent-2: #7A8AA8; }
[data-theme="dark"][data-accent="ocean"] { --accent: #3FA9F5; --accent-2: #5FD3F0; }
[data-theme="dark"][data-accent="forest"] { --accent: #3CCB7F; --accent-2: #9BE07E; }
[data-theme="dark"][data-accent="sunset"] { --accent: #FF7A45; --accent-2: #FFC15C; }
[data-theme="dark"][data-accent="grape"] { --accent: #A47CFF; --accent-2: #F07FE3; }
[data-theme="dark"][data-accent="graphite"] { --accent: #9AA8C7; --accent-2: #C9D3E8; }
[data-accent] { --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent); }
/* interface size and motion */
[data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
/* ---------- heatmaps (sequential blue: light → dark in light mode, flipped in dark) ---------- */
:root, [data-theme="light"] { --heat0: rgba(9,35,72,.07); --heat1: #b7d3f6; --heat2: #6da7ec; --heat3: #2a78d6; --heat4: #184f95; }
[data-theme="dark"] { --heat0: rgba(255,255,255,.07); --heat1: #184f95; --heat2: #2a78d6; --heat3: #5598e7; --heat4: #9ec5f4; }
.heat { display: block; border-radius: 3px; background: var(--heat0); }
.heat.l1 { background: var(--heat1); } .heat.l2 { background: var(--heat2); } .heat.l3 { background: var(--heat3); } .heat.l4 { background: var(--heat4); }
.heat.future { background: transparent; }
.heat-wrap { position: relative; padding: 6px 16px 14px; }
.heat-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; }
.heat-legend { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
.heat-legend span { margin: 0 4px; }
.heat-legend i.heat { width: 12px; height: 12px; }
.heat-tip { position: absolute; z-index: 6; transform: translate(-50%, -100%); padding: 7px 11px; border-radius: 10px; background: var(--text); color: var(--card-solid);
  font-size: 12px; line-height: 1.4; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; box-shadow: 0 8px 22px rgba(9,35,72,.25); }
.heat-tip.on { opacity: 1; } .heat-tip.flip-l { transform: translate(-12px, -100%); } .heat-tip.flip-r { transform: translate(calc(-100% + 12px), -100%); }
.heat-tip b, .heat-tip span { display: block; }
.cal { display: grid; grid-template-columns: 30px minmax(0, 1fr); row-gap: 4px; }
.cal-months { white-space: nowrap; display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); gap: 3px; font-size: 11px; color: var(--muted); }
.cal-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font-size: 10.5px; color: var(--muted); }
.cal-days span { display: flex; align-items: center; }
.cal-grid { display: grid; grid-template-columns: repeat(53, minmax(0, 1fr)); grid-template-rows: repeat(7, auto); gap: 3px; }
.cal-grid .heat { aspect-ratio: 1; cursor: pointer; }
.cal-grid .heat:hover, .cal-grid .heat:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.cal-grid .heat.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-grid .heat.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-grid:focus-within { outline: none; }
.day-list { margin: 4px 16px 14px; padding: 10px; border-radius: 16px; background: var(--card2); }
.day-head { display: flex; justify-content: space-between; gap: 10px; padding: 2px 10px 8px; font-size: 13.5px; }
.day-commit { display: flex; gap: 12px; align-items: baseline; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: none; color: var(--text); text-align: left; cursor: pointer; font-size: 13.5px; }
.day-commit:hover, .day-commit:focus-visible { background: var(--card-solid); }
.day-commit .mono { color: var(--accent); font-size: 12px; }
.day-commit .grow { flex: 1; } .day-commit small { color: var(--muted); }
.hour-grid { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; }
.hour-grid .heat { height: 18px; }
.hour-grid .hour-label { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; }
.hour-grid .row-label { font-size: 11px; color: var(--muted); display: flex; align-items: center; }
.file-heat { display: flex; flex-direction: column; gap: 3px; }
.fh-row { display: grid; grid-template-columns: minmax(150px, 2.2fr) repeat(12, minmax(14px, 1fr)) 92px; gap: 3px; align-items: center; }
.fh-row .heat { height: 26px; }
.fh-row.head { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.fh-file { min-width: 0; padding-right: 8px; overflow: hidden; }
.fh-file b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fh-file small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fh-month { text-align: center; white-space: nowrap; }
.fh-total { text-align: right; font-variant-numeric: tabular-nums; }
.fh-total b { display: block; font-size: 13px; } .fh-total small { color: var(--muted); font-size: 11px; }
.insight-who { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin: 2px 0 10px; font-size: 13px; }
.insight-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.insight-tiles .tile .v { font-size: 22px; white-space: nowrap; }
@media (max-width: 900px) { .insight-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .heat-tip { transition: none; } }
/* ---------- history graph ---------- */
.h-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 2px 16px 10px; }
.h-search { max-width: 340px; }
.h-scroll { overflow-x: auto; }
.h-rows { --graph-w: 34px; }
.h-row { display: grid; grid-template-columns: var(--graph-w) minmax(130px, 200px) 84px minmax(0, 1fr) minmax(112px, 152px); align-items: center; column-gap: 14px; height: 44px; padding: 0 16px 0 6px; cursor: pointer; border-radius: 12px; }
.h-row:not(.h-head):hover, .h-row:focus-visible { background: var(--accent-soft); outline: none; }
.h-row.is-head .h-subject { font-weight: 700; }
.h-head { height: 34px; cursor: default; font-size: 12.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 2px; }
.h-graph { height: 44px; display: block; overflow: hidden; }
.h-graph .graph { display: block; }
.graph .edge { fill: none; stroke-width: 2; stroke-linecap: round; }
.graph .node { fill: var(--lane); stroke: var(--card-solid); stroke-width: 2; }
.graph .node.merge { fill: var(--card-solid); stroke: var(--lane); stroke-width: 2.5; }
.graph .node.head { stroke: var(--text); stroke-width: 2.5; }
.h-rows.searching .h-graph svg { visibility: hidden; }
.h-author { display: flex; align-items: center; gap: 10px; min-width: 0; }
.h-avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
.h-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.h-commit { color: var(--accent); font-size: 12.5px; } .h-head .h-commit { color: inherit; font-size: inherit; }
.h-msg .refpill svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 3px; }

   * that build something rather than remove it).

  function relayAsk({ mood: m = "thinking", title, text, yes = "Yes", no = "Cancel", hold = false, yesMood = "sad", noMood = "happy", fields = null, primary = "no" }) {
    return new Promise((resolve) => {
      const img = h("img", { class: "face bob", src: face(m), alt: "Relay" });
      const say = h("h3", {}, title);
      const sub = h("p", {}, text);
      const inputs = {};
      const form = fields ? h("div", { class: "ask-fields" }, fields.map((f) => {
        const el = f.type === "check" ? h("input", { type: "checkbox", checked: f.value ? true : null }) : h("input", { type: "text", value: f.value || "", placeholder: f.placeholder || "" });
        inputs[f.name] = el;
        return f.type === "check" ? h("label", { class: "check" }, el, h("span", {}, f.label)) : h("label", { class: "field" }, h("span", { class: "label" }, f.label), el, f.hint ? h("small", {}, f.hint) : null);
      })) : null;
      const values = () => Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.type === "checkbox" ? el.checked : el.value.trim()]));
      const yesFirst = primary === "yes" && !hold;
      const noBtn = h("button", { class: "btn" + (yesFirst ? " ghost" : " brand") }, no);
      const yesBtn = h("button", { class: "btn" + (hold ? " hold danger" : yesFirst ? " brand" : "") }, h("i", { class: "prog" }), h("span", {}, hold ? "Hold to " + yes.toLowerCase() : yes));
      const wrap = h("div", { class: "ask-wrap", role: "alertdialog", "aria-modal": "true", "aria-label": title },
        h("div", { class: "ask" }, img, say, sub, form, h("div", { class: "row" }, noBtn, yesBtn),
          hold ? h("div", { class: "note" }, "Press and hold for a second (or hold Space), so a slip of the mouse can't do it.") : null));
      let done = false;
      const finish = (v, last) => {
        if (done) return;
        done = true;
        const end = () => { wrap.classList.remove("open"); setTimeout(() => wrap.remove(), 220); document.removeEventListener("keydown", onKey); resolve(v); };
        if (last) { img.src = face(last.mood); say.textContent = last.say; sub.textContent = last.text || ""; setTimeout(end, 950); }
        else end();
      };
      const onKey = (e) => { if (e.key === "Escape") finish(false); };
      document.addEventListener("keydown", onKey);
      wrap.addEventListener("click", (e) => { if (e.target === wrap) finish(false); });
      noBtn.onclick = () => finish(false, hold ? { mood: "party", say: "Yay, I'll keep going!" } : null);
      noBtn.onmouseenter = noBtn.onfocus = () => { if (!done) img.src = face(noMood); };
      yesBtn.onmouseenter = yesBtn.onfocus = () => { if (!done) img.src = face(yesMood); };
      [noBtn, yesBtn].forEach((b) => { b.onmouseleave = () => { if (!done) img.src = face(m); }; });
      if (!hold) yesBtn.onclick = () => finish(fields ? values() : true);
      if (fields) Object.values(inputs).forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") yesBtn.click(); }));
      else {
        let start = 0, raf = 0;
        const tick = () => {
          const pr = Math.min(1, (performance.now() - start) / 1100);
          yesBtn.style.setProperty("--p", pr);
          if (pr >= 1) return finish(true, { mood: "sleepy", say: "Okay. I'll stop here.", text: "Your files stay exactly where they are." });
          raf = requestAnimationFrame(tick);
        };
        const down = (e) => {
          if (done || start) return;
          if (e.type === "keydown" && ((e.key !== " " && e.key !== "Enter") || e.repeat)) return;
          e.preventDefault();
          start = performance.now();
          img.src = face("sad");
          say.textContent = "Are you sure? Keep holding…";
          raf = requestAnimationFrame(tick);
        };
        const up = () => {
          if (done || !start) return;
          cancelAnimationFrame(raf);
          start = 0;
          yesBtn.style.setProperty("--p", 0);
          img.src = face("happy");
          say.textContent = "Phew! I'm still here.";
        };
        yesBtn.addEventListener("pointerdown", down);
        yesBtn.addEventListener("keydown", down);
        ["pointerup", "pointerleave", "pointercancel", "keyup", "blur"].forEach((ev) => yesBtn.addEventListener(ev, up));
      }
      document.body.append(wrap);
      requestAnimationFrame(() => { wrap.classList.add("open"); (fields ? Object.values(inputs)[0] : noBtn).focus(); });
    });
  }

  async function askStop(p) {
    const ok = await relayAsk({
      mood: "worried", hold: true, yes: "Stop", no: "Keep syncing",
      title: `Stop syncing “${p.name}”?`,
      text: "I'll stop watching these two folders. Nothing is deleted, and you can add the pair again any time.",
    });
    if (!ok) return;
    const r = await act(null, () => api("POST", pairURL(p.name, "remove")));
    if (r) toast(r.savedRemoval ? `Stopped and removed ${p.name}. See you!` : `Stopped syncing ${p.name} for this session.`, false, "sleepy");
    refresh();
  }

  // ---------- change story (diff) ----------
  /** Groups unified-diff lines into changes, each with a little context before and after. */
  function parseDiff(lines) {
    const notes = [], changes = [];
    let oldNo = 1, newNo = 1, maxNo = 0, ctx = [], cur = null;
    const close = () => { if (cur) { changes.push(cur); cur = null; } };
    for (const l of lines) {
      if (l.op === "@") {
        const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l.text);
        if (m) { close(); oldNo = +m[1]; newNo = +m[2]; ctx = []; continue; }
        notes.push(l.text);
        continue;
      }
      if (l.op === " ") {
        const row = { text: l.text, oldNo, newNo };
        if (cur) {
          cur.after.push(row);
          if (cur.after.length >= 2) close();
        }
        ctx.push(row);
        if (ctx.length > 2) ctx.shift();
        oldNo++; newNo++;
      } else {
        if (cur && cur.after.length) close();
        if (!cur) cur = { removed: [], added: [], before: ctx.slice(), after: [], at: newNo };
        if (l.op === "-") { cur.removed.push({ text: l.text, oldNo }); oldNo++; }
        else { cur.added.push({ text: l.text, newNo }); newNo++; }
      }
      maxNo = Math.max(maxNo, oldNo - 1, newNo - 1);
    }
    close();
    for (const c of changes) c.kind = c.removed.length && c.added.length ? "edit" : c.added.length ? "add" : "del";
    return { notes, changes, maxNo };
  }

  /** Word-level differences between two lines: [{t, op}] with op "", "+" or "-". */
  function wordDiff(a, b) {
    const A = a.match(/\s+|\w+|[^\w\s]/g) || [], B = b.match(/\s+|\w+|[^\w\s]/g) || [];
    if (A.length * B.length > 60000) return [{ t: a, op: "-" }, { t: b, op: "+" }];
    const dp = Array.from({ length: A.length + 1 }, () => new Int32Array(B.length + 1));
    for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = [];
    let i = 0, j = 0;
    const push = (t, op) => { const last = out[out.length - 1]; if (last && last.op === op) last.t += t; else out.push({ t, op }); };
    while (i < A.length || j < B.length) {
      if (i < A.length && j < B.length && A[i] === B[j]) { push(A[i], ""); i++; j++; }
      else if (j < B.length && (i >= A.length || dp[i][j + 1] >= dp[i + 1][j])) { push(B[j], "+"); j++; }
      else { push(A[i], "-"); i++; }
    }
    return out;
  }
  const sideText = (parts, keep) => h("div", { class: "txt" }, parts.filter((x) => x.op === "" || x.op === keep).map((x) => x.op === "" ? x.t : h(keep === "+" ? "ins" : "del", { class: "w" }, x.t)));

  /** One plain sentence about what changed, for people who don't read diffs. */
  function story(d, file) {
    let added = 0, removed = 0, edited = 0;
    for (const c of d.changes) {
      const pairs = c.kind === "edit" ? Math.min(c.removed.length, c.added.length) : 0;
      edited += pairs;
      added += c.added.length - pairs;
      removed += c.removed.length - pairs;
    }
    const parts = [];
    if (added) parts.push(`added ${plural(added, "new line")}`);
    if (edited) parts.push(`edited ${plural(edited, "line")}`);
    if (removed) parts.push(`removed ${plural(removed, "line")}`);
    const what = parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts[0] || "changed nothing visible";
    let where = "";
    if (d.changes.length && d.maxNo > 20) {
      const pos = d.changes.map((c) => c.at / d.maxNo);
      const avg = pos.reduce((a, b) => a + b, 0) / pos.length;
      where = d.changes.length > 1 && Math.max(...pos) - Math.min(...pos) > .5 ? ", in different parts of the file"
        : avg < .33 ? " near the top" : avg > .66 ? " near the end" : " in the middle";
    }
    return { title: `I found ${plural(d.changes.length, "change")} in ${file}.`, detail: `You ${what}${where}.`, added, removed, edited };
  }

  async function showDiff(p, file, conflict) {
    const folder = file.includes("/") ? file.slice(0, file.lastIndexOf("/") + 1) : "";
    const dr = drawer({ title: file.split("/").pop(), sub: [conflict ? "Changed in both folders" : "What changed", folder].filter(Boolean).join(" · "), wide: true });
    dr.body.append(relayLoading("Comparing the two versions", { mood: "comparing", card: false }));
    let d;
    try {
      d = await api("GET", pairURL(p.name, "diff") + "?format=json&path=" + enc(file) + (conflict ? "&conflict=1" : ""));
    } catch (e) {
      dr.body.replaceChildren(h("div", { class: "narrator" }, h("img", { src: face("sad"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, "I couldn't compare this file."), h("div", { class: "hint" }, e.message))));
      return;
    }
    const extra = conflict ? [
      ["source", "kept your working folder's version", "Keep mine"], ["target", "kept the target's version", "Keep target's"],
      ["both", "kept both versions", "Keep both"], ["merge", "merged", "Merge"],
    ].map(([choice, label, text]) => h("button", { class: "btn small" + (choice === "merge" ? " brand" : ""), onclick: () => { resolve(p, file, choice, label); dr.close(); } }, text)) : null;
    storyInto(dr.body, dr.foot, d, file.split("/").pop(), extra, dr.panel);
  }

  /** Renders a diff (from /diff?format=json or the Git client) as Relay's change story into body. */
  /**
   * The change map: the whole file as a track, each change a numbered pin at
   * its place (and as wide as it is), coloured by what happened: edited lines
   * amber, new green, removed red, split when one change does several.
   * Hovering or focusing a pin says what it is; clicking jumps to it.
   */
  function changeMap(parsed, marks, go) {
    const total = Math.max(1, parsed.maxNo);
    const pct = (line) => Math.max(0, Math.min(100, ((line - 1) / total) * 100));
    const n = parsed.changes.length;
    const kinds = new Set();
    // pins sit above their change, nudged apart so neighbours never cover each other
    const centres = parsed.changes.map((c) => pct(c.at) + Math.max(1.2, ((c.added.length || c.removed.length) / total) * 100) / 2);
    const gap = Math.min(4.2, 100 / Math.max(1, n));
    const pins = centres.slice();
    for (let k = 1; k < n; k++) pins[k] = Math.max(pins[k], pins[k - 1] + gap);
    for (let k = n - 1; k >= 0; k--) pins[k] = Math.min(pins[k], k === n - 1 ? 99 : pins[k + 1] - gap);
    const track = h("div", { class: "map-track", role: "group", "aria-label": `${plural(n, "change")} across the file` });
    parsed.changes.forEach((c, k) => {
      const edited = Math.min(c.added.length, c.removed.length);
      const extraAdd = c.added.length - edited, extraDel = c.removed.length - edited;
      const size = edited + extraAdd + extraDel;
      const left = pct(c.at);
      const width = Math.min(100 - left, Math.max(1.2, ((c.added.length || c.removed.length) / total) * 100));
      // colour stripes in proportion: edited, then new, then removed
      const parts = [[edited, "var(--map-edit)"], [extraAdd, "var(--map-add)"], [extraDel, "var(--map-del)"]].filter(([v]) => v > 0);
      if (edited) kinds.add("edit"); if (extraAdd) kinds.add("add"); if (extraDel) kinds.add("del");
      let acc = 0;
      const bg = parts.length === 1 ? parts[0][1] : "linear-gradient(90deg," + parts.map(([v, col]) => { const a = acc; acc += (v / size) * 100; return `${col} ${a}% ${acc}%`; }).join(",") + ")";
      const first = c.added.length ? c.added[0] : null, last = c.added.length ? c.added[c.added.length - 1] : null;
      const where = first ? (first.newNo === last.newNo ? `Line ${first.newNo}` : `Lines ${first.newNo}–${last.newNo}`) : `After line ${Math.max(1, c.at - 1)}`;
      const what = [edited ? plural(edited, "line") + " edited" : "", extraAdd ? `${extraAdd} new` : "", extraDel ? `${extraDel} removed` : ""].filter(Boolean).join(", ");
      const sample = (c.added[0] || c.removed[0] || { text: "" }).text.trim();
      const pinAt = ((pins[k] - left) / width) * 100;
      const side = pins[k] > 72 ? "right" : pins[k] < 28 ? "left" : "mid";
      const mk = h("button", { class: "mk", style: { left: left + "%", width: width + "%", background: bg }, "aria-label": `Change ${k + 1} of ${n}: ${where.toLowerCase()}, ${what}`, onclick: () => go(k) },
        h("span", { class: "pin", style: { left: pinAt + "%" } }, String(k + 1)),
        h("span", { class: "tip " + side, style: { left: pinAt + "%" } },
          h("b", {}, `Change ${k + 1} of ${n}`), h("span", {}, `${where} · ${what}`),
          sample ? h("code", {}, sample.length > 60 ? sample.slice(0, 60) + "…" : sample) : null));
      marks.push(mk);
      track.append(mk);
    });
    // a ruler with round line numbers, so "where" reads at a glance
    const raw = total / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = Math.max(1, Math.round([1, 2, 2.5, 5, 10].map((m) => m * mag).find((v) => v >= raw) || mag * 10));
    const ruler = h("div", { class: "map-ruler", "aria-hidden": "true" });
    for (let v = step; v < total - step * 0.4; v += step) {
      ruler.append(h("span", { class: "tick", style: { left: pct(v + 1) + "%" } }, String(v)));
      track.prepend(h("span", { class: "grid", style: { left: pct(v + 1) + "%" } }));
    }
    ruler.append(h("span", { class: "tick start" }, "line 1"), h("span", { class: "tick end" }, `line ${total}`));
    const names = { edit: ["edited", "var(--map-edit)"], add: ["new", "var(--map-add)"], del: ["removed", "var(--map-del)"] };
    const legend = h("div", { class: "map-legend" }, ...["edit", "add", "del"].filter((k) => kinds.has(k)).map((k) => h("span", {}, h("i", { style: { background: names[k][1] } }), names[k][0])));
    return h("div", { class: "map" },
      h("div", { class: "map-head" }, h("span", {}, "Where the changes are"), legend),
      track, ruler);
  }

  function storyInto(body, foot, d, file, extra, keys) {
    const parsed = parseDiff(d.lines);
    const st = story(parsed, file.split("/").pop());
    let view = "story", at = 0;
    const cards = [], marks = [];
    const counter = h("span", { class: "muted" });
    const prev = h("button", { class: "btn small", onclick: () => go(at - 1) }, "↑ Previous");
    const next = h("button", { class: "btn small primary", onclick: () => go(at + 1) }, "Next change ↓");
    const seg = h("div", { class: "seg", role: "group", "aria-label": "How to show the changes" });
    const content = h("div");

    function go(i, scroll = true) {
      if (!cards.length) return;
      at = Math.max(0, Math.min(cards.length - 1, i));
      cards.forEach((c, k) => c.classList.toggle("on", k === at));
      marks.forEach((m, k) => m.classList.toggle("on", k === at));
      if (scroll) cards[at].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      counter.textContent = `Change ${at + 1} of ${cards.length}`;
      prev.disabled = at === 0;
      next.disabled = at === cards.length - 1;
    }
    const row = (cls, no, op, text) => h("div", { class: "ln " + cls }, h("span", { class: "no" }, no ?? ""), h("span", { class: "op" }, op), h("span", { class: "tx" }, text || " "));
    function card(c, k) {
      const n = Math.max(c.removed.length, c.added.length);
      const title = c.kind === "add" ? `Added ${plural(c.added.length, "line")}` : c.kind === "del" ? `Removed ${plural(c.removed.length, "line")}` : `Edited ${plural(n, "line")}`;
      const parts = c.before.map((b) => row("ctx", b.newNo, "", b.text));
      if (c.kind === "edit") {
        const pairs = Math.min(c.removed.length, c.added.length);
        for (let i = 0; i < pairs; i++) {
          const w = wordDiff(c.removed[i].text, c.added[i].text);
          parts.push(h("div", { class: "edit-pair" }, h("div", { class: "lab" }, `Line ${c.added[i].newNo} · before`), sideText(w, "-"), h("div", { class: "lab" }, "after"), sideText(w, "+")));
        }
        for (const r of c.removed.slice(pairs)) parts.push(row("del", r.oldNo, "−", r.text));
        for (const a of c.added.slice(pairs)) parts.push(row("add", a.newNo, "+", a.text));
      } else {
        for (const r of c.removed) parts.push(row("del", r.oldNo, "−", r.text));
        for (const a of c.added) parts.push(row("add", a.newNo, "+", a.text));
      }
      for (const a of c.after) parts.push(row("ctx", a.newNo, "", a.text));
      return h("div", { class: "change", onclick: () => go(k, false) },
        h("div", { class: "change-head" }, h("span", { class: "ic " + c.kind }, { add: "+", del: "−", edit: "✎" }[c.kind]), h("b", {}, title), h("span", { class: "muted" }, `near line ${c.at}`), h("span", { class: "grow" }), h("span", { class: "muted" }, `${k + 1} / ${parsed.changes.length}`)),
        h("div", { class: "lines" }, parts));
    }
    function renderView() {
      seg.replaceChildren(
        h("button", { class: view === "story" ? "on" : "", onclick: () => { view = "story"; renderView(); } }, "Story"),
        h("button", { class: view === "classic" ? "on" : "", onclick: () => { view = "classic"; renderView(); } }, "Classic"));
      cards.length = 0;
      if (view === "classic") {
        content.replaceChildren(h("div", { class: "classic lines" }, d.lines.map((l) => l.op === "@" ? h("div", { class: "hdr" }, l.text) : row(l.op === "+" ? "add" : l.op === "-" ? "del" : "ctx", "", l.op === " " ? "" : l.op === "-" ? "−" : "+", l.text))));
        counter.textContent = "";
        prev.classList.add("hidden"); next.classList.add("hidden");
        return;
      }
      prev.classList.remove("hidden"); next.classList.remove("hidden");
      parsed.changes.forEach((c, k) => cards.push(card(c, k)));
      content.replaceChildren(...cards);
      if (cards.length) go(at, false); else { counter.textContent = ""; prev.classList.add("hidden"); next.classList.add("hidden"); }
    }

    const top = [];
    if (!parsed.changes.length) {
      const msg = parsed.notes[0] || "These two versions are identical.";
      top.push(h("div", { class: "narrator" }, h("img", { src: face(parsed.notes.length ? "thinking" : "happy"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, parsed.notes.length ? "I can't show this one line by line." : "Nothing changed here."), h("div", { class: "hint" }, msg))));
    } else {
      top.push(h("div", { class: "narrator" }, h("img", { src: face("thinking"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, st.title), h("div", { class: "hint" }, st.detail + " Green is new, red is gone, and highlighted words show exactly what was edited."))));
      top.push(h("div", { class: "chips" },
        st.added ? h("span", { class: "pill green" }, `+ ${plural(st.added, "new line")}`) : "",
        st.edited ? h("span", { class: "pill amber" }, `✎ ${plural(st.edited, "edited line")}`) : "",
        st.removed ? h("span", { class: "pill red" }, `− ${plural(st.removed, "removed line")}`) : ""));
      top.push(changeMap(parsed, marks, go));
    }
    top.push(h("div", { class: "sides" }, h("div", { class: "side" }, h("b", {}, "Before"), d.before), h("div", { class: "side" }, h("b", {}, "After"), d.after)));
    top.push(h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" } }, h("span", { class: "muted", style: { fontSize: "12.5px" } }, "Tip: press J and K to jump between changes."), seg));
    if (d.more) top.push(h("div", { class: "diff-more" }, `This file is very big, so I'm showing the first ${d.lines.length.toLocaleString()} changed lines. ${d.more.toLocaleString()} more aren't shown.`));
    body.replaceChildren(...top, content);
    const nav = [h("span", { class: "left" }, counter), prev, next];
    if (foot) foot.replaceChildren(...nav, ...(extra || []));
    else body.prepend(h("div", { class: "inline", style: { justifyContent: "flex-end", marginBottom: "10px" } }, ...nav));
    keys.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, select")) return;
      if (e.key === "j") go(at + 1);
      if (e.key === "k") go(at - 1);
    });
    renderView();
  }

  // ---------- add a pair ----------
  function openAdd() {
    if (!S.info || !S.info.can_add) return toast("Start ferry with “ferry ui” to add pairs from here.", true);
    const dr = drawer({ title: "New folder pair", sub: "I'll keep these two folders in sync." });
    const form = h("form", { autocomplete: "off" });
    form.innerHTML = `
      <div class="field"><label class="label" for="f-source">Your working folder (source)</label>

        <small>Where you edit files. I watch this folder.</small><small class="field-error hidden" data-error="source"></small></div>
      <div class="field"><label class="label" for="f-target">Where the files should go (target)</label>
        <div class="inline"><input type="text" id="f-target" name="target" placeholder="Usually a git repository"><button type="button" class="btn small" data-browse="target">Choose…</button></div>
        <small>You can also type user@server:/path (ssh) or s3://bucket/folder (cloud storage).</small><small class="field-error hidden" data-error="target"></small></div>

        <div class="choices">
          <label class="choice"><input type="radio" name="mode" value="one-way" checked>One way →<small>Changes in your working folder are copied to the target.</small></label>
          <label class="choice"><input type="radio" name="mode" value="two-way">Both ways ⇄<small>Changes on either side are copied to the other. If both change a file, you choose.</small></label>
        </div></div>
      <details class="more"><summary>More options</summary>
        <label class="field" style="margin-top:10px"><span class="label">Name</span><input type="text" name="name" placeholder="e.g. website"><small>Optional. Shown in the list and in notifications.</small></label>
        <label class="field"><span class="label">When a file is deleted on one side</span><select name="on_delete">

        <label class="field"><span class="label">Things that look like passwords or keys</span><select name="secrets">
          <option value="warn">Copy them, but warn me</option><option value="block">Don't copy those files</option><option value="redact">Copy with the secrets blanked out (one way only)</option><option value="off">Don't check</option></select></label>
        <label class="field"><span class="label">Also copy to these targets</span><textarea name="targets" placeholder="/path/to/another-repo&#10;s3://my-bucket/backup"></textarea><small>One per line. Each becomes its own one-way pair.</small></label>
        <label class="check"><input type="checkbox" name="ac_enabled"><span>Commit to git automatically</span></label>
        <div data-ac class="hidden" style="padding-left:26px">
          <div class="inline" style="margin-bottom:8px"><span>every</span><select name="ac_interval" style="width:auto"><option value="5m">5 minutes</option><option value="10m" selected>10 minutes</option><option value="30m">30 minutes</option><option value="1h">hour</option></select></div>
          <label class="check"><input type="checkbox" name="ac_ai"><span>Let Claude write the commit messages<small class="hint">Needs ANTHROPIC_API_KEY where ferry runs.</small></span></label>
          <label class="check"><input type="checkbox" name="ac_push"><span>Push after committing</span></label>
        </div>
      </details>`;
    const F = (n) => form.elements.namedItem(n); // form.name / form.target are the form's own attributes
    const formView = h("div", {}, h("div", { class: "narrator" }, h("img", { src: face("excited"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, "Which folders should I look after?"), h("div", { class: "hint" }, S.info.config_file ? "I'll remember this pair in " + S.info.config_file + "." : "This pair lasts until ferry stops."))), form);
    const pickerView = h("div", { class: "hidden" });
    dr.body.append(formView, pickerView);
    const submit = h("button", { class: "btn brand", type: "button" }, "Start syncing");
    const formFoot = [h("button", { class: "btn ghost", type: "button", onclick: dr.close }, "Cancel"), submit];
    dr.foot.append(...formFoot);

    const showError = (w, msg) => {
      const el = $(`[data-error=${w}]`, form);
      el.textContent = msg;
      el.classList.toggle("hidden", !msg);
      F(w).classList.toggle("invalid", !!msg);
    };
    for (const w of ["source", "target"]) F(w).addEventListener("input", () => showError(w, ""));
    F("ac_enabled").addEventListener("change", () => $("[data-ac]", form).classList.toggle("hidden", !F("ac_enabled").checked));
    form.addEventListener("submit", (e) => { e.preventDefault(); submit.click(); });
    form.querySelectorAll("[data-browse]").forEach((b) => b.addEventListener("click", () => {
      const which = b.dataset.browse;
      const typed = F(which).value.trim();
      openPicker(which === "source" ? "Choose your working folder" : "Choose where the files should go", typed && !/^(s3:\/\/|ssh:\/\/|[^/\\]+@)/.test(typed) ? typed : S.info.home, (dir) => { F(which).value = dir; showError(which, ""); });
    }));

    const openPicker = (title, start, pick) => pickFolder(dr, formView, pickerView, () => dr.foot.replaceChildren(...formFoot), title, start, pick);

    submit.onclick = async () => {
      const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
      const missing = ["source", "target"].filter((w) => !F(w).value.trim());
      if (missing.includes("source")) showError("source", "Choose the folder you work in.");
      if (missing.includes("target")) showError("target", "Choose where the files should go.");
      if (missing.length) return F(missing[0]).focus();
      const two = F("mode").value === "two-way";
      const body = { name: F("name").value.trim(), source: F("source").value.trim(), target: F("target").value.trim(), mode: F("mode").value, on_delete: F("on_delete").value, ignore: lines(F("ignore").value), secrets: F("secrets").value };
      if (two) {
        body.merge = F("merge").checked;
        if (body.secrets === "redact") return toast("Blanking out secrets only works one way", true);
      } else if (body.on_delete === "restore") return toast("“Put it back” only works when syncing both ways", true);

      submit.disabled = true;

      submit.disabled = false;
      if (!r) return;
      toast("Now syncing " + r.added.join(", "), false, "party");

  }

  // =====================================================================
  // ---------- Git client ----------
  // =====================================================================
  const gitURL = (action) => `/git/${S.repoSel}/${action}`;
  const curRepo = () => S.repos.find((r) => r.id === S.repoSel);

  async function loadRepos() {
    try {
      S.repos = await api("GET", "/git/repos");
    } catch {
      S.repos = [];
    }
    if (!S.repos.some((r) => r.id === S.repoSel)) S.repoSel = S.repos[0] ? S.repos[0].id : "";
    if (S.repoSel) {
      try {
        S.repo = await api("GET", gitURL("state"));
      } catch (e) {
        S.repo = null;
        S.repoError = e.message;
      }
    } else S.repo = null;
  }
  const refreshGit = async () => { S.gitBump++; S.gshown = ""; await loadRepos(); render(); };

  /** Runs a Git action, tells the user how it went, and refreshes. */
  async function gitAct(action, body, okText, mood = "happy") {
    try {
      const r = await api("POST", gitURL(action), body || {});
      const text = typeof okText === "function" ? okText(r) : okText;
      if (text) toast(text, false, mood);
      if (r.paused && r.paused.length) toast(`I paused syncing ${r.paused.join(", ")} while you do this. Resume it when you're ready.`, false, "sleepy");
      if (r.conflicts && r.conflicts.length) toast(`${plural(r.conflicts.length, "file")} need your decision: see the top of the page.`, true, "worried");
      await refreshGit();
      return r;
    } catch (e) {
      await refreshGit();
      throw e;
    }
  }
  const tryAct = (...a) => gitAct(...a).catch((e) => { toast(e.message, true); return null; });

  /** Relay's take on a repository's state. */
  function repoMood(st) {
    if (!st) return { face: "sad", say: "I can't read this repository.", hint: S.repoError || "", tone: "red", label: "error" };
    const conflicts = st.files.filter((f) => f.conflicted).length;
    if (st.operation) {
      const what = { merge: `Merging ${st.operationBranch || "a branch"} into ${st.branch}`, rebase: "Rebasing", "cherry-pick": "Cherry-picking a commit", revert: "Reverting a commit" }[st.operation];
      return conflicts
        ? { face: "worried", say: `${what}: ${plural(conflicts, "file")} ${conflicts === 1 ? "needs" : "need"} you.`, hint: "Choose which version to keep for each file below, then press Continue.", tone: "red", label: st.operation + " in progress" }
        : { face: "thinking", say: `${what}: all conflicts are settled.`, hint: "Press Continue to finish, or Abort to go back.", tone: "amber", label: st.operation + " in progress" };
    }
    const staged = st.files.filter((f) => f.staged).length;
    if (st.behind) return { face: "thinking", say: `There ${st.behind === 1 ? "is 1 new commit" : `are ${st.behind} new commits`} on ${st.upstream}.`, hint: "Pull to catch up" + (st.files.length ? `. You also have ${plural(st.files.length, "changed file")}.` : "."), tone: "amber", label: `${st.behind} behind` };
    if (st.files.length) return { face: "focused", say: `${plural(st.files.length, "file")} changed${staged ? `, ${staged} ready to commit` : ""}.`, hint: staged ? "Write a message and commit when you're ready." : "Tick the files (or lines) you want in the next commit.", tone: "blue", label: plural(st.files.length, "change") };
    if (st.ahead) return { face: "wink", say: `${plural(st.ahead, "commit")} ready to push.`, hint: `Push to share them on ${st.upstream}.`, tone: "blue", label: `${st.ahead} to push` };
    if (!st.head) return { face: "excited", say: "A brand-new repository!", hint: "Add some files, then make your first commit.", tone: "green", label: "empty" };
    return { face: "happy", say: "Everything's committed.", hint: st.upstream ? `In step with ${st.upstream}.` : "This branch isn't on a remote yet: push to publish it.", tone: "green", label: "clean" };
  }

  function renderRepos() {
    const box = $("#pairs");
    $("#pair-count").textContent = S.repos.length;
    box.replaceChildren();
    for (const r of S.repos) {
      const sel = r.id === S.repoSel;
      const st = sel ? S.repo : null;
      const sub = st ? `⎇ ${st.branch || "detached"} · ${st.files.length ? plural(st.files.length, "change") : "clean"}` : short(r.path);
      box.append(h("button", { class: "pair" + (sel ? " sel" : ""), title: r.path, onclick: () => { S.repoSel = r.id; localStorage.setItem("ferry-repo", r.id); S.gui = null; refreshGit(); } },
        h("img", { src: face(st ? repoMood(st).face : "happy"), alt: "" }),
        h("div", {}, h("div", { class: "name" }, r.name), h("div", { class: "sub" }, sub), r.pairs.length ? h("div", { class: "rp-sub" }, "synced by " + r.pairs.join(", ")) : null)));
    }
    if (!S.repos.length) box.append(h("div", { class: "pair-empty" }, "No repositories yet. Clone one, create one, or open a folder you already have."));
  }

  function renderRepo() {
    const main = $("#main");
    const r = curRepo();
    if (!r) {
      S.gui = null;
      main.replaceChildren(h("div", { class: "card empty" },
        h("img", { src: face("excited"), alt: "Relay", class: "float" }),
        h("h2", {}, "Let's open a repository."),
        h("p", {}, "I can clone one from GitHub or GitLab, create a new one, or open a folder that's already a git repository. Repositories your folder pairs sync into show up here by themselves."),
        h("p", {}, "Click “Add repository” on the left.")));
      return;
    }

  }

  function buildRepo(r) {
    const ui = { id: r.id };
    ui.crumbs = h("div", { class: "crumbs" });
    ui.h1 = h("h1");
    ui.branch = h("button", { class: "pill blue", style: { border: 0, cursor: "pointer", fontSize: "14px", padding: "6px 14px" }, onclick: () => { S.gitTab = "branches"; S.gshown = ""; render(); } });
    ui.sync = h("span");
    ui.actions = h("div", { class: "actions" });
    ui.paths = h("div", { class: "paths" });
    ui.face = h("img", { alt: "Relay", class: "float" });
    ui.say = h("div", { class: "say" });
    ui.hint = h("div", { class: "hint" });

    ui.tabs = h("div", { class: "toolbar" });

    $("#main").replaceChildren(ui.crumbs, h("div", { class: "title-row" }, ui.h1, ui.branch, ui.sync, h("div", { class: "grow" }), ui.actions), ui.paths,
      h("div", { class: "card hero" }, ui.face, h("div", { class: "bubble", role: "status" }, ui.say, ui.hint)), ui.op, ui.tabs, ui.body);
    S.gui = ui;
    S.gshown = "";
  }

  function updateRepo(r, st) {
    const ui = S.gui;
    const m = repoMood(st);
    ui.crumbs.replaceChildren(h("span", {}, "Repositories"), h("span", {}, "›"), h("b", {}, r.name));
    ui.h1.textContent = r.name;
    ui.branch.replaceChildren(icon("branch"), st ? (st.branch || `detached at ${st.head}`) : "…");
    ui.sync.replaceChildren(
      st && st.ahead ? h("span", { class: "pill blue", title: "commits to push" }, `↑ ${st.ahead}`) : "",
      " ", st && st.behind ? h("span", { class: "pill amber", title: "commits to pull" }, `↓ ${st.behind}`) : "");
    if (ui.face.getAttribute("src") !== face(m.face)) ui.face.src = face(m.face);
    ui.say.textContent = m.say;
    ui.hint.textContent = m.hint;
    ui.paths.replaceChildren(h("code", {}, short(r.path)),
      ...r.pairs.map((n) => h("span", { class: "pill violet", title: "a folder pair syncs into this repository" }, "synced by " + n)),

      r.standalone ? h("button", { class: "btn small ghost", onclick: () => removeRepo(r) }, "Remove from list") : "");
    const busy = (btn, f) => async () => { btn.disabled = true; try { await f(); } finally { btn.disabled = false; } };
    const fetchBtn = h("button", { class: "btn" }, icon("cloud"), "Fetch");
    fetchBtn.onclick = busy(fetchBtn, () => tryAct("fetch", {}, "Fetched the latest from the remote", "happy"));
    const pullBtn = h("button", { class: "btn" }, icon("down"), st && st.behind ? `Pull ${st.behind}` : "Pull");
    pullBtn.onclick = busy(pullBtn, () => doPull());
    const pushBtn = h("button", { class: "btn" + (st && st.ahead ? " brand" : "") }, icon("up"), st && !st.upstream ? "Publish branch" : st && st.ahead ? `Push ${st.ahead}` : "Push");
