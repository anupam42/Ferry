  // ---------- undo anything: every place the branch has been (the reflog), and branches you deleted ----------
  /** What a reflog entry means, in words, with an icon and a tone. */
  function reflogWords(e) {
    const a = e.action, d = e.detail;
    if (/^commit \(initial\)/.test(a)) return ["commit", "First commit", "green"];
    if (/^commit \(amend\)/.test(a)) return ["commit", "Amended the last commit", "violet"];
    if (/^commit \(merge\)/.test(a) || /^merge /.test(a)) return ["branch", a.startsWith("merge ") ? `Merged ${a.slice(6)}` : "Finished a merge", "violet"];
    if (/^commit/.test(a)) return ["commit", "Committed", "blue"];
    if (a === "checkout") { const m = /^moving from (\S+) to (\S+)/.exec(d); return ["branch", m ? `Switched from ${m[1]} to ${m[2]}` : "Switched branch", "muted"]; }
    if (/^reset/.test(a)) return ["undo", "Moved the branch (reset)", "amber"];
    if (/^rebase.*\(finish\)/.test(a)) return ["sync", "Finished a rebase", "violet"];
    if (/^rebase/.test(a)) return ["sync", "Rebase step", "muted"];
    if (/^pull/.test(a)) return ["down", /rebase/.test(a) ? "Pulled (rebased your commits)" : "Pulled", "blue"];
    if (/^cherry-pick/.test(a)) return ["commit", "Cherry-picked a commit", "violet"];
    if (/^revert/.test(a)) return ["undo", "Reverted a commit", "amber"];
    if (/^branch/.test(a)) return ["branch", "Created a branch", "muted"];
    return ["clock", a || "Moved", "muted"];
  }

  async function gitUndo(body, st) {
    body.replaceChildren(relayLoading("Looking back through everything you did", { mood: "thinking", sub: "Commits, switches, resets, rebases, merges and pulls." }));
    const t = await act(null, () => api("GET", gitURL("undo-timeline")));
    if (!t || S.gitTab !== "undo") return;
    const busy = !!st.operation;

    const goBack = async (e) => {
      const dirty = st.files.filter((f) => !f.untracked).length;
      const ok = await relayAsk({ mood: "thinking", title: `Go back to how ${t.branch || "this branch"} was ${ago(e.date)}?`,
        text: `Your branch will point at ${e.short} (“${e.subject}”) again. Nothing is deleted: where you are now stays in this list, so you can come straight back.` + (dirty ? ` Your ${plural(dirty, "uncommitted change")} ${dirty === 1 ? "stays" : "stay"} as ${dirty === 1 ? "it is" : "they are"}.` : ""),
        yes: "Go back", no: "Cancel", yesMood: "wink" });
      if (ok) tryAct("restore", { hash: e.hash }, `Back to ${e.short}. Changed your mind? It's at the top of this list.`, "party");
    };
    const branchHere = async (hash, suggested) => {
      const v = await relayAsk({ mood: "excited", title: "Make a branch here", text: "A new branch at this exact point. Nothing else moves.", yes: "Create branch", no: "Cancel", yesMood: "party", primary: "yes",
        fields: [{ name: "name", label: "Branch name", value: suggested || "", placeholder: "e.g. rescue/before-rebase" }] });
      if (v && v.name) tryAct("branch-at", { name: v.name, hash }, (r) => `Created ${r.branch}`, "party");
    };

    const lost = t.lost.length ? section("g-lost", "Deleted branches you can bring back", t.lost.length, "amber",
      h("div", { class: "undo-lost" }, t.lost.map((b) => h("div", { class: "undo-lost-row" },
        h("span", { class: "undo-ic ut-amber" }, icon("branch")),
        h("div", { class: "grow" }, h("b", {}, b.name), h("small", {}, `was at ${b.short} “${b.subject}” · you left it ${ago(b.date)}`)),
        h("button", { class: "btn small brand", onclick: () => tryAct("branch-at", { name: b.name, hash: b.hash }, `${b.name} is back`, "party") }, icon("undo"), "Restore"))))) : null;

    // group by day, newest first
    const groups = new Map();
    for (const e of t.entries) {
      const d = new Date(e.date);
      const key = isNaN(d) ? "Earlier" : d.toDateString() === new Date().toDateString() ? "Today" : d.toDateString() === new Date(Date.now() - 86400e3).toDateString() ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    }
    const timeline = h("div", { class: "undo-tl" });
    for (const [day, list] of groups) {
      timeline.append(h("div", { class: "undo-day" }, day));
      for (const e of list) {
        const [ic, words, tone] = reflogWords(e);
        const minor = tone === "muted";
        timeline.append(h("div", { class: "undo-row" + (e.current ? " here" : "") + (minor ? " minor" : "") },
          h("span", { class: "undo-node ut-" + tone }, icon(ic)),
          h("div", { class: "undo-main" },
            h("div", { class: "undo-what" }, h("b", {}, words), e.current ? h("span", { class: "pill blue refpill" }, "You are here") : null),
            h("button", { type: "button", class: "undo-commit", onclick: () => showCommit(e.hash) }, h("span", { class: "mono" }, e.short), " ", e.subject)),
          h("span", { class: "undo-when", title: new Date(e.date).toLocaleString() }, new Date(e.date).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })),
          h("div", { class: "undo-acts" },
            e.current ? null : h("button", { class: "btn small", disabled: busy ? true : null, title: busy ? `Finish the ${st.operation} first` : "", onclick: () => goBack(e) }, icon("undo"), "Go back here"),
            h("button", { class: "btn small ghost", onclick: () => branchHere(e.hash, "") }, icon("branch"), "Branch here"))));
      }
    }
    body.replaceChildren(
      h("div", { class: "card undo-intro" }, h("span", { class: "undo-ic ut-green" }, icon("shield")),
        h("div", {}, h("b", {}, "Nothing here is ever really lost."), h("small", {}, "Every commit, switch, reset, rebase, merge and pull is below. Go back to any of them; where you are now always stays in the list, so going back can be undone too."))),
      lost || "",
      section("g-undo", "Everything you did", t.entries.length, "", t.entries.length ? timeline : h("div", { class: "empty-row" }, "Nothing yet. Once you commit or switch branches, it shows up here.")));
  }

  // ---------- Jira ----------
  /** Text with Jira issue keys (SHOP-42) turned into links, when Jira is connected. */
  function linkIssues(t) {
    const site = S.conns && S.conns.jira.connected ? S.conns.jira.where : "";
    if (!site) return [t];
    const out = [];
    let last = 0;
    for (const m of t.matchAll(/\b[A-Z][A-Z0-9_]+-\d+\b/g)) {
      out.push(t.slice(last, m.index));
      out.push(h("a", { href: `${site}/browse/${m[0]}`, target: "_blank", rel: "noopener noreferrer", onclick: (e) => e.stopPropagation(), class: "pill blue refpill", style: { textDecoration: "none" } }, m[0]));
      last = m.index + m[0].length;
    }
    out.push(t.slice(last));
    return out;
  }

  async function gitIssues(body, st) {
    body.replaceChildren(relayLoading("Asking Jira for your issues", { mood: "excited" }));
    let res;
    try {
      res = await api("GET", gitURL("issues"));
    } catch (e) {
      body.replaceChildren(h("div", { class: "card hero" }, h("img", { src: face("thinking"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, "I couldn't reach Jira."), h("div", { class: "hint" }, e.message),
        h("div", { style: { marginTop: "10px" } }, h("button", { class: "btn small brand", onclick: openConnections }, icon("plug"), "Open Connections")))));
      return;
    }
    if (S.gitTab !== "issues") return;
    const tone = (c) => (c === "indeterminate" ? "blue" : c === "done" ? "green" : "");
    const rows = res.issues.map((i) => h("tr", {},
      h("td", { class: "file" }, h("a", { href: i.url, target: "_blank", rel: "noopener noreferrer", class: "pill blue refpill", style: { textDecoration: "none", marginLeft: 0, marginRight: "8px" } }, i.key), i.summary, h("small", {}, [i.type, i.priority && i.priority + " priority", "updated " + ago(i.updated)].filter(Boolean).join(" · "))),
      h("td", {}, h("span", { class: "pill " + tone(i.category) }, i.status)),
      h("td", { class: "end" }, h("button", { class: "btn small brand", onclick: async () => {
        const name = await (async () => {
          const v = await relayAsk({ mood: "excited", title: `Start work on ${i.key}?`, text: `I'll make a branch for “${i.summary}” from ${st.branch || "here"} and switch to it. Commits there get ${i.key} in their message, so Jira links them.`, yes: "Start work", no: "Cancel", yesMood: "party", noMood: "thinking", primary: "yes",
            fields: [{ name: "branch", label: "Branch name", value: branchFor(i.key, i.summary) }, { name: "transition", type: "check", label: "Move the issue to In Progress", value: i.category !== "indeterminate" }] });
          return v;
        })();
        if (!name) return;
        const r = await tryAct("issue-start", { key: i.key, summary: i.summary, branch: name.branch, transition: name.transition }, (r) => `On ${r.branch}` + (r.moved && !r.moved.startsWith("!") ? `; ${i.key} is now ${r.moved}` : ""), "party");
        if (r && r.moved && r.moved.startsWith("!")) toast(`Couldn't move ${i.key}: ${r.moved.slice(1)}`, true);
      } }, icon("branch"), "Start work"), " ", h("a", { class: "btn small", href: i.url, target: "_blank", rel: "noopener noreferrer" }, "Open"))));
    body.replaceChildren(section("g-issues", "My Jira issues", res.issues.length, "blue", rows.length ? h("table", { class: "table" }, h("tbody", {}, rows)) : h("div", { class: "empty-row" }, "Nothing assigned to you that's still open. Nice!")));
  }
  const branchFor = (key, summary) => {
    const slug = summary.toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 40).replace(/-$/, "");
    return slug ? `${key}-${slug}` : key;
  };

  // ---------- connections ----------
  const SERVICES = [
    { id: "github", name: "GitHub", blurb: "Pull requests and their checks.", how: "GitHub uses the GitHub CLI: install it and run “gh auth login” in a terminal. Nothing to enter here." },
    { id: "gitlab", name: "GitLab", blurb: "Merge requests, pipelines and approvals (gitlab.com or your own server).", fields: [
      { name: "url", label: "GitLab address", placeholder: "https://gitlab.com", value: "https://gitlab.com", hint: "Just the server: https://gitlab.com, or your company's GitLab address. Not a profile or project page." },
      { name: "token", label: "Personal access token", placeholder: "glpat-…", secret: true }],
      help: "Create one under User settings → Access tokens, with the read_api scope.", link: "https://gitlab.com/-/user_settings/personal_access_tokens" },
    { id: "azure", name: "Azure DevOps", blurb: "Pull requests, reviewer votes and build status in Azure Repos.", fields: [
      { name: "org", label: "Organization", placeholder: "the name after dev.azure.com/" },
      { name: "token", label: "Personal access token", placeholder: "paste the token", secret: true }],
      help: "Create one under User settings → Personal access tokens, with Code (Read) access.", link: "https://dev.azure.com/" },
    { id: "jira", name: "Jira", blurb: "Your issues, branches named after them, and commits linked back.", fields: [
      { name: "url", label: "Jira address", placeholder: "https://your-team.atlassian.net", hint: "Just the site, like https://your-team.atlassian.net." },
      { name: "email", label: "Your Jira email", placeholder: "you@company.com" },
      { name: "token", label: "API token", placeholder: "paste the token", secret: true }],
      help: "Create an API token in your Atlassian account settings.", link: "https://id.atlassian.com/manage-profile/security/api-tokens" },
  ];

  async function openConnections() {
    // closing it brings Settings → Connections up to date with whatever changed
    const dr = drawer({ title: "Connections", sub: "Let Ferry talk to the services you use", onClose: () => { if (S.mode === "settings") { S.setShown = ""; render(); } } });
    const paint = async () => {
      S.conns = await api("GET", "/connections").catch(() => S.conns);
      const c = S.conns || {};
      const n = ["gitlab", "azure", "jira"].filter((k) => c[k] && c[k].connected).length;
      const cards = SERVICES.map((svc) => {
        const st = c[svc.id];
        const card = h("div", { class: "card section", style: { marginBottom: "12px", padding: "14px 16px", background: "var(--card2)" } });
        const head = h("div", { class: "inline", style: { justifyContent: "space-between", gap: "10px", flexWrap: "wrap" } },
          h("div", {}, h("b", { style: { fontSize: "16px" } }, svc.name), h("div", { class: "muted", style: { fontSize: "13px" } }, svc.blurb)),
          st && st.connected ? h("span", { class: "pill green" }, "✓ connected") : svc.id === "github" ? h("span", { class: "pill" }, "via gh CLI") : h("span", { class: "pill" }, "not connected"));
        card.append(head);
        if (svc.id === "github") { card.append(h("p", { class: "hint" }, svc.how)); return card; }
        if (st && st.connected) {
          card.append(h("p", { class: "hint", style: { marginTop: "8px" } }, `As ${st.user || "you"} · ${st.where}`),
            st.fromEnv ? h("p", { class: "hint" }, "Set by environment variables where ferry runs; change them there.")
              : h("button", { class: "btn small ghost danger", onclick: async () => { await act(`Disconnected ${svc.name}`, () => api("POST", `/connections/${svc.id}/remove`), "sleepy"); paint(); refreshGit(); } }, "Disconnect"));
          return card;
        }
        const inputs = {};
        const form = h("div", { style: { marginTop: "12px" } }, svc.fields.map((f) => {
          const el = h("input", { type: f.secret ? "password" : "text", placeholder: f.placeholder, value: f.value || "", autocomplete: "off" });
          inputs[f.name] = el;
          return h("label", { class: "field" }, h("span", { class: "label" }, f.label), el, f.hint ? h("small", {}, f.hint) : null);
        }));
        const btn = h("button", { class: "btn brand small" }, "Connect");
        btn.onclick = async () => {
          btn.disabled = true;
          btn.textContent = "Checking…";
          const values = Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value.trim()]));
          const r = await act(null, () => api("POST", `/connections/${svc.id}`, values));
          btn.disabled = false;
          btn.textContent = "Connect";
          if (r) { toast(`Connected to ${svc.name} as ${r.user}`, false, "party"); paint(); refreshGit(); }
        };
        card.append(form, h("div", { class: "inline", style: { justifyContent: "space-between", flexWrap: "wrap" } },
          h("span", { class: "hint", style: { margin: 0 } }, svc.help, " ", h("a", { href: svc.link, target: "_blank", rel: "noopener noreferrer" }, "Create a token")), btn));
        return card;
      });
      dr.body.replaceChildren(
        h("div", { class: "narrator" }, h("img", { src: face(n ? "happy" : "excited"), alt: "" }), h("div", { class: "bubble" },
          h("div", { class: "say" }, n ? `I'm connected to ${plural(n, "service")}.` : "Which services do you use?"),
          h("div", { class: "hint" }, "Tokens stay on this computer, in a file only you can read. The browser never sees them."))),
        ...cards);
    };
    dr.foot.replaceChildren(h("span", { class: "hint left", style: { margin: 0 } }, "Pull requests and Jira show up in the Git area."), h("button", { class: "btn", onclick: dr.close }, "Done"));
    paint();
  }

  // ---------- add a repository ----------
  function openAddRepo() {
    if (!S.info || !S.info.can_open_repos) return toast("Start ferry with “ferry ui” to open repositories here.", true);
    const dr = drawer({ title: "Add a repository", sub: "Clone, create, or open one you already have." });
    let mode = "clone";
    const seg = h("div", { class: "seg big", role: "group", "aria-label": "How" });
    const formView = h("div");
    const pickerView = h("div", { class: "hidden" });
    const go = h("button", { class: "btn brand" });
    const cancel = h("button", { class: "btn ghost", onclick: dr.close }, "Cancel");
    const restore = () => dr.foot.replaceChildren(cancel, go);
    const url = h("input", { type: "text", placeholder: "https://github.com/owner/repo.git  or  git@gitlab.com:owner/repo.git" });
    const parent = h("input", { type: "text", value: S.info.home + S.info.sep + "code" });
    const name = h("input", { type: "text", placeholder: "folder name" });
    const existing = h("input", { type: "text", placeholder: "the repository's folder" });
    url.addEventListener("input", () => { const m = /([^/:]+?)(\.git)?\/?$/.exec(url.value.trim()); if (m && !name.dataset.touched) name.value = m[1]; });
    name.addEventListener("input", () => { name.dataset.touched = "1"; });
    const chooser = (input, title) => h("button", { class: "btn small", type: "button", onclick: () => pickFolder(dr, formView, pickerView, restore, title, input.value || S.info.home, (dir) => { input.value = dir; }) }, "Choose…");
    const paint = () => {
      seg.replaceChildren(...[["clone", "Clone"], ["create", "Create new"], ["add", "Open existing"]].map(([id, label]) => h("button", { class: mode === id ? "on" : "", onclick: () => { mode = id; paint(); } }, label)));
      const say = { clone: "Paste the address of a repository on GitHub, GitLab or anywhere else.", create: "I'll make a fresh repository with a main branch.", add: "Pick a folder that's already a git repository." }[mode];
      formView.replaceChildren(
        h("div", { class: "narrator" }, h("img", { src: face("excited"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, { clone: "Which repository should I copy?", create: "Let's start something new!", add: "Which repository is it?" }[mode]), h("div", { class: "hint" }, say))),
        h("div", { style: { marginBottom: "16px" } }, seg),
        mode === "clone" ? h("label", { class: "field" }, h("span", { class: "label" }, "Repository address"), url, h("small", {}, "Private repositories use your usual git login (SSH keys or a credential helper).")) : "",
        mode !== "add" ? h("div", { class: "field" }, h("span", { class: "label" }, "Put it inside"), h("div", { class: "inline" }, parent, chooser(parent, "Choose where to put it"))) : "",
        mode !== "add" ? h("label", { class: "field" }, h("span", { class: "label" }, "Folder name"), name) : "",
        mode === "add" ? h("div", { class: "field" }, h("span", { class: "label" }, "Repository folder"), h("div", { class: "inline" }, existing, chooser(existing, "Choose the repository"))) : "");
      go.textContent = { clone: "Clone it", create: "Create it", add: "Open it" }[mode];
    };
    go.onclick = async () => {
      const dest = parent.value.replace(/[\\/]+$/, "") + S.info.sep + name.value.trim();
      const body = mode === "clone" ? { action: "clone", url: url.value.trim(), path: dest } : mode === "create" ? { action: "create", path: dest } : { action: "add", path: existing.value.trim() };
      if ((mode === "clone" && !body.url) || (mode !== "add" && !name.value.trim()) || (mode === "add" && !body.path)) return toast("Fill in the empty field first", true);
      go.disabled = true;
      go.textContent = mode === "clone" ? "Cloning…" : "Working…";
      const r = await act(null, () => api("POST", "/git/repos", body));
      go.disabled = false;
      paint();
      if (!r) return;
      toast({ clone: "Cloned! ", create: "Created! ", add: "Opened " }[mode] + short(r.path), false, "party");
      dr.close();
      S.repoSel = r.id;
      localStorage.setItem("ferry-repo", r.id);
      S.gui = null;
      refreshGit();
    };
    dr.body.append(formView, pickerView);
    restore();
    paint();
  }

  /**
   * Swaps a drawer's form for a folder browser. pick(dir) gets the chosen
   * folder; restoreFoot puts the form's buttons back.
   */
  function pickFolder(dr, formView, pickerView, restoreFoot, title, start, pick) {
    const oldTitle = dr.titleEl.textContent;
    dr.titleEl.textContent = title;
    formView.classList.add("hidden");
    pickerView.classList.remove("hidden");
    let showHidden = false, cur = null;
    const back = () => { dr.titleEl.textContent = oldTitle; pickerView.classList.add("hidden"); formView.classList.remove("hidden"); restoreFoot(); };
    const choose = h("button", { class: "btn brand", type: "button", onclick: () => { if (cur) { pick(cur); back(); } } }, "Choose this folder");
    dr.foot.replaceChildren(h("button", { class: "btn ghost left", type: "button", onclick: back }, "← Back"), choose);
    const go = async (dir) => {
      let r;
      try {
        r = await api("GET", "/fs?path=" + enc(dir) + (showHidden ? "&hidden=1" : ""));
      } catch (e) {
        if (dir !== S.info.home) return go(S.info.home);
        pickerView.replaceChildren(h("p", { class: "muted" }, e.message));
        return;
      }
      cur = r.path;
      choose.textContent = `Choose “${r.path.split(/[\\/]/).filter(Boolean).pop() || r.path}”`;
      const sep = S.info.sep, parts = r.path.split(/[\\/]/).filter(Boolean), win = /^[A-Za-z]:/.test(r.path);
      const crumbs = h("div", { class: "crumbpath" });
      parts.forEach((part, i) => {
        const full = (win ? "" : sep) + parts.slice(0, i + 1).join(sep) + (win && i === 0 ? sep : "");
        if (i > 0 || !win) crumbs.append(h("span", { class: "sep" }, sep));
        const last = i === parts.length - 1;
        crumbs.append(h("button", { type: "button", class: last ? "here" : "", onclick: last ? null : () => go(full) }, part));
      });
      const hid = h("input", { type: "checkbox", checked: showHidden ? true : null });
      hid.addEventListener("change", () => { showHidden = hid.checked; go(r.path); });
      const join = (n) => r.path.replace(/[\\/]+$/, "") + sep + n;
      pickerView.replaceChildren(crumbs,
        h("div", { class: "dirs" },
          r.parent ? h("button", { type: "button", class: "dir", onclick: () => go(r.parent) }, "↑", h("span", { class: "muted" }, "Up one level")) : "",
          r.dirs.length ? r.dirs.map((n) => h("button", { type: "button", class: "dir", onclick: () => go(join(n)) }, icon("folder"), h("span", {}, n), h("span", { class: "chev" }, "›"))) : h("div", { class: "dir muted", style: { cursor: "default" } }, "This folder has no sub-folders.")),
        h("div", { class: "inline", style: { marginTop: "12px", gap: "14px", flexWrap: "wrap" } },
          r.is_git ? h("span", { class: "pill green" }, "this folder is a git repo") : "",
          h("button", { type: "button", class: "btn small", onclick: () => go(r.home) }, "Home folder"),
          ...(r.drives || []).map((d) => h("button", {
            type: "button", class: "btn small" + (r.path.toUpperCase().startsWith(d.toUpperCase()) ? " primary" : ""),
            title: "Open drive " + d, onclick: () => go(d),
          }, "Drive " + d.replace(/\\$/, ""))),
          h("label", { class: "check", style: { margin: 0 } }, hid, "show hidden folders")),
        h("p", { class: "hint" }, "Click a folder to open it, then press “Choose” below."));
    };
    go(start);
  }

  // "[" expands or collapses the repository toolbar (not while typing, or with a dialog open)
  document.addEventListener("keydown", (e) => {
    if (e.key !== "[" || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (document.querySelector('[aria-modal="true"]')) return;
    const dock = $("#main .gdock"); // the folder pair's or the repository's, whichever is on screen
    if (!dock || !dock.setWide || getComputedStyle(dock.querySelector(".gdock-toggle")).display === "none") return;
    e.preventDefault();
    dock.setWide(!dock.classList.contains("wide"));
  });

  // ---------- start ----------
  setupRail();
  setupPullToRefresh();
  (async () => {
    try {
      S.info = await api("GET", "/info");
    } catch (e) {
      setConn(false);
      if (/token/i.test(e.message)) toast("This page needs the access token: open the link ferry printed.", true);
    }
    // connections first: they decide which tabs a repository shows (Jira's Issues tab)
    S.conns = await api("GET", "/connections").catch(() => null);
    await refresh();
    S.notes = await api("GET", "/events/recent").catch(() => []);
    S.settings = S.settings || (await api("GET", "/settings").catch(() => null));
    paintMe();
    if (devState && devState.scroll) for (const ms of [0, 300, 900]) setTimeout(() => window.scrollTo(0, devState.scroll), ms);
    paintBadge();
    connectEvents();
    setInterval(refresh, 3000);
  })();
})();
</script>
</body>
</html>
