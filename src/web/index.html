<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f1f3f6; --line: #e3e6eb; --text: #1b1f24; --muted: #667080;
  --accent: #2563eb; --accent-text: #ffffff; --accent-soft: #e8efff;
  --green: #16803c; --green-soft: #e6f6ec; --yellow: #a15c00; --yellow-soft: #fff4e0;
  --red: #c8292e; --red-soft: #fdeceb; --purple: #7c3aed; --cyan: #0e7490;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --panel2: #1e232b; --line: #2a3039; --text: #e6e9ee; --muted: #8b95a5;
    --accent: #4c8dff; --accent-text: #0b0e12; --accent-soft: #1a2740;
    --green: #4ade80; --green-soft: #13261b; --yellow: #f5b642; --yellow-soft: #2b2212;
    --red: #f87171; --red-soft: #2c1517; --purple: #a78bfa; --cyan: #22d3ee;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
.logo img { width: 28px; height: 28px; border-radius: 7px; display: block; }
.conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--green); } .dot.bad { background: var(--red); } .dot.warn { background: var(--yellow); }
header .grow { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--red); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel2); }

main { display: grid; grid-template-columns: 290px 1fr; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }

.pairs { display: flex; flex-direction: column; gap: 8px; }
.pair-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; box-shadow: var(--shadow); text-align: left; width: 100%; }
.pair-card:hover { border-color: var(--accent); }
.pair-card.sel { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
.pair-card .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.pair-card .paths { font-size: 12px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair-card .state { font-size: 12px; margin-top: 4px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.detail-head { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.detail-head h1 { font-size: 18px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.route { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.route .path { background: var(--panel2); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 12px; max-width: 100%; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.warn { background: var(--yellow-soft); color: var(--yellow); }
.badge.bad { background: var(--red-soft); color: var(--red); }

.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-size: 11px; background: var(--red); color: white; border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.tabbody { padding: 16px 18px; min-height: 320px; }

.notice { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice.warn { background: var(--yellow-soft); color: var(--yellow); }
.notice.bad { background: var(--red-soft); color: var(--red); }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice.ok { background: var(--green-soft); color: var(--green); font-weight: 500; }
.notice .grow { flex: 1; min-width: 200px; }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); min-height: 38px; }
.row:last-child { border-bottom: 0; }
.row .file { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12.5px; }
.row .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.row .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.sym { width: 18px; text-align: center; font-weight: 700; font-family: var(--mono); flex: none; }
.k-add { color: var(--green); } .k-update { color: var(--yellow); } .k-delete { color: var(--red); } .k-rename { color: var(--purple); }
.k-conflict, .k-error { color: var(--red); } .k-kept { color: var(--cyan); } .k-commit, .k-resolved { color: var(--green); }
.k-warn, .k-paused, .k-skip { color: var(--yellow); }
.conflict { background: var(--red-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.conflict .file { font-family: var(--mono); font-weight: 600; overflow-wrap: anywhere; }
.conflict .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.empty h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
.hero { text-align: center; padding: 60px 20px; }
.hero h2 { font-size: 22px; margin: 0 0 8px; }
.hero p { color: var(--muted); max-width: 520px; margin: 0 auto 18px; }

.log { font-family: var(--mono); font-size: 12px; max-height: 520px; overflow: auto; }
.log .ev { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.log .ev .t { color: var(--muted); flex: none; }
.log .ev .m { overflow-wrap: anywhere; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 700; }
.tile .l { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 16px; }
.bar { display: grid; grid-template-columns: 60px 1fr 50px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { background: var(--panel2); border-radius: 4px; height: 12px; overflow: hidden; }
.bar .fill { background: var(--accent); height: 100%; border-radius: 4px; }
h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.batch { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.batch summary { padding: 8px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; list-style: none; }
.batch summary::-webkit-details-marker { display: none; }
.batch .entries { padding: 0 12px 8px 36px; font-family: var(--mono); font-size: 12px; }
.batch.undone { opacity: .55; }

label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
.field small, .hint { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; font-weight: normal; }
input[type=text], input[type=password], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; }
textarea { min-height: 60px; font-family: var(--mono); font-size: 12.5px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline > input[type=text] { flex: 1; }
.check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
.check input { margin-top: 3px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 600px) { .choices { grid-template-columns: 1fr; } }
.choice { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: block; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-right: 6px; }
.choice small { display: block; color: var(--muted); margin-top: 3px; }
details.more { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
details.more > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }

.modal-bg { position: fixed; inset: 0; background: rgba(10,14,20,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 20; overflow: auto; }
.modal { background: var(--panel); border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.wide { max-width: 980px; }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 10px; }
.modal-head h2 { font-size: 16px; margin: 0; flex: 1; overflow-wrap: anywhere; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }

.field > label { display: block; font-weight: 600; margin-bottom: 4px; }
.field-error { color: var(--red) !important; font-weight: 500; }
input.invalid { border-color: var(--red); }
.picker .crumbs { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 10px; }
.picker .crumb { border: 0; background: none; padding: 2px 6px; border-radius: 6px; cursor: pointer; color: var(--accent); }
.picker .crumb:hover { background: var(--accent-soft); }
.picker .crumb.here { color: var(--text); font-weight: 600; cursor: default; background: none; }
.picker .crumbs .slash { color: var(--muted); }
.picker .dirs { border: 1px solid var(--line); border-radius: 8px; max-height: 340px; min-height: 120px; overflow: auto; }
.picker .dir { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.picker .dir:last-child { border-bottom: 0; }
.picker .dir:hover, .picker .dir:focus-visible { background: var(--accent-soft); }
.picker .dir .chev { margin-left: auto; color: var(--muted); }
.picker .tools { display: flex; gap: 12px; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; }

.diff { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel2); border-radius: 8px; padding: 10px 0; max-height: 65vh; overflow: auto; }
.diff div { padding: 0 12px; }
.diff .a { background: var(--green-soft); color: var(--green); }
.diff .d { background: var(--red-soft); color: var(--red); }
.diff .h { color: var(--cyan); }

.toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.bad { background: var(--red); color: white; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <img src="/logo.svg" alt="" width="28" height="28">
    Ferry
  </div>
  <div class="conn" title="Connection to the ferry process"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting…</span></div>
  <div class="grow"></div>
  <span class="muted" id="version"></span>
  <button class="btn primary" id="add-btn">+ Add folder pair</button>
</header>

<main id="main">
  <aside class="pairs" id="pairs" aria-label="Folder pairs"></aside>
  <section id="detail"></section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<template id="add-tpl">
  <div class="modal-bg">
    <form class="modal" autocomplete="off">
      <div class="modal-head"><h2 data-title>Add a folder pair</h2><button type="button" class="btn ghost" data-close aria-label="Close">✕</button></div>
      <div class="modal-body picker hidden" data-picker-view></div>
      <div class="modal-body" data-form-view>
        <div class="field">
          <label for="f-source"><span>Your working folder (source)</span></label>
          <div class="inline"><input type="text" id="f-source" name="source" placeholder="Choose the folder you edit in"><button type="button" class="btn" data-browse="source">Choose…</button></div>
          <small>Where you edit files. Ferry watches this folder.</small>
          <small class="field-error hidden" data-error="source"></small>
        </div>
        <div class="field">
          <label for="f-target"><span>Where the files should go (target)</span></label>
          <div class="inline"><input type="text" id="f-target" name="target" placeholder="Choose the destination folder, usually a git repo"><button type="button" class="btn" data-browse="target">Choose…</button></div>
          <small>Usually a git repository. You can also type <span class="mono">user@server:/path</span> (ssh) or <span class="mono">s3://bucket/folder</span> (cloud storage).</small>
          <small class="field-error hidden" data-error="target"></small>
        </div>

        <div class="field"><span style="font-weight:600;display:block;margin-bottom:6px">How should they stay in sync?</span>
          <div class="choices">
            <label class="choice"><input type="radio" name="mode" value="one-way" checked>One way →<small>Changes in the working folder are copied to the target. Edits in the target are left alone.</small></label>
            <label class="choice"><input type="radio" name="mode" value="two-way">Both ways ⇄<small>Changes on either side are copied to the other. If both change the same file, you choose.</small></label>
          </div>
        </div>

        <details class="more">
          <summary>More options</summary>
          <label class="field" style="margin-top:10px"><span>Name</span><input type="text" name="name" placeholder="e.g. website"><small>Optional. Shown in the list and in notifications.</small></label>
          <label class="field"><span>When a file is deleted on one side</span>
            <select name="on_delete">
              <option value="keep">Keep the other copy (safest)</option>
              <option value="propagate">Delete it on the other side too</option>
              <option value="restore">Put it back from the other side (both ways only)</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" name="merge"><span>Try to merge edits automatically when both sides changed a text file <small class="hint">Both ways only. Falls back to asking you if the edits overlap.</small></span></label>
          <label class="field"><span>Files to skip</span><textarea name="ignore" placeholder="dist&#10;*.log&#10;tmp/"></textarea><small>One pattern per line, like .gitignore. node_modules and .git are always skipped.</small></label>
          <label class="field"><span>Things that look like passwords or keys</span>
            <select name="secrets">
              <option value="warn">Copy them, but warn me</option>
              <option value="block">Don't copy those files</option>
              <option value="redact">Copy with the secrets blanked out (one way only)</option>
              <option value="off">Don't check</option>
            </select>
          </label>
          <label class="field"><span>Also copy to these targets</span><textarea name="targets" placeholder="/Users/you/code/other-repo&#10;s3://my-bucket/backup"></textarea><small>One per line. Each becomes its own one-way pair from the same working folder.</small></label>
          <label class="check"><input type="checkbox" name="ac_enabled"><span>Commit to git automatically</span></label>
          <div data-ac class="hidden" style="padding-left:24px">
            <div class="inline" style="margin-bottom:8px"><span>every</span><select name="ac_interval" style="width:auto"><option value="5m">5 minutes</option><option value="10m" selected>10 minutes</option><option value="30m">30 minutes</option><option value="1h">hour</option></select></div>
            <label class="check"><input type="checkbox" name="ac_ai"><span>Let Claude write the commit messages <small class="hint">Needs an Anthropic API key (ANTHROPIC_API_KEY) where ferry runs. Otherwise a summary like “update 3 files in src” is used.</small></span></label>
            <label class="check"><input type="checkbox" name="ac_push"><span>Push after committing</span></label>
          </div>
        </details>
        <p class="hint" data-save-note></p>
      </div>
      <div class="modal-foot" data-form-foot><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Start syncing</button></div>
      <div class="modal-foot hidden" data-picker-foot></div>
    </form>
  </div>
</template>

<script>
"use strict";
(() => {
  // ---------- plumbing ----------
  const params = new URLSearchParams(location.search);
  if (params.get("token")) {
    sessionStorage.setItem("ferry-token", params.get("token"));
    history.replaceState(null, "", location.pathname);
  }
  const token = sessionStorage.getItem("ferry-token") || "";
  const $ = (sel, root = document) => root.querySelector(sel);
  const enc = encodeURIComponent;

  /** Builds an element: h("div", {class: "x", onclick: f}, "text", child, …). Text is never parsed as HTML. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }

  async function api(method, url, body) {
    const headers = { "X-Ferry": "web" };
    if (token) headers.Authorization = "Bearer " + token;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const res = await fetch(url, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) throw new Error(text.trim() || res.statusText);
    const type = res.headers.get("Content-Type") || "";
    return type.includes("json") ? JSON.parse(text) : text;
  }
  const pairURL = (name, action) => `/pairs/${enc(name)}/${action}`;

  function toast(msg, bad = false) {
    const t = h("div", { class: "toast" + (bad ? " bad" : "") }, msg);
    $("#toasts").append(t);
    setTimeout(() => t.remove(), bad ? 7000 : 3500);
  }
  async function act(label, f) {
    try {
      const r = await f();
      if (label) toast(label);
      return r;
    } catch (e) {
      toast(e.message, true);
      return null;
    }
  }

  function ago(iso) {
    const t = Date.parse(iso);
    if (!t || iso.startsWith("0001")) return "never";
    const d = (Date.now() - t) / 1000;
    if (d < 45) return "just now";
    if (d < 3600) return Math.round(d / 60) + " min ago";
    if (d < 86400) return Math.round(d / 3600) + " h ago";
    return new Date(t).toLocaleString();
  }
  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const SYM = { add: "+", update: "~", delete: "−", rename: "↻", conflict: "!", resolved: "✓", error: "✗", warn: "⚠", paused: "‖", resumed: "▶", skip: "·", kept: "◇", commit: "●", synced: "⇄", git: "⎇", info: "i" };
  const KIND_WORD = { add: "added", update: "updated", delete: "deleted", rename: "renamed", kept: "kept", conflict: "conflict" };

  function stateOf(p) {
    if (p.conflicts.length) return ["bad", p.conflicts.length + (p.conflicts.length === 1 ? " conflict" : " conflicts")];
    if (p.pending_batch > 0) return ["warn", p.pending_batch + " changes waiting for approval"];
    if (p.user_paused) return ["warn", "paused"];
    if (p.guard_reason) return ["warn", "paused: " + p.guard_reason];
    if (p.pending) return ["", "settling…"];
    if (!p.watcher) return ["", "starting…"];
    return ["ok", "watching"];
  }
  const arrowOf = (p) => (p.mode === "two-way" ? "⇄" : "→");

  // ---------- state ----------
  const S = {
    info: null, pairs: [], sel: localStorage.getItem("ferry-sel") || "", tab: "files",
    log: new Map(), // pair -> events (newest last)
    cleared: new Map(), // pair -> time the user cleared the "copied" list
    connected: false,
  };
  const MAX_LOG = 400;

  async function refresh() {
    try {
      S.pairs = await api("GET", "/status");
      setConn(true);
    } catch {
      setConn(false);
      return;
    }
    if (!S.pairs.some((p) => p.name === S.sel)) S.sel = S.pairs[0] ? S.pairs[0].name : "";
    render();
  }
  let refreshTimer = null;
  const refreshSoon = () => {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(refresh, 250);
  };

  function setConn(ok) {
    S.connected = ok;
    $("#conn-dot").className = "dot " + (ok ? "ok" : "bad");
    $("#conn-text").textContent = ok ? "connected" : "ferry isn't running";
  }

  // live events
  function connectEvents() {
    const es = new EventSource("/events" + (token ? "?token=" + enc(token) : ""));
    const onEv = (m) => {
      let ev;
      try {
        ev = JSON.parse(m.data);
      } catch {
        return;
      }
      const list = S.log.get(ev.pair) || [];
      list.push(ev);
      if (list.length > MAX_LOG) list.splice(0, list.length - MAX_LOG);
      S.log.set(ev.pair, list);
      if (ev.kind === "conflict" && ev.held && document.hidden) document.title = "(!) Ferry";
      if (ev.kind === "error") toast(`${ev.pair}: ${ev.message || "error"}${ev.path ? " (" + ev.path + ")" : ""}`, true);
      if (ev.kind === "commit") toast(`${ev.pair}: ${ev.message}`);
      if (ev.pair === S.sel && S.tab === "activity") renderTab();
      refreshSoon();
    };
    for (const k of Object.keys(SYM)) es.addEventListener(k, onEv);
    es.onopen = () => setConn(true);
    es.onerror = () => setConn(false);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "Ferry"; });

  // ---------- rendering ----------
  function render() {
    renderPairs();
    renderDetail();
  }

  function renderPairs() {
    const box = $("#pairs");
    box.replaceChildren();
    for (const p of S.pairs) {
      const [cls, label] = stateOf(p);
      box.append(
        h("button", { class: "pair-card" + (p.name === S.sel ? " sel" : ""), onclick: () => select(p.name) },
          h("div", { class: "name" }, h("span", { class: "dot " + cls }), p.name),
          h("div", { class: "paths", title: `${p.source} ${arrowOf(p)} ${p.remote || p.target}` }, `${short(p.source)} ${arrowOf(p)} ${short(p.remote || p.target)}`),
          h("div", { class: "state muted" }, label, " · last sync ", ago(p.last_sync)),
        ),
      );
    }
    if (S.pairs.length === 0) box.append(h("div", { class: "muted", style: "padding:8px 4px" }, "No folder pairs yet."));
  }
  function short(p) {
    const home = S.info && S.info.home;
    if (home && p.startsWith(home)) p = "~" + p.slice(home.length);
    return p.length > 38 ? "…" + p.slice(-37) : p;
  }

  function select(name) {
    S.sel = name;
    localStorage.setItem("ferry-sel", name);
    render();
  }
  const current = () => S.pairs.find((p) => p.name === S.sel);

  function renderDetail() {
    const box = $("#detail");
    const p = current();
    if (!p) {
      box.replaceChildren(
        h("div", { class: "panel hero" },
          h("h2", {}, "Keep a folder and a repository in sync"),
          h("p", {}, "Pick the folder you work in and the folder (usually a git repository) it should be copied to. Ferry watches for changes and copies them for you, with backups, undo and conflict help."),
          S.info && !S.info.can_add
            ? h("p", { class: "muted" }, "Start ferry with “ferry ui” to add pairs from here.")
            : h("button", { class: "btn primary", onclick: openAdd }, "+ Add your first folder pair"),
        ),
      );
      return;
    }
    const [cls, label] = stateOf(p);
    const paused = p.user_paused;
    const head = h("div", { class: "detail-head" },
      h("h1", {}, p.name, h("span", { class: "badge " + cls }, label)),
      h("div", { class: "route" },
        h("span", { class: "path", title: "source" }, p.source), h("span", { "aria-label": p.mode }, arrowOf(p)), h("span", { class: "path", title: "target" }, p.remote || p.target),
      ),
      h("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
        p.mode === "two-way" ? "Both ways" : "One way", " · ", p.watcher || "starting", " · last sync ", ago(p.last_sync),
        ` · this session: +${p.added} ~${p.updated} −${p.deleted} ↻${p.renamed}`, p.failed ? ` · ${p.failed} failed` : "",
        p.is_git ? ` · git ${p.branch || ""}` : "",
      ),
      h("div", { class: "actions" },
        h("button", { class: "btn", onclick: () => act(paused ? "resumed" : "paused", () => api("POST", pairURL(p.name, paused ? "resume" : "pause"))).then(refreshSoon) }, paused ? "▶ Resume" : "‖ Pause"),
        h("button", { class: "btn", title: "Compare every file by content and copy what differs", onclick: (ev) => syncNow(p, ev.currentTarget) }, "⟳ Sync everything now"),
        p.pending_batch > 0 && h("button", { class: "btn primary", onclick: () => act("approved", () => api("POST", pairURL(p.name, "approve"))).then(refreshSoon) }, `Approve ${p.pending_batch} changes`),
        S.info && S.info.can_add && h("button", { class: "btn danger", onclick: () => removePair(p) }, "Stop syncing"),
      ),
    );
    const tabs = [
      ["files", "Files", p.conflicts.length],
      ["git", "Commit", 0],
      ["history", "History & undo", 0],
      ["stats", "Stats", 0],
      ["activity", "Activity", 0],
    ].filter(([id]) => id !== "git" || p.is_git);
    if (!tabs.some(([id]) => id === S.tab)) S.tab = "files";
    const tabBar = h("div", { class: "tabs", role: "tablist" },
      tabs.map(([id, name, n]) => h("button", { class: "tab" + (S.tab === id ? " on" : ""), role: "tab", "aria-selected": S.tab === id ? "true" : "false", onclick: () => { S.tab = id; renderDetail(); } }, name, n ? h("span", { class: "count" }, n) : null)),
    );
    // keep the tab's content (and anything typed in it) unless what it shows changed
    const key = tabKey(p);
    const old = $("#tabbody");
    const reuse = old && S.shown === key;
    const body = reuse ? old : h("div", { class: "tabbody", id: "tabbody" });
    box.replaceChildren(h("div", { class: "panel" }, head, tabBar, body));
    if (!reuse) {
      S.shown = key;
      renderTab();
    }
  }

  function tabKey(p) {
    const base = p.name + "|" + S.tab + "|";
    switch (S.tab) {
      case "files": return base + JSON.stringify([p.changed, p.conflicts, p.guard_reason, p.user_paused, p.pending, p.pending_batch, !!p.watcher, (p.git_status || []).length, p.last_sync, Math.floor(Date.now() / 60000)]);
      case "git": {
        const typing = document.activeElement && $("#tabbody")?.contains(document.activeElement);
        return typing && S.shown?.startsWith(base) ? S.shown : base + JSON.stringify(p.git_status);
      }
      case "activity": return base + (S.log.get(p.name) || []).length;
      default: return base + (S.bump || 0); // history and stats reload when asked
    }
  }

  function renderTab() {
    const body = $("#tabbody");
    const p = current();
    if (!body || !p) return;
    ({ files: tabFiles, git: tabGit, history: tabHistory, stats: tabStats, activity: tabActivity })[S.tab](body, p);
  }

  // ---------- files ----------
  function tabFiles(body, p) {
    body.replaceChildren();
    // 1. the state right now, in plain words
    if (p.guard_reason) body.append(h("div", { class: "notice warn" }, "‖ Paused automatically: " + p.guard_reason));
    else if (p.user_paused) body.append(h("div", { class: "notice warn" }, "‖ Paused. Changes are collected and copied when you resume."));
    else if (p.pending_batch > 0) body.append(h("div", { class: "notice warn" }, `${p.pending_batch} changes are waiting for your approval (button above).`));
    else if (p.pending || !p.watcher) body.append(h("div", { class: "notice info" }, "⟳ Syncing…"));
    else if (!p.conflicts.length) {
      body.append(h("div", { class: "notice ok" }, "✓ All synced. The target matches your working folder" + (p.last_sync && !p.last_sync.startsWith("0001") ? " (last copy " + ago(p.last_sync) + ")." : ".")));
    }
    if (p.conflicts.length) {
      body.append(h("h3", {}, "Needs your decision"));
      for (const c of p.conflicts) body.append(conflictBox(p, c));
    }

    // 2. what git sees: differences from the target's last commit are not sync problems
    const dirty = (p.git_status || []).length;
    if (p.is_git && dirty > 0) {
      body.append(h("div", { class: "notice info" },
        h("span", { class: "grow" }, `${dirty} file(s) in the target differ from its last git commit. That's normal after syncing: commit them when you're ready.`),
        h("button", { class: "btn small", onclick: () => { S.tab = "git"; renderDetail(); } }, "Review and commit"),
      ));
    }

    // 3. a log of what was copied, which the user can clear
    const cleared = S.cleared.get(p.name) || 0;
    const files = (p.changed || []).filter((c) => !p.conflicts.includes(c.path) && Date.parse(c.time) > cleared).sort((a, b) => Date.parse(b.time) - Date.parse(a.time));
    if (files.length === 0) {
      body.append(h("p", { class: "muted", style: "margin-top:16px" }, "Files Ferry copies will be listed here, newest first."));
      return;
    }
    body.append(h("div", { class: "inline", style: "margin-top:16px" },
      h("h3", { style: "margin:0;flex:1" }, "Copied since ferry started"),
      h("button", { class: "btn small ghost", title: "Hide these entries (nothing is changed on disk)", onclick: () => { S.cleared.set(p.name, Date.now()); S.shown = ""; renderDetail(); } }, "Clear list"),
    ));
    const list = h("div", { class: "list" });
    for (const c of files.slice(0, 500)) {
      list.append(h("div", { class: "row" },
        h("span", { class: "sym k-" + c.kind, title: c.kind }, SYM[c.kind] || "·"),
        h("span", { class: "file" }, c.path),
        h("span", { class: "when" }, "copied " + (KIND_WORD[c.kind] ? "(" + KIND_WORD[c.kind] + ") " : "") + ago(c.time)),
        h("span", { class: "btns" },
          c.kind !== "delete" && h("button", { class: "btn small", title: "What changed compared with the last git commit", onclick: () => showDiff(p, c.path, false) }, "Diff"),
          h("button", { class: "btn small", title: "Stop syncing this file (adds it to .syncignore)", onclick: () => ignoreFile(p, c.path) }, "Ignore"),
        ),
      ));
    }
    body.append(list);
    if (files.length > 500) body.append(h("p", { class: "muted" }, `… and ${files.length - 500} more`));
  }

  /** Full resync, then a clear "done" message once the pass has finished. */
  async function syncNow(p, btn) {
    btn.disabled = true;
    btn.textContent = "⟳ Syncing…";
    const before = (S.log.get(p.name) || []).length;
    const ok = await act(null, () => api("POST", pairURL(p.name, "resync")));
    if (ok) {
      // wait for the pass to settle (the engine reports "settling" while it works)
      for (let i = 0; i < 40; i++) {
        await new Promise((r) => setTimeout(r, 250));
        const st = (await api("GET", "/status").catch(() => [])).find((x) => x.name === p.name);
        if (st && !st.pending && i >= 2) break;
      }
      const evs = (S.log.get(p.name) || []).slice(before);
      const copied = evs.filter((e) => ["add", "update", "delete", "rename"].includes(e.kind)).length;
      const errs = evs.filter((e) => e.kind === "error").length;
      if (errs) toast(`Sync finished with ${errs} error(s); see Activity`, true);
      else toast(copied ? `✓ Sync finished: ${copied} file(s) copied` : "✓ Sync finished: everything already matched");
    }
    await refresh();
  }

  function conflictBox(p, file) {
    const resolve = (choice, label) => act(`${file}: ${label}`, () => api("POST", pairURL(p.name, "resolve"), { path: file, choice })).then(refreshSoon);
    return h("div", { class: "conflict" },
      h("div", { class: "file" }, "! ", file),
      h("div", { class: "muted", style: "font-size:12px" }, "This file was changed in both folders since the last sync. Which version should win?"),
      h("div", { class: "btns" },
        h("button", { class: "btn small", onclick: () => showDiff(p, file, true) }, "Compare"),
        h("button", { class: "btn small", onclick: () => resolve("source", "kept the working folder's version") }, "Keep working folder's"),
        h("button", { class: "btn small", onclick: () => resolve("target", "kept the target's version") }, "Keep target's"),
        h("button", { class: "btn small", onclick: () => resolve("newer", "kept the newer version") }, "Keep newer"),
        h("button", { class: "btn small", onclick: () => resolve("both", "kept both versions") }, "Keep both"),
        h("button", { class: "btn small", title: "Combine both edits; overlapping lines get <<<<<<< markers", onclick: () => resolve("merge", "merged") }, "Merge"),
      ),
    );
  }

  async function ignoreFile(p, file) {
    if (!confirm(`Stop syncing ${file}?\n\nIt is added to .syncignore in the working folder. Copies already made are left as they are.`)) return;
    const r = await act(null, () => api("POST", pairURL(p.name, "ignore"), { path: file }));
    if (r) toast(r.already ? `${file} was already ignored` : `ignoring ${file} from now on`);
    refreshSoon();
  }

  async function showDiff(p, file, conflict) {
    const text = await act(null, () => api("GET", pairURL(p.name, "diff") + "?path=" + enc(file) + (conflict ? "&conflict=1" : "")));
    if (text == null) return;
    const lines = text.replace(/\n$/, "").split("\n");
    const title = lines.shift();
    const pre = h("div", { class: "diff" }, lines.length ? lines.map((l) => h("div", { class: l.startsWith("@@") ? "h" : l[0] === "+" ? "a" : l[0] === "-" ? "d" : "" }, l || " ")) : h("div", {}, "no differences"));
    modal(title, pre, { wide: true });
  }

  // ---------- git ----------
  function tabGit(body, p) {
    body.replaceChildren();
    const lines = p.git_status || [];
    body.append(h("h3", { style: "margin-top:0" }, `Not committed yet (${lines.length})`));
    if (lines.length === 0) body.append(h("p", { class: "muted" }, "Nothing to commit: the target matches its last commit."));
    else {
      const list = h("div", { class: "list" });
      for (const l of lines.slice(0, 300)) {
        const code = l.slice(0, 2), file = l.slice(3);
        const kind = code.includes("?") || code.includes("A") ? "add" : code.includes("D") ? "delete" : code.includes("R") ? "rename" : "update";
        list.append(h("div", { class: "row" }, h("span", { class: "sym k-" + kind }, SYM[kind]), h("span", { class: "file" }, file), h("span", { class: "when mono" }, code.trim() || "M")));
      }
      body.append(list);
    }
    const msg = h("input", { type: "text", placeholder: "Describe the change (leave empty for an automatic summary)" });
    const useAI = h("input", { type: "checkbox" });
    const push = h("input", { type: "checkbox" });
    useAI.addEventListener("change", () => { msg.disabled = useAI.checked; });
    body.append(
      h("h3", {}, "Commit"),
      h("label", { class: "field" }, msg),
      h("label", { class: "check" }, useAI, h("span", {}, "Let Claude write the message from the changes", h("small", { class: "hint" }, "Needs ANTHROPIC_API_KEY where ferry runs; falls back to an automatic summary."))),
      h("label", { class: "check" }, push, h("span", {}, "Push to the remote afterwards")),
      h("button", {
        class: "btn primary", disabled: lines.length === 0 ? true : null,
        onclick: () => {
          const m = useAI.checked ? "{ai}" : msg.value.trim() || "sync: {summary}";
          act(useAI.checked ? "asking Claude for a message and committing…" : "committing…", () => api("POST", pairURL(p.name, "commit") + "?message=" + enc(m) + (push.checked ? "&push=1" : "")));
          msg.value = "";
        },
      }, "Commit"),
    );
  }

  // ---------- history ----------
  async function tabHistory(body, p) {
    body.replaceChildren(h("p", { class: "muted" }, "Loading…"));
    const batches = await act(null, () => api("GET", pairURL(p.name, "history")));
    if (!batches || current()?.name !== p.name) return;
    body.replaceChildren();
    const remote = !!p.remote;

    // go back in time
    const when = h("select", {},
      h("option", { value: "15m ago" }, "15 minutes ago"),
      h("option", { value: "1h ago" }, "1 hour ago"),
      h("option", { value: "3h ago" }, "3 hours ago"),
      h("option", { value: "today" }, "the start of today"),
      h("option", { value: "24h ago" }, "24 hours ago"),
      h("option", { value: "7d ago" }, "a week ago"),
      h("option", { value: "custom" }, "a specific time…"),
    );
    const custom = h("input", { type: "text", class: "hidden", placeholder: "e.g. 14:30 or 2026-11-07 09:00" });
    when.addEventListener("change", () => custom.classList.toggle("hidden", when.value !== "custom"));
    const restoreBtn = h("button", { class: "btn", disabled: remote ? true : null }, "Go back…");
    restoreBtn.addEventListener("click", async () => {
      const at = when.value === "custom" ? custom.value.trim() : when.value;
      if (!at) return toast("enter a time", true);
      const pre = await act(null, () => api("POST", pairURL(p.name, "restore"), { at, dry_run: true }));
      if (!pre) return;
      if (pre.batches === 0) return toast("nothing to undo: no syncs happened after " + new Date(pre.restored_to).toLocaleString());
      const shown = pre.files.slice(0, 12).join("\n") + (pre.files.length > 12 ? `\n… and ${pre.files.length - 12} more` : "");
      if (!confirm(`Go back to ${new Date(pre.restored_to).toLocaleString()}?\n\nThis undoes ${pre.batches} sync(s) touching ${pre.files.length} file(s):\n${shown}\n\nCurrent versions are backed up first.`)) return;
      const r = await act(null, () => api("POST", pairURL(p.name, "restore"), { at }));
      if (r) toast(`went back: reverted ${r.reverted} change(s)` + (r.problems.length ? `, ${r.problems.length} problem(s)` : ""), r.problems.length > 0);
      renderTab();
    });
    body.append(
      h("div", { class: "notice info" },
        h("span", { class: "grow" }, remote ? "Undo isn't available for ssh or cloud targets." : "Go back to how ferry left things at"),
        !remote && when, !remote && custom, !remote && restoreBtn,
      ),
    );

    if (batches.length === 0) {
      body.append(h("div", { class: "empty" }, h("h2", {}, "No history yet"), "Every sync is recorded here so it can be undone."));
      return;
    }
    const newest = batches.find((b) => !b.undone);
    if (newest && !remote) {
      body.append(h("div", { style: "margin-bottom:10px" }, h("button", {
        class: "btn",
        onclick: async () => {
          if (!confirm("Undo the most recent sync? Current versions are backed up first.")) return;
          const r = await act(null, () => api("POST", pairURL(p.name, "undo")));
          if (r) toast("undone" + (r.problems.length ? ` with ${r.problems.length} problem(s): ${r.problems[0]}` : ""), r.problems.length > 0);
          renderTab();
        },
      }, "↶ Undo the last sync")));
    }
    for (const b of batches.slice(0, 100)) {
      const n = { add: 0, update: 0, delete: 0, rename: 0 };
      for (const e of b.entries) n[e.op] = (n[e.op] || 0) + 1;
      body.append(h("details", { class: "batch" + (b.undone ? " undone" : "") },
        h("summary", {},
          h("span", { class: "muted mono" }, new Date(b.time).toLocaleString()),
          h("span", {}, `+${n.add} ~${n.update} −${n.delete} ↻${n.rename}`),
          b.undone && h("span", { class: "badge" }, "undone"),
        ),
        h("div", { class: "entries" }, b.entries.map((e) => h("div", {}, h("span", { class: "k-" + (e.op === "delete" ? "delete" : e.op) }, e.op), " ", e.path, e.to ? " → " + e.to : "", h("span", { class: "muted" }, ` (${e.side})`)))),
      ));
    }
  }

  // ---------- stats ----------
  async function tabStats(body, p) {
    const since = S.statsSince || "7d";
    const sel = h("select", { style: "width:auto" },
      [["24h", "last 24 hours"], ["7d", "last 7 days"], ["30d", "last 30 days"], ["all", "all history"]].map(([v, l]) => h("option", { value: v, selected: v === since ? true : null }, l)),
    );
    sel.addEventListener("change", () => { S.statsSince = sel.value; renderTab(); });
    body.replaceChildren(h("div", { class: "inline", style: "margin-bottom:12px" }, h("span", {}, "Showing"), sel));
    const s = await act(null, () => api("GET", pairURL(p.name, "stats") + "?since=" + enc(since)));
    if (!s) return;
    if (s.batches === 0) {
      body.append(h("div", { class: "empty" }, h("h2", {}, "Nothing synced in this period")));
      return;
    }
    const tile = (v, l) => h("div", { class: "tile" }, h("div", { class: "v" }, v), h("div", { class: "l" }, l));
    body.append(h("div", { class: "tiles" },
      tile(s.batches, "syncs"), tile(s.added, "files added"), tile(s.updated, "files updated"), tile(s.deleted, "files deleted"), tile(s.renamed, "renamed"),
      s.undone ? tile(s.undone, "syncs undone") : null,
    ));
    if (s.perDay.length > 0) {
      const max = Math.max(...s.perDay.map((d) => d.files));
      body.append(h("h3", {}, "File changes per day"), h("div", { class: "bars" },
        s.perDay.slice(-30).map((d) => h("div", { class: "bar" }, h("span", { class: "muted" }, d.day.slice(5)), h("div", { class: "track" }, h("div", { class: "fill", style: `width:${Math.max(2, (d.files / max) * 100)}%` })), h("span", {}, d.files))),
      ));
    }
    if (s.topFiles.length) {
      body.append(h("h3", {}, "Most changed files"), h("div", { class: "list" },
        s.topFiles.map((t) => h("div", { class: "row" }, h("span", { class: "file" }, t.path), h("span", { class: "when" }, t.changes + "×"))),
      ));
    }
  }

  // ---------- activity ----------
  function tabActivity(body, p) {
    const evs = (S.log.get(p.name) || []).filter((e) => e.kind !== "git");
    if (evs.length === 0) {
      body.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "Waiting for activity"), "Live events appear here while this page is open."));
      return;
    }
    const log = h("div", { class: "log" }, evs.slice().reverse().map((e) => h("div", { class: "ev" },
      h("span", { class: "t" }, clock(e.time)),
      h("span", { class: "k-" + e.kind, style: "width:14px;flex:none;text-align:center" }, SYM[e.kind] || "·"),
      h("span", { class: "m" }, [e.direction, e.path, e.to ? "→ " + e.to : "", e.message ? (e.path ? "— " : "") + e.message : "", e.dry_run ? "(dry run)" : ""].filter(Boolean).join(" ")),
    )));
    body.replaceChildren(log);
  }

  // ---------- modals ----------
  function modal(title, content, opts = {}) {
    const bg = h("div", { class: "modal-bg" });
    const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    bg.append(h("div", { class: "modal" + (opts.wide ? " wide" : ""), role: "dialog", "aria-modal": "true" },
      h("div", { class: "modal-head" }, h("h2", {}, title), h("button", { class: "btn ghost", "aria-label": "Close", onclick: close }, "✕")),
      h("div", { class: "modal-body" }, content),
    ));
    bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
    document.addEventListener("keydown", onKey);
    document.body.append(bg);
    return close;
  }

  async function removePair(p) {
    if (!confirm(`Stop syncing “${p.name}”?\n\nNo files are deleted. You can add the pair again later.`)) return;
    const r = await act(null, () => api("POST", pairURL(p.name, "remove")));
    if (r) toast(r.savedRemoval ? `stopped and removed ${p.name} from the config` : `stopped syncing ${p.name} (for this session)`);
    refresh();
  }

  function openAdd() {
    if (!S.info || !S.info.can_add) return toast("Start ferry with “ferry ui” to add pairs from here.", true);
    const node = $("#add-tpl").content.firstElementChild.cloneNode(true);
    const form = $("form", node);
    // form.name / form.target are the form's own attributes, so look inputs up by name
    const F = (n) => form.elements.namedItem(n);
    const close = () => { node.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    node.addEventListener("click", (e) => { if (e.target === node) close(); });
    form.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
    $("[data-save-note]", form).textContent = S.info.config_file ? "The pair is saved in " + S.info.config_file + " so it starts again next time." : "This pair lasts until ferry stops (ferry was started with folders on the command line).";
    F("ac_enabled").addEventListener("change", () => $("[data-ac]", form).classList.toggle("hidden", !F("ac_enabled").checked));
    const LABELS = { source: "Choose your working folder", target: "Choose where the files should go" };
    form.querySelectorAll("[data-browse]").forEach((b) => b.addEventListener("click", () => {
      const which = b.dataset.browse;
      const typed = F(which).value.trim();
      openPicker(form, LABELS[which], typed && !/^(s3:\/\/|ssh:\/\/|[^/\\]+@)/.test(typed) ? typed : S.info.home, (dir) => {
        F(which).value = dir;
        showError(which, "");
      });
    }));
    const showError = (which, msg) => {
      const el = $(`[data-error=${which}]`, form);
      el.textContent = msg;
      el.classList.toggle("hidden", !msg);
      F(which).classList.toggle("invalid", !!msg);
    };
    for (const w of ["source", "target"]) F(w).addEventListener("input", () => showError(w, ""));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
      const missing = ["source", "target"].filter((w) => !F(w).value.trim());
      if (missing.includes("source")) showError("source", "Choose the folder you work in.");
      if (missing.includes("target")) showError("target", "Choose where the files should go.");
      if (missing.length) return F(missing[0]).focus();
      const two = F("mode").value === "two-way";
      const body = {
        name: F("name").value.trim(), source: F("source").value.trim(), target: F("target").value.trim(), mode: F("mode").value,
        on_delete: F("on_delete").value, ignore: lines(F("ignore").value), secrets: F("secrets").value,
      };
      if (two) {
        body.merge = F("merge").checked;
        if (body.secrets === "redact") return toast("Blanking out secrets only works one way", true);
      } else if (body.on_delete === "restore") return toast("“Put it back” only works when syncing both ways", true);
      const extra = lines(F("targets").value);
      if (extra.length) {
        if (two) return toast("Extra targets only work one way", true);
        body.targets = extra;
      }
      if (F("ac_enabled").checked) {
        body.auto_commit = { enabled: true, interval: F("ac_interval").value, push: F("ac_push").checked, message: F("ac_ai").checked ? "{ai}" : "sync: {summary}" };
      }
      const btn = $("button[type=submit]", form);
      btn.disabled = true;
      const r = await act(null, () => api("POST", "/pairs", body));
      btn.disabled = false;
      if (!r) return;
      toast("syncing " + r.added.join(", "));
      close();
      S.sel = r.added[0];
      await refresh();
    });
    document.body.append(node);
    F("source").focus();
  }

  /**
   * Swaps the add-pair form for a folder browser (one at a time, titled with
   * what is being chosen). pick(dir) gets the chosen folder; Back returns to
   * the form without changing anything.
   */
  function openPicker(form, title, start, pick) {
    const view = $("[data-picker-view]", form), foot = $("[data-picker-foot]", form);
    const formView = $("[data-form-view]", form), formFoot = $("[data-form-foot]", form), head = $("[data-title]", form);
    const oldTitle = head.textContent;
    let showHidden = false, current = null;
    const done = () => {
      view.classList.add("hidden");
      foot.classList.add("hidden");
      formView.classList.remove("hidden");
      formFoot.classList.remove("hidden");
      head.textContent = oldTitle;
    };
    head.textContent = title;
    formView.classList.add("hidden");
    formFoot.classList.add("hidden");
    view.classList.remove("hidden");
    foot.classList.remove("hidden");

    const chooseBtn = h("button", { type: "button", class: "btn primary", onclick: () => { if (current) { pick(current); done(); } } }, "Choose this folder");
    foot.replaceChildren(h("button", { type: "button", class: "btn left", onclick: done }, "← Back"), chooseBtn);

    const go = async (dir) => {
      let r;
      try {
        r = await api("GET", "/fs?path=" + enc(dir) + (showHidden ? "&hidden=1" : ""));
      } catch (e) {
        // a typed folder that doesn't exist yet: start from home instead
        if (dir !== S.info.home) return go(S.info.home);
        view.replaceChildren(h("p", { class: "muted" }, e.message));
        return;
      }
      current = r.path;
      const base = r.path.split(/[\\/]/).filter(Boolean).pop() || r.path;
      chooseBtn.textContent = `Choose “${base}”`;

      // clickable breadcrumb: / Users / you / code
      const sep = S.info.sep;
      const parts = r.path.split(/[\\/]/).filter(Boolean);
      const isWin = /^[A-Za-z]:/.test(r.path);
      const crumbs = h("div", { class: "crumbs", "aria-label": "Current folder" });
      parts.forEach((part, i) => {
        const full = (isWin ? "" : sep) + parts.slice(0, i + 1).join(sep) + (isWin && i === 0 ? sep : "");
        if (i > 0 || !isWin) crumbs.append(h("span", { class: "slash" }, sep));
        const last = i === parts.length - 1;
        crumbs.append(h("button", { type: "button", class: "crumb" + (last ? " here" : ""), onclick: last ? null : () => go(full) }, part));
      });
      if (parts.length === 0) crumbs.append(h("span", { class: "crumb here" }, r.path));

      const hiddenBox = h("input", { type: "checkbox", checked: showHidden ? true : null });
      hiddenBox.addEventListener("change", () => { showHidden = hiddenBox.checked; go(r.path); });
      const join = (d) => r.path.replace(/[\\/]+$/, "") + sep + d;

      view.replaceChildren(
        crumbs,
        h("div", { class: "dirs", role: "list" },
          r.parent && h("button", { type: "button", class: "dir", onclick: () => go(r.parent) }, h("span", {}, "↑"), h("span", { class: "muted" }, "Up one level")),
          r.dirs.length
            ? r.dirs.map((d) => h("button", { type: "button", class: "dir", title: "Open " + d, onclick: () => go(join(d)) }, "📁", h("span", {}, d), h("span", { class: "chev" }, "›")))
            : h("div", { class: "dir muted", style: "cursor:default" }, "This folder has no sub-folders."),
        ),
        h("div", { class: "tools" },
          r.is_git && h("span", { class: "badge ok" }, "this folder is a git repo"),
          h("button", { type: "button", class: "btn small", onclick: () => go(r.home) }, "⌂ Home folder"),
          h("label", { class: "check", style: "margin:0" }, hiddenBox, "show hidden folders"),
        ),
        h("p", { class: "hint" }, "Click a folder to open it, then press “Choose” at the bottom."),
      );
    };
    go(start);
  }

  $("#add-btn").addEventListener("click", openAdd);

  // ---------- start ----------
  (async () => {
    try {
      S.info = await api("GET", "/info");
      $("#version").textContent = S.info.version ? "v" + S.info.version : "";
      if (!S.info.can_add) $("#add-btn").classList.add("hidden");
    } catch (e) {
      setConn(false);
      if (/token/i.test(e.message)) toast("This page needs the access token: open the link ferry printed.", true);
    }
    await refresh();
    connectEvents();
    setInterval(refresh, 3000);
  })();
})();
</script>
</body>
</html>
