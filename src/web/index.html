  /**
   * Side by side as a split screen: before on the left, after on the right,
   * row-aligned so they scroll together. The divider drags (or ←/→ when
   * focused; Enter evens it out); its handle closes one side, previewing
   * which on hover; double-clicking it keeps the left panel. Returns the
   * element and the first row of each change, for J/K.
   */
  function splitView(d) {
    const box = h("div", { class: "sx" });
    const inner = h("div", { class: "sx-inner" });
    const starts = [];
    let oldNo = 1, newNo = 1, ctxSince = 99, del = [], add = [];
    const cell = (side, no, text, kind, parts) => h("div", { class: "sx-c sx-" + side + (kind ? " " + kind : "") },
      h("span", { class: "sx-no" }, no ?? ""), h("span", { class: "sx-t" }, parts || text || " "));
    const flush = () => {
      if (!del.length && !add.length) return;
      const n = Math.max(del.length, add.length);
      for (let i = 0; i < n; i++) {
        const a = del[i], b = add[i];
        const w = a && b ? wordDiff(a.text, b.text) : null;
        // edited pairs highlight the exact words on each side
        const left = a ? cell("l", a.no, a.text, "del", w ? [...sideText(w, "-").childNodes] : null) : cell("l", null, "", "gap");
        const right = b ? cell("r", b.no, b.text, "add", w ? [...sideText(w, "+").childNodes] : null) : cell("r", null, "", "gap");
        const row = h("div", { class: "sx-row" }, left, right);
        // a new change starts after any unchanged line or a new hunk, the same way parseDiff counts them (so J/K and the map agree)
        if (i === 0 && ctxSince >= 1) starts.push(row);
        inner.append(row);
      }
      del = []; add = []; ctxSince = 0;
    };
    for (const l of d.lines) {
      if (l.op === "@") {
        const m = /^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l.text);
        if (!m) continue;
        flush();
        oldNo = +m[1]; newNo = +m[2]; ctxSince = 99;
        inner.append(h("div", { class: "sx-hunk" }, h("span", {}, `line ${newNo}`), l.text.replace(/^@@[^@]*@@\s?/, "")));
      } else if (l.op === " ") {
        flush();
        inner.append(h("div", { class: "sx-row" }, cell("l", oldNo, l.text, ""), cell("r", newNo, l.text, "")));
        oldNo++; newNo++; ctxSince++;
      } else if (l.op === "-") { del.push({ no: oldNo++, text: l.text }); }
      else { add.push({ no: newNo++, text: l.text }); }
    }
    flush();

    // the divider, its handle, and the tabs that bring a closed side back
    let split = Math.min(80, Math.max(20, +(localStorage.getItem("ferry-split") || 50)));
    const setSplit = (v, save = true) => {
      split = Math.min(80, Math.max(20, Math.round(v)));
      box.style.setProperty("--split", split + "%");
      divider.setAttribute("aria-valuenow", String(split));
      if (save) localStorage.setItem("ferry-split", String(split));
    };
    const keep = (side) => { // side: "l", "r" or "" for both
      box.classList.toggle("keep-l", side === "l");
      box.classList.toggle("keep-r", side === "r");
      box.classList.remove("pv-l", "pv-r");
      if (!side) divider.focus();
    };
    const half = (side, ic, label) => {
      const b = h("button", { type: "button", class: "sx-half", "aria-label": label, title: label, onclick: (e) => { e.stopPropagation(); keep(side === "l" ? "r" : "l"); } }, h("span", { class: "sx-arrow " + ic }));
      b.onmouseenter = b.onfocus = () => box.classList.add("pv-" + side);
      b.onmouseleave = b.onblur = () => box.classList.remove("pv-" + side);
      return b;
    };
    const handle = h("div", { class: "sx-handle" }, half("l", "to-l", "Close the before panel"), h("span", { class: "sx-grip", "aria-hidden": "true" }), half("r", "to-r", "Close the after panel"));
    const divider = h("div", { class: "sx-div", role: "separator", tabindex: "0", "aria-orientation": "vertical", "aria-label": "Resize: drag, or use the arrow keys. Double-click to keep the before panel.", "aria-valuemin": "20", "aria-valuemax": "80" },
      h("div", { class: "sx-handle-track" }, handle));
    divider.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { e.preventDefault(); setSplit(split - 5); }
      else if (e.key === "ArrowRight") { e.preventDefault(); setSplit(split + 5); }
      else if (e.key === "Enter" || e.key === "Home") { e.preventDefault(); setSplit(50); }
    });
    divider.addEventListener("dblclick", () => keep("l"));
    divider.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".sx-half") || e.button !== 0) return;
      e.preventDefault();
      divider.setPointerCapture(e.pointerId);
      box.classList.add("dragging");
      const r = inner.getBoundingClientRect();
      const move = (ev) => setSplit(((ev.clientX - r.left) / r.width) * 100, false);
      const up = () => { box.classList.remove("dragging"); localStorage.setItem("ferry-split", String(split)); divider.removeEventListener("pointermove", move); divider.removeEventListener("pointerup", up); divider.removeEventListener("pointercancel", up); };
      divider.addEventListener("pointermove", move);
      divider.addEventListener("pointerup", up);
      divider.addEventListener("pointercancel", up);
    });
    const reopen = (side, label) => h("button", { type: "button", class: "sx-reopen sx-reopen-" + side, onclick: () => keep("") }, side === "l" ? "◂ " : "", label, side === "r" ? " ▸" : "");
    const head = h("div", { class: "sx-head" },
      h("div", { class: "sx-hl" }, h("b", {}, "Before"), h("small", {}, d.before || "")),
      h("div", { class: "sx-hr" }, h("b", {}, "After"), h("small", {}, d.after || "")));
    inner.prepend(head);
    inner.append(divider);
    box.append(inner, reopen("l", "Show before"), reopen("r", "Show after"));
    setSplit(split, false);
    return { el: box, starts };
  }

  /**
   * The two versions side by side in a window that fills the screen, for a
   * careful compare: the split view (resizable divider), change counts,
   * previous/next change (J/K). Esc closes just this window.
   */
  function openCompare(d, file) {
    const sv = splitView(d);
    const parsed = parseDiff(d.lines);
    const st = story(parsed, file);
    let at = 0;
    const counter = h("span", { class: "muted cmp-count" });
    const scroller = h("div", { class: "cmp-body" }, sv.el);
    const go = (i) => {
      if (!sv.starts.length) return;
      at = Math.max(0, Math.min(sv.starts.length - 1, i));
      sv.starts.forEach((r, k) => r.classList.toggle("on", k === at));
      // keep the sticky header from covering the change
      const top = sv.starts[at].getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - 56;
      scroller.scrollTo({ top, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      counter.textContent = `Change ${at + 1} of ${sv.starts.length}`;
      prevB.disabled = at === 0; nextB.disabled = at === sv.starts.length - 1;
    };
    const prevB = h("button", { class: "btn small", onclick: () => go(at - 1) }, "↑ Previous");
    const nextB = h("button", { class: "btn small primary", onclick: () => go(at + 1) }, "Next change ↓");
    const closeB = h("button", { class: "btn icon ghost", "aria-label": "Close the big window", title: "Close (Esc)" }, icon("shrink"));
    const prevFocus = document.activeElement;
    const wrap = h("div", { class: "cmp-wrap", role: "dialog", "aria-modal": "true", "aria-label": "Compare " + file },
      h("div", { class: "cmp" },
        h("div", { class: "cmp-head" },
          h("div", { class: "cmp-title" }, h("b", {}, file), h("small", {}, (d.before || "before") + "  →  " + (d.after || "after"))),
          h("div", { class: "chips" },
            st.added ? h("span", { class: "pill green" }, `+ ${st.added}`) : "",
            st.edited ? h("span", { class: "pill amber" }, `✎ ${st.edited}`) : "",
            st.removed ? h("span", { class: "pill red" }, `− ${st.removed}`) : ""),
          h("div", { class: "grow" }),
          sv.starts.length ? counter : "", sv.starts.length ? prevB : "", sv.starts.length ? nextB : "", closeB),
        scroller,
        h("div", { class: "cmp-foot muted" }, "Drag the divider to resize · ←/→ when it's focused · double-click it to keep the left side · J/K jump between changes · Esc closes")));
    const close = () => {
      document.removeEventListener("keydown", onKey, true);
      wrap.classList.remove("open");
      setTimeout(() => wrap.remove(), 200);
      prevFocus?.focus?.();
    };
    // capture phase, so Esc and J/K don't also reach the drawer underneath
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); return; }
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      if (e.key === "j") { e.stopPropagation(); go(at + 1); }
      else if (e.key === "k") { e.stopPropagation(); go(at - 1); }
    };
    closeB.onclick = close;
    wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
    document.addEventListener("keydown", onKey, true);
    document.body.append(wrap);
    requestAnimationFrame(() => { wrap.classList.add("open"); closeB.focus(); if (sv.starts.length) { counter.textContent = `Change 1 of ${sv.starts.length}`; prevB.disabled = true; nextB.disabled = sv.starts.length === 1; sv.starts[0].classList.add("on"); } });
  }

  function storyInto(body, foot, d, file, extra, keys) {
    const parsed = parseDiff(d.lines);
    const st = story(parsed, file.split("/").pop());
    let view = localStorage.getItem("ferry-diffview") || "story", at = 0;
    if (!["story", "split", "classic"].includes(view)) view = "story";
    const cards = [], marks = [];
    const counter = h("span", { class: "muted" });
    const prev = h("button", { class: "btn small", onclick: () => go(at - 1) }, "↑ Previous");
    const next = h("button", { class: "btn small primary", onclick: () => go(at + 1) }, "Next change ↓");
    const seg = h("div", { class: "seg", role: "group", "aria-label": "How to show the changes" });
    const content = h("div");

    function go(i, scroll = true) {
      if (!cards.length) return;
      at = Math.max(0, Math.min(cards.length - 1, i));
      cards.forEach((c, k) => c.classList.toggle("on", k === at));
      marks.forEach((m, k) => m.classList.toggle("on", k === at));
      if (scroll) cards[at].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      counter.textContent = `Change ${at + 1} of ${cards.length}`;
      prev.disabled = at === 0;
      next.disabled = at === cards.length - 1;
    }
    const row = (cls, no, op, text) => h("div", { class: "ln " + cls }, h("span", { class: "no" }, no ?? ""), h("span", { class: "op" }, op), h("span", { class: "tx" }, text || " "));
    function card(c, k) {
      const n = Math.max(c.removed.length, c.added.length);
      const title = c.kind === "add" ? `Added ${plural(c.added.length, "line")}` : c.kind === "del" ? `Removed ${plural(c.removed.length, "line")}` : `Edited ${plural(n, "line")}`;
      const parts = c.before.map((b) => row("ctx", b.newNo, "", b.text));
      if (c.kind === "edit") {
        const pairs = Math.min(c.removed.length, c.added.length);
        for (let i = 0; i < pairs; i++) {
          const w = wordDiff(c.removed[i].text, c.added[i].text);
          parts.push(h("div", { class: "edit-pair" }, h("div", { class: "lab" }, `Line ${c.added[i].newNo} · before`), sideText(w, "-"), h("div", { class: "lab" }, "after"), sideText(w, "+")));
        }
        for (const r of c.removed.slice(pairs)) parts.push(row("del", r.oldNo, "−", r.text));
        for (const a of c.added.slice(pairs)) parts.push(row("add", a.newNo, "+", a.text));
      } else {
        for (const r of c.removed) parts.push(row("del", r.oldNo, "−", r.text));
        for (const a of c.added) parts.push(row("add", a.newNo, "+", a.text));
      }
      for (const a of c.after) parts.push(row("ctx", a.newNo, "", a.text));
      return h("div", { class: "change", onclick: () => go(k, false) },
        h("div", { class: "change-head" }, h("span", { class: "ic " + c.kind }, { add: "+", del: "−", edit: "✎" }[c.kind]), h("b", {}, title), h("span", { class: "muted" }, `near line ${c.at}`), h("span", { class: "grow" }), h("span", { class: "muted" }, `${k + 1} / ${parsed.changes.length}`)),
        h("div", { class: "lines" }, parts));
    }
    function renderView() {
      const pick = (v) => () => { view = v; localStorage.setItem("ferry-diffview", v); renderView(); };
      seg.replaceChildren(
        h("button", { class: view === "story" ? "on" : "", onclick: pick("story") }, "Story"),
        h("button", { class: view === "split" ? "on" : "", onclick: pick("split") }, "Side by side"),
        h("button", { class: view === "classic" ? "on" : "", onclick: pick("classic") }, "Classic"));
      cards.length = 0;
      if (view === "split") {
        const sv = splitView(d);
        content.replaceChildren(sv.el);
        cards.push(...sv.starts);
        prev.classList.toggle("hidden", !cards.length); next.classList.toggle("hidden", !cards.length);
        if (cards.length) go(Math.min(at, cards.length - 1), false); else counter.textContent = "";
        return;
      }
      if (view === "classic") {
        content.replaceChildren(h("div", { class: "classic lines" }, d.lines.map((l) => l.op === "@" ? h("div", { class: "hdr" }, l.text) : row(l.op === "+" ? "add" : l.op === "-" ? "del" : "ctx", "", l.op === " " ? "" : l.op === "-" ? "−" : "+", l.text))));
        counter.textContent = "";
        prev.classList.add("hidden"); next.classList.add("hidden");
        return;
      }
      prev.classList.remove("hidden"); next.classList.remove("hidden");
      parsed.changes.forEach((c, k) => cards.push(card(c, k)));
      content.replaceChildren(...cards);
      if (cards.length) go(at, false); else { counter.textContent = ""; prev.classList.add("hidden"); next.classList.add("hidden"); }
    }

    const top = [];
    if (!parsed.changes.length) {
      const msg = parsed.notes[0] || "These two versions are identical.";
      top.push(h("div", { class: "narrator" }, h("img", { src: face(parsed.notes.length ? "thinking" : "happy"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, parsed.notes.length ? "I can't show this one line by line." : "Nothing changed here."), h("div", { class: "hint" }, msg))));
    } else {
      top.push(h("div", { class: "narrator" }, h("img", { src: face("thinking"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, st.title), h("div", { class: "hint" }, st.detail + " Green is new, red is gone, and highlighted words show exactly what was edited."))));
      top.push(h("div", { class: "chips" },
        st.added ? h("span", { class: "pill green" }, `+ ${plural(st.added, "new line")}`) : "",
        st.edited ? h("span", { class: "pill amber" }, `✎ ${plural(st.edited, "edited line")}`) : "",
        st.removed ? h("span", { class: "pill red" }, `− ${plural(st.removed, "removed line")}`) : ""));
      top.push(changeMap(parsed, marks, go));
    }
    top.push(h("div", { class: "sides" }, h("div", { class: "side" }, h("b", {}, "Before"), d.before), h("div", { class: "side" }, h("b", {}, "After"), d.after)));
    const big = parsed.changes.length ? h("button", { class: "btn small", title: "Before and after side by side, filling the screen", onclick: () => openCompare(d, file.split("/").pop()) }, icon("expand"), "Open big") : null;
    top.push(h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: "10px", marginBottom: "10px", flexWrap: "wrap" } },
      h("span", { class: "muted", style: { fontSize: "12.5px" } }, "Tip: press J and K to jump between changes."), h("span", { class: "inline", style: { gap: "8px" } }, big, seg)));
    if (d.more) top.push(h("div", { class: "diff-more" }, `This file is very big, so I'm showing the first ${d.lines.length.toLocaleString()} changed lines. ${d.more.toLocaleString()} more aren't shown.`));
    body.replaceChildren(...top, content);
    const nav = [h("span", { class: "left" }, counter), prev, next];
    if (foot) foot.replaceChildren(...nav, ...(extra || []));
    else body.prepend(h("div", { class: "inline", style: { justifyContent: "flex-end", marginBottom: "10px" } }, ...nav));
    keys.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, select")) return;
      if (e.key === "j") go(at + 1);
      if (e.key === "k") go(at - 1);
    });
    renderView();
  }

          <label class="check"><input type="checkbox" name="ac_ai"><span>Let Claude write the commit messages<small class="hint">Needs ANTHROPIC_API_KEY where ferry runs.</small></span></label>
          <label class="check"><input type="checkbox" name="ac_push"><span>Push after committing</span></label>
        </div>
      </details>`;
    const F = (n) => form.elements.namedItem(n); // form.name / form.target are the form's own attributes
    const formView = h("div", {}, h("div", { class: "narrator" }, h("img", { src: face("excited"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, "Which folders should I look after?"), h("div", { class: "hint" }, S.info.config_file ? "I'll remember this pair in " + S.info.config_file + "." : "This pair lasts until ferry stops."))), form);
    const pickerView = h("div", { class: "hidden" });
    dr.body.append(formView, pickerView);
    const submit = h("button", { class: "btn brand", type: "button" }, "Start syncing");
    const formFoot = [h("button", { class: "btn ghost", type: "button", onclick: dr.close }, "Cancel"), submit];
    dr.foot.append(...formFoot);

    const showError = (w, msg) => {
      const el = $(`[data-error=${w}]`, form);
      el.textContent = msg;
      el.classList.toggle("hidden", !msg);
      F(w).classList.toggle("invalid", !!msg);
    };
    for (const w of ["source", "target"]) F(w).addEventListener("input", () => showError(w, ""));
    F("ac_enabled").addEventListener("change", () => $("[data-ac]", form).classList.toggle("hidden", !F("ac_enabled").checked));
    form.addEventListener("submit", (e) => { e.preventDefault(); submit.click(); });
    form.querySelectorAll("[data-browse]").forEach((b) => b.addEventListener("click", () => {
      const which = b.dataset.browse;
      const typed = F(which).value.trim();
      openPicker(which === "source" ? "Choose your working folder" : "Choose where the files should go", typed && !/^(s3:\/\/|ssh:\/\/|[^/\\]+@)/.test(typed) ? typed : S.info.home, (dir) => { F(which).value = dir; showError(which, ""); });
    }));

    const openPicker = (title, start, pick) => pickFolder(dr, formView, pickerView, () => dr.foot.replaceChildren(...formFoot), title, start, pick);

    submit.onclick = async () => {
      const lines = (s) => s.split("\n").map((x) => x.trim()).filter(Boolean);
      const missing = ["source", "target"].filter((w) => !F(w).value.trim());
      if (missing.includes("source")) showError("source", "Choose the folder you work in.");
      if (missing.includes("target")) showError("target", "Choose where the files should go.");
      if (missing.length) return F(missing[0]).focus();
      const two = F("mode").value === "two-way";
      const body = { name: F("name").value.trim(), source: F("source").value.trim(), target: F("target").value.trim(), mode: F("mode").value, on_delete: F("on_delete").value, ignore: lines(F("ignore").value), secrets: F("secrets").value };
      if (two) {
        body.merge = F("merge").checked;
        if (body.secrets === "redact") return toast("Blanking out secrets only works one way", true);
      } else if (body.on_delete === "restore") return toast("“Put it back” only works when syncing both ways", true);
      const extra = lines(F("targets").value);
      if (extra.length) {
        if (two) return toast("Extra targets only work one way", true);
        body.targets = extra;
      }
      if (F("ac_enabled").checked) body.auto_commit = { enabled: true, interval: F("ac_interval").value, push: F("ac_push").checked, message: F("ac_ai").checked ? "{ai}" : "sync: {summary}" };
      submit.disabled = true;
      const r = await act(null, () => api("POST", "/pairs", body));
      submit.disabled = false;
      if (!r) return;
      toast("Now syncing " + r.added.join(", "), false, "party");
      dr.close();
      S.sel = r.added[0];
      await refresh();
    };
    setTimeout(() => F("source").focus(), 320);
  }

  // =====================================================================
  // ---------- Git client ----------
  // =====================================================================
  const gitURL = (action) => `/git/${S.repoSel}/${action}`;
  const curRepo = () => S.repos.find((r) => r.id === S.repoSel);

  async function loadRepos() {
    try {
      S.repos = await api("GET", "/git/repos");
    } catch {
      S.repos = [];
    }
    if (!S.repos.some((r) => r.id === S.repoSel)) S.repoSel = S.repos[0] ? S.repos[0].id : "";
    if (S.repoSel) {
      try {
        S.repo = await api("GET", gitURL("state"));
      } catch (e) {
        S.repo = null;
        S.repoError = e.message;
      }
    } else S.repo = null;
  }
  const refreshGit = async () => { S.gitBump++; S.gshown = ""; await loadRepos(); render(); };

  /** Runs a Git action, tells the user how it went, and refreshes. */
  async function gitAct(action, body, okText, mood = "happy") {
    try {
      const r = await api("POST", gitURL(action), body || {});
      const text = typeof okText === "function" ? okText(r) : okText;
      if (text) toast(text, false, mood);
      if (r.paused && r.paused.length) toast(`I paused syncing ${r.paused.join(", ")} while you do this. Resume it when you're ready.`, false, "sleepy");
      if (r.conflicts && r.conflicts.length) toast(`${plural(r.conflicts.length, "file")} need your decision: see the top of the page.`, true, "worried");
      await refreshGit();
      return r;
    } catch (e) {
      await refreshGit();
      throw e;
    }
  }
  const tryAct = (...a) => gitAct(...a).catch((e) => { toast(e.message, true); return null; });

  /** Relay's take on a repository's state. */
  function repoMood(st) {
    if (!st) return { face: "sad", say: "I can't read this repository.", hint: S.repoError || "", tone: "red", label: "error" };
    const conflicts = st.files.filter((f) => f.conflicted).length;
    if (st.operation) {
      const what = { merge: `Merging ${st.operationBranch || "a branch"} into ${st.branch}`, rebase: "Rebasing", "cherry-pick": "Cherry-picking a commit", revert: "Reverting a commit" }[st.operation];
      return conflicts
        ? { face: "worried", say: `${what}: ${plural(conflicts, "file")} ${conflicts === 1 ? "needs" : "need"} you.`, hint: "Choose which version to keep for each file below, then press Continue.", tone: "red", label: st.operation + " in progress" }
        : { face: "thinking", say: `${what}: all conflicts are settled.`, hint: "Press Continue to finish, or Abort to go back.", tone: "amber", label: st.operation + " in progress" };
    }
    const staged = st.files.filter((f) => f.staged).length;
    if (st.behind) return { face: "thinking", say: `There ${st.behind === 1 ? "is 1 new commit" : `are ${st.behind} new commits`} on ${st.upstream}.`, hint: "Pull to catch up" + (st.files.length ? `. You also have ${plural(st.files.length, "changed file")}.` : "."), tone: "amber", label: `${st.behind} behind` };
    if (st.files.length) return { face: "focused", say: `${plural(st.files.length, "file")} changed${staged ? `, ${staged} ready to commit` : ""}.`, hint: staged ? "Write a message and commit when you're ready." : "Tick the files (or lines) you want in the next commit.", tone: "blue", label: plural(st.files.length, "change") };
    if (st.ahead) return { face: "wink", say: `${plural(st.ahead, "commit")} ready to push.`, hint: `Push to share them on ${st.upstream}.`, tone: "blue", label: `${st.ahead} to push` };
    if (!st.head) return { face: "excited", say: "A brand-new repository!", hint: "Add some files, then make your first commit.", tone: "green", label: "empty" };
    return { face: "happy", say: "Everything's committed.", hint: st.upstream ? `In step with ${st.upstream}.` : "This branch isn't on a remote yet: push to publish it.", tone: "green", label: "clean" };
  }

  function renderRepos() {
    const box = $("#pairs");
    $("#pair-count").textContent = S.repos.length;
    box.replaceChildren();
    for (const r of S.repos) {
      const sel = r.id === S.repoSel;
      const st = sel ? S.repo : null;
      const sub = st ? `⎇ ${st.branch || "detached"} · ${st.files.length ? plural(st.files.length, "change") : "clean"}` : short(r.path);
      box.append(h("button", { class: "pair" + (sel ? " sel" : ""), title: r.path, onclick: () => { S.repoSel = r.id; localStorage.setItem("ferry-repo", r.id); S.gui = null; refreshGit(); } },
        h("img", { src: face(st ? repoMood(st).face : "happy"), alt: "" }),
        h("div", {}, h("div", { class: "name" }, r.name), h("div", { class: "sub" }, sub), r.pairs.length ? h("div", { class: "rp-sub" }, "synced by " + r.pairs.join(", ")) : null)));
    }
    if (!S.repos.length) box.append(h("div", { class: "pair-empty" }, "No repositories yet. Clone one, create one, or open a folder you already have."));
  }

  function renderRepo() {
    const main = $("#main");
    const r = curRepo();
    if (!r) {
      S.gui = null;
      main.replaceChildren(h("div", { class: "card empty" },
        h("img", { src: face("excited"), alt: "Relay", class: "float" }),
        h("h2", {}, "Let's open a repository."),
        h("p", {}, "I can clone one from GitHub or GitLab, create a new one, or open a folder that's already a git repository. Repositories your folder pairs sync into show up here by themselves."),
        h("p", {}, "Click “Add repository” on the left.")));
      return;
    }
    if (!S.gui || S.gui.id !== r.id || !main.contains(S.gui.body)) buildRepo(r);
    updateRepo(r, S.repo);
  }

  function buildRepo(r) {
    const ui = { id: r.id };
    ui.crumbs = h("div", { class: "crumbs" });
    ui.h1 = h("h1");
    ui.branch = h("button", { class: "pill blue", style: { border: 0, cursor: "pointer", fontSize: "14px", padding: "6px 14px" }, onclick: () => { S.gitTab = "branches"; S.gshown = ""; render(); } });
    ui.sync = h("span");
    ui.actions = h("div", { class: "gdock-group", role: "group", "aria-label": "Sync with the remote" });
    ui.paths = h("div", { class: "paths" });
    ui.face = h("img", { alt: "Relay", class: "float" });
    ui.say = h("div", { class: "say" });
    ui.hint = h("div", { class: "hint" });
    ui.op = h("div");
    ui.remote = h("div");
    ui.tabs = h("div", { class: "gdock-group", role: "group", "aria-label": "Views" });
    ui.body = h("div", { class: "body" });
    // views and remote actions live in one dock on the right; a highlight glides to the selected view
    ui.glow = h("span", { class: "gdock-glow", "aria-hidden": "true" });
    const dock = makeDock("Repository", [{ head: "Views", el: ui.tabs }, { head: "Remote", el: ui.actions }]);
    ui.dock = dock;
    const content = h("div", { class: "repo-content" }, ui.crumbs, h("div", { class: "title-row" }, ui.h1, ui.branch, ui.sync), ui.paths,
      h("div", { class: "card hero" }, ui.face, h("div", { class: "bubble", role: "status" }, ui.say, ui.hint)), ui.op, ui.remote, ui.body);
    $("#main").replaceChildren(h("div", { class: "repo-layout" }, content, dock));
    S.gui = ui;
    S.gshown = "";
    setTimeout(() => checkRemote(false), 0); // see what the remote has as soon as the repository opens
  }

  function updateRepo(r, st) {
    const ui = S.gui;
    const m = repoMood(st);
    ui.crumbs.replaceChildren(h("span", {}, "Repositories"), h("span", {}, "›"), h("b", {}, r.name));
    ui.h1.textContent = r.name;
    ui.branch.replaceChildren(icon("branch"), st ? (st.branch || `detached at ${st.head}`) : "…");
    ui.sync.replaceChildren(
      st && st.ahead ? h("span", { class: "pill blue", title: "commits to push" }, `↑ ${st.ahead}`) : "",
      " ", st && st.behind ? h("span", { class: "pill amber", title: "commits to pull" }, `↓ ${st.behind}`) : "");
    if (ui.face.getAttribute("src") !== face(m.face)) ui.face.src = face(m.face);
    ui.say.textContent = m.say;
    ui.hint.textContent = m.hint;
    ui.paths.replaceChildren(h("code", {}, short(r.path)),
      ...r.pairs.map((n) => h("span", { class: "pill violet", title: "a folder pair syncs into this repository" }, "synced by " + n)),
      st && st.upstream ? h("span", {}, "tracking " + st.upstream) : "",
      r.standalone ? h("button", { class: "btn small ghost", onclick: () => removeRepo(r) }, "Remove from list") : "");
    // fetch / pull / push: which one is running, or just finished, lives in S so the 3-second refresh keeps the animation going
    const run = (which, f) => async () => {
      if (S.remoteBusy) return;
      S.remoteBusy = which;
      render();
      let ok = false;
      try { ok = (await f()) !== false; } finally {
        S.remoteBusy = "";
        if (ok) { S.remoteDone = { which, until: Date.now() + 1600 }; setTimeout(render, 1700); }
        render();
      }
    };
    const stateOf = (which) => S.remoteBusy === which ? " working" : S.remoteDone && S.remoteDone.which === which && S.remoteDone.until > Date.now() ? " done" : "";
    // remote buttons are all disabled while one of them runs
    const dockBtn = (ic, label, o = {}) => dockButton(ic, label, { ...o, disabled: !!S.remoteBusy });
    const rc = S.remote[S.repoSel];
    const checked = rc ? (rc.error ? "couldn't reach the remote" : "checked " + ftWhen(rc.checkedAt)) : "";
    const fetchBtn = dockBtn("cloud", S.remoteBusy === "fetch" ? "Fetching…" : "Fetch", { extra: " k-fetch" + stateOf("fetch"), tip: S.remoteBusy === "fetch" ? "Fetching…" : "Fetch" + (checked ? " · " + checked : "") });
    fetchBtn.onclick = run("fetch", async () => { const r = await tryAct("fetch", {}, "Fetched the latest from the remote", "happy"); await checkRemote(false); return !!r; });
    const behind = st ? st.behind : 0, ahead = st ? st.ahead : 0;
    const pullLabel = S.remoteBusy === "pull" ? "Pulling…" : behind ? `Pull ${behind} commit${behind > 1 ? "s" : ""}` : "Pull";
    const pullBtn = dockBtn("down", pullLabel, { count: behind, hot: !!behind, extra: " k-pull" + (behind && !S.remoteBusy ? " incoming" : "") + stateOf("pull") });
    pullBtn.onclick = run("pull", () => doPull());
    const pushLabel = S.remoteBusy === "push" ? "Pushing…" : st && !st.upstream ? "Publish branch" : ahead ? `Push ${ahead} commit${ahead > 1 ? "s" : ""}` : "Push";
    const pushBtn = dockBtn("up", pushLabel, { count: ahead, hot: !!(st && (ahead || !st.upstream)), extra: " k-push" + (st && (ahead || !st.upstream) && !S.remoteBusy ? (behind ? " outgoing blocked" : " outgoing") : "") + stateOf("push"),
      tip: ahead && behind && !S.remoteBusy ? pushLabel + " · pull first" : undefined });
    pushBtn.onclick = run("push", () => doPush(false));
    ui.actions.replaceChildren(fetchBtn, pullBtn, pushBtn);
    renderOperation(st);
    renderRemote(st);

    const n = st ? st.files.filter((f) => !f.conflicted).length : 0;
    const tabs = [["files", "Files", "folder", 0], ["changes", "Changes", "files", n], ["history", "History", "clock", 0], ["insights", "Insights", "chart", 0], ["branches", "Branches", "branch", 0], ["stashes", "Stashes", "box", st ? st.stashes : 0],
      ["prs", "Pull requests", "pr", 0], ["issues", "Jira", "ticket", 0], ["tags", "Tags", "tag", 0], ["worktrees", "Worktrees", "tree", 0], ["undo", "Undo anything", "undo", 0]]
      .filter(([id]) => id !== "issues" || (S.conns && S.conns.jira.connected));
    if (!tabs.some(([id]) => id === S.gitTab)) S.gitTab = "changes";
    fillDockTabs(ui.tabs, ui.glow, tabs, S.gitTab, (id) => { S.gitTab = id; S.gshown = ""; render(); });
    renderGitBody(st);
  }

  // ---------- the remote: watch it, explain what arrived, and pull / push safely ----------
  const whoPushed = (commits) => {
    const names = [...new Set(commits.map((c) => c.author).filter(Boolean))];
    return names.length === 0 ? "Someone" : names.length === 1 ? names[0] : names.length === 2 ? names.join(" and ") : `${names[0]}, ${names[1]} and ${names.length - 2} more`;
  };
  const fileList = (files, max = 3) => {
    const base = files.slice(0, max).map((p) => p.split("/").pop());
    return base.join(", ") + (files.length > max ? ` and ${files.length - max} more` : "");
  };

  /**
   * Asks the server what the remote has (it fetches at most once a minute
   * unless force). Announces commits that arrived since the last look.
   */
  async function checkRemote(force, quiet = false) {
    const id = S.repoSel;
    if (!id) return null;
    let r;
    try {
      r = await api("GET", gitURL("remote-check") + (force ? "?force=1" : ""));
    } catch {
      return null;
    }
    const prev = S.remote[id];
    S.remote[id] = r;
    if (!quiet && prev && r.behind > prev.behind && S.repoSel === id) {
      const fresh = r.incoming.slice(0, r.behind - prev.behind);
      toast(`${whoPushed(fresh)} pushed ${plural(r.behind - prev.behind, "commit")} to ${r.upstream}. Pull to stay in step.`, false, "surprised");
    }
    if (S.repoSel === id) {
      if (S.repo && (S.repo.behind !== r.behind || S.repo.ahead !== r.ahead)) { S.repo.behind = r.behind; S.repo.ahead = r.ahead; }
      if (S.gui && document.contains(S.gui.body)) render();
    }
    return r;
  }
  // keep an eye on the remote while a repository is on screen
  setInterval(() => { if (!document.hidden && S.gui && S.gui.dock && document.contains(S.gui.dock) && !S.remoteBusy) checkRemote(false); }, 90_000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.gui && S.gui.dock && document.contains(S.gui.dock)) checkRemote(false); });

  /** The "new on the remote" card above the views: who pushed what, and whether it touches your work. */
  function renderRemote(st) {
    const ui = S.gui;
    const rc = S.remote[S.repoSel];
    if (!st || !st.behind || st.operation || !rc || !rc.incoming.length) { ui.remote.replaceChildren(); ui.remoteKey = ""; return; }
    const key = JSON.stringify([rc.incoming.map((c) => c.hash), rc.overlap, st.ahead, st.files.length, S.remoteBusy]);
    if (ui.remoteKey === key) return;
    ui.remoteKey = key;
    const dirty = rc.overlap.filter((p) => st.files.some((f) => f.path === p));
    const latest = rc.incoming[0];
    const both = st.ahead > 0;
    const advice = rc.overlap.length
      ? h("div", { class: "rc-warn" }, icon("info"), h("span", {}, h("b", {}, "Heads-up: "), `${fileList(rc.overlap)} changed on both sides. `,
        dirty.length ? "Pulling now keeps your uncommitted edits safe (I set them aside and put them back). " : "",
        "If the same lines changed, you'll pick what to keep."))
      : h("div", { class: "rc-ok" }, icon("check"), h("span", {}, "None of these touch the files you're working on, so pulling should be smooth."));
    const busyNow = !!S.remoteBusy;
    ui.remote.replaceChildren(h("div", { class: "card rc" },
      h("div", { class: "rc-head" },
        h("span", { class: "rc-icon", "aria-hidden": "true" }, icon("down")),
        h("div", { class: "rc-title" },
          h("b", {}, `${plural(st.behind, "new commit")} on ${rc.upstream}`),
          h("small", {}, `from ${whoPushed(rc.incoming)} · latest ${ftWhen(latest.date)}` + (both ? ` · you have ${plural(st.ahead, "commit")} to push` : ""))),
        h("div", { class: "rc-actions" },
          h("button", { class: "btn small" + (both ? "" : " brand"), disabled: busyNow ? true : null, onclick: () => { S.gui.actions.querySelector(".k-pull").click(); } }, icon("down"), both ? "Pull (rebase)" : "Pull now"),
          both ? h("button", { class: "btn small brand", disabled: busyNow ? true : null, onclick: () => { S.gui.actions.querySelector(".k-push").click(); } }, icon("up"), "Pull & push") : null)),
      h("div", { class: "rc-list" }, rc.incoming.slice(0, 3).map((c) => h("button", { type: "button", class: "rc-commit", onclick: () => showCommit(c.hash) },
        h("span", { class: "fb-avatar", "aria-hidden": "true" }, (c.author || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()),
        h("span", { class: "rc-subj" }, c.subject),
        h("span", { class: "rc-files" }, plural(c.files.length, "file")),
        h("span", { class: "mono faint" }, c.short),
        h("span", { class: "muted rc-when" }, ftWhen(c.date)))),
        rc.incoming.length > 3 ? h("button", { type: "button", class: "rc-more", onclick: () => { S.gitTab = "history"; S.gshown = ""; render(); } }, `+ ${rc.incoming.length - 3} more in History`) : null),
      advice));
  }

  /**
   * Pull, safely: warns first when incoming commits touch files you're
   * editing (the server sets those edits aside and puts them back). Returns
   * true when the branch caught up.
   */
  async function doPull(strategy, { quiet = false } = {}) {
    const st = S.repo, rc = S.remote[S.repoSel];
    if (!strategy && !quiet && st && rc) {
      const dirty = rc.overlap.filter((p) => st.files.some((f) => f.path === p));
      if (dirty.length) {
        const ok = await relayAsk({ mood: "thinking", title: "Incoming changes touch files you're editing",
          text: `${fileList(dirty)} ${dirty.length === 1 ? "was" : "were"} also changed on ${rc.upstream}. I'll set your uncommitted edits aside, pull, then put them back. If both sides changed the same lines, you'll pick what to keep.`,
          yes: "Pull safely", no: "Not now", yesMood: "wink" });
        if (!ok) return false;
      }
    }
    try {
      await gitAct("pull", { strategy: strategy || "" }, quiet ? "" : "Pulled the latest commits", "party");
      return await afterRemoteAction();
    } catch (e) {
      if (e.code === "diverged") {
        const choice = await relayAsk({ mood: "thinking", title: "Both sides have new commits.", text: "Your branch and the remote have each moved on. Rebase replays your commits on top of the remote's, for a straight line (usually what you want). Merge keeps both histories as they are.", yes: "Rebase my commits", no: "Merge them", yesMood: "wink", noMood: "happy" });
        const r = await tryAct("pull", { strategy: choice ? "rebase" : "merge" }, quiet ? "" : "Caught up with the remote", "party");
        return r ? await afterRemoteAction() : false;
      }
      if (e.code !== "conflicts") toast(e.message, true);
      return false;
    }
  }

  /** After a pull: false while a merge or rebase still needs the user. */
  async function afterRemoteAction() {
    const now = await api("GET", gitURL("state")).catch(() => null);
    await checkRemote(false, true);
    if (now && (now.operation || now.files.some((f) => f.conflicted))) {
      toast(now.operation ? "Some files need your decision before you carry on: see the top of the page."
        : "Pulled. Some of your edits overlap what came in: pick what to keep at the top of the page.", true, "worried");
      return false;
    }
    return true;
  }

  /**
   * Push, safely: looks at the remote first. If someone pushed in the
   * meantime, offers to bring their commits in (rebasing yours on top) and
   * then push, instead of letting the push bounce.
   */
  /**
   * Before anything leaves the machine: secrets, .env files, conflict
   * markers, huge files and leftover debugging in the commits to push.
   * Blocking problems need a press-and-hold to push anyway.
   */
  async function pushPreflight() {
    let r;
    try { r = await api("GET", gitURL("push-check")); } catch { return true; } // a failed check shouldn't stop a push
    if (!r.issues.length) return true;
    const KIND = { secret: "Possible secret", "env-file": "Secret file", "conflict-marker": "Conflict marker", "large-file": "Large file", debug: "Leftover debugging" };
    const blocks = r.issues.filter((i) => i.level === "block");
    const shown = r.issues.slice(0, 6);
    const list = h("div", { class: "pp-list" }, shown.map((i) => h("div", { class: "pp-row " + i.level },
      h("span", { class: "pp-kind" }, KIND[i.kind] || i.kind),
      h("span", { class: "pp-where mono" }, h("bdi", {}, i.file + (i.line ? ":" + i.line : ""))),
      h("span", { class: "pp-what" }, i.text))),
      r.issues.length > shown.length ? h("div", { class: "pp-more" }, `and ${r.issues.length - shown.length} more`) : null);
    const text = h("div", {},
      h("p", { style: { margin: "0 0 10px" } }, blocks.length
        ? `Once these are pushed, everyone with access has them, and they stay in history even if you delete them later. Fix them (or undo the commit), then push.`
        : `Nothing dangerous, just things people usually don't mean to share.`),
      list);
    return relayAsk({ mood: blocks.length ? "worried" : "thinking",
      title: blocks.length ? `Hold on: ${plural(blocks.length, "thing")} in this push can't be taken back` : `${plural(r.issues.length, "small thing")} to look at before pushing`,
      text, yes: "Push anyway", no: blocks.length ? "Don't push" : "Fix first", hold: blocks.length > 0, yesMood: "worried" });
  }

  async function doPush(force) {
    const st = S.repo;
    if (!force && st && (st.ahead || !st.upstream) && !(await pushPreflight())) return false;
    if (!force && st && st.upstream) {
      const rc = await checkRemote(true, true);
      if (rc && rc.error) toast("I couldn't check the remote (" + rc.error + "). Trying the push anyway.", true, "worried");
      if (rc && rc.behind > 0) {
        const both = rc.ahead > 0;
        const text = `${whoPushed(rc.incoming)} pushed ${plural(rc.behind, "commit")} to ${rc.upstream} since you last pulled, so a push now would bounce. `
          + (both ? `I'll replay your ${plural(rc.ahead, "commit")} on top of theirs (a rebase, your edits stay safe), then push.` : "I'll pull them in first, then push.")
          + (rc.overlap.length ? ` Heads-up: ${fileList(rc.overlap)} changed on both sides, so you may need to pick what to keep.` : " Their changes don't touch your files, so this should be smooth.");
        const ok = await relayAsk({ mood: rc.overlap.length ? "worried" : "thinking", title: "The remote moved on. Pull first?", text, yes: "Pull, then push", no: "Cancel", yesMood: "wink" });
        if (!ok) return false;
        if (!(await doPull(both ? "rebase" : "", { quiet: true }))) return false;
      }
    }
    try {
      await gitAct("push", { force }, (r) => `Pushed ${r.branch}`, "party");
      await checkRemote(false, true);
      return true;
    } catch (e) {
      if (e.code === "rejected" && !force) {
        const s = S.repo;
        const rewrote = s && s.lastCommit && s.lastCommit.pushed === false;
        const ok = await relayAsk({ mood: "worried", title: "The remote has commits you don't have.", text: rewrote ? "Pull first to bring them in. If you rewrote commits on purpose (amend, undo), you can force-push instead, which replaces the remote's version." : "Pull first to bring them in, then push again.", yes: "Pull now", no: "Not now" });
        if (ok) return doPull();
      } else toast(e.message, true);
      return false;
    }
  }

  async function removeRepo(r) {
    const ok = await relayAsk({ mood: "thinking", title: `Remove ${r.name} from the list?`, text: "Only the list entry goes. The repository and its files stay exactly where they are.", yes: "Remove", no: "Keep it" });
    if (!ok) return;
    await act("Removed from the list", () => api("POST", "/git/repos/remove", { id: r.id }), "wink");
    S.repoSel = "";
    refreshGit();
  }

  /** The "merge in progress" card: conflicted files with one-click choices, plus Continue and Abort. */
  function renderOperation(st) {
    const ui = S.gui;

        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "ours" }, `${f.path}: kept your version`) }, "Keep mine"), " ",
        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "theirs" }, `${f.path}: kept theirs`) }, "Keep theirs"), " ",
        h("button", { class: "btn small", title: "Keep every line from both sides", onclick: () => tryAct("resolve", { path: f.path, choice: "both" }, `${f.path}: kept both`) }, "Keep both"), " ",

    const cont = h("button", { class: "btn brand", disabled: conflicts.length ? true : null, onclick: () => tryAct("finish", { action: "continue" }, "Done! Finished the " + st.operation, "party") }, "Continue");

      const ok = await relayAsk({ mood: "worried", title: `Abort the ${st.operation}?`, text: "I'll put everything back the way it was before it started.", yes: "Abort", no: "Keep going", yesMood: "sad" });
      if (ok) tryAct("finish", { action: "abort" }, `Aborted the ${st.operation}`, "sleepy");
    } }, "Abort");
    const title = { merge: `Merging ${st.operationBranch || "a branch"}`, rebase: "Rebase in progress", "cherry-pick": "Cherry-pick in progress", revert: "Revert in progress" }[st.operation];

  /**
   * After a pull, your set-aside edits went back on top of the new commits
   * and some lines clashed. No merge is running: each file just needs a
   * choice. Here git's "ours" is what came in and "theirs" is your edits.
   */
  function renderClash(st) {
    const ui = S.gui;
    const files = st.files.filter((f) => f.conflicted);
    const key = "clash|" + files.map((f) => f.path).join("|");
    if (ui.opKey === key) return;
    ui.opKey = key;
    const rows = files.map((f) => h("tr", {},
      h("td", { class: "file" }, f.path, h("small", {}, "your edit and the pulled change touch the same lines")),
      h("td", { class: "end" },
        h("button", { class: "btn small brand", onclick: () => showConflict(f.path) }, icon("eye"), "See both"), " ",
        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "theirs" }, `${f.path}: kept your edits`) }, "Keep my edits"), " ",
        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "ours" }, `${f.path}: took the pulled version`) }, "Take theirs"), " ",
        h("button", { class: "btn small", title: "Keep every line from both sides", onclick: () => tryAct("resolve", { path: f.path, choice: "both" }, `${f.path}: kept both`) }, "Keep both"), " ",
        h("button", { class: "btn small ghost", title: "I fixed it in my editor", onclick: () => tryAct("resolve", { path: f.path, choice: "done" }, `${f.path}: marked as fixed`) }, "I fixed it"))));

      h("p", { class: "hint", style: { margin: "0 16px 8px" } }, "The pull worked. Putting your uncommitted edits back clashed in these files. Nothing is lost: a copy of your edits is also kept in Stashes (“autostash”) until you remove it."),
      h("table", { class: "table" }, h("tbody", {}, rows))));
  }

  async function showConflict(file) {
    const dr = drawer({ title: file.split("/").pop(), sub: "Changed on both branches", wide: true });
    dr.body.append(relayLoading("Comparing your version with theirs", { mood: "comparing", card: false }));
    try {
      const d = await api("GET", gitURL("conflict") + "?path=" + enc(file));
      const pick = (choice, text) => { tryAct("resolve", { path: file, choice }, `${file}: ${text}`); dr.close(); };
      // edits put back after a pull (no merge running): "theirs" is your edits, "ours" what came in
      const clash = S.repo && !S.repo.operation;
      storyInto(dr.body, dr.foot, d, file.split("/").pop(), [
        clash ? h("button", { class: "btn small", onclick: () => pick("theirs", "kept your edits") }, "Keep my edits")
          : h("button", { class: "btn small", onclick: () => pick("ours", "kept your version") }, "Keep mine"),
        clash ? h("button", { class: "btn small", onclick: () => pick("ours", "took the pulled version") }, "Take theirs")
          : h("button", { class: "btn small", onclick: () => pick("theirs", "kept theirs") }, "Keep theirs"),
        h("button", { class: "btn small brand", onclick: () => pick("both", "kept both") }, "Keep both")], dr.panel);
    } catch (e) {
      dr.body.replaceChildren(h("p", { class: "muted" }, e.message));

  }

  function renderGitBody(st) {
    const ui = S.gui;
    const key = [S.repoSel, S.gitTab, S.gitBump, S.gitTab === "changes" ? JSON.stringify(st && st.files) + (st && st.lastCommit && st.lastCommit.hash) : ""].join("|");
    const typing = ui.body.contains(document.activeElement) && document.activeElement.tagName === "INPUT" && document.activeElement.type === "text";
    if (S.gshown === key || (typing && S.gshown.startsWith(S.repoSel + "|" + S.gitTab))) return;
    S.gshown = key;
    if (!st) { ui.body.replaceChildren(S.repoError ? h("div", { class: "card empty-row" }, S.repoError) : relayLoading("Opening the repository", { sub: "Looking at branches and changes." })); return; }
    ({ files: gitFiles, changes: gitChanges, history: gitHistory, insights: gitInsights, branches: gitBranches, stashes: gitStashes, prs: gitPRs, issues: gitIssues, tags: gitTags, worktrees: gitWorktrees, undo: gitUndo })[S.gitTab](ui.body, st);
  }

  const STATUS = (f) => f.conflicted ? ["Conflict", "red"] : f.untracked ? ["New", "solid-green"] : (f.x === "A" ? ["New", "solid-green"] : f.x === "R" ? ["Renamed", "solid-violet"] : (f.x === "D" || f.y === "D") ? ["Deleted", "solid-red"] : ["Modified", "solid-blue"]);

  // ---------- changes ----------
  function gitChanges(body, st) {
    const files = st.files.filter((f) => !f.conflicted);
    const rows = files.map((f) => {
      const cb = h("input", { type: "checkbox", "aria-label": "Include " + f.path + " in the next commit" });
      cb.checked = f.staged;
      cb.indeterminate = f.staged && f.unstaged && !f.untracked;
      cb.onchange = () => tryAct(cb.checked ? "stage" : "unstage", { files: [f.path] });
      const [word, cls] = STATUS(f);
      const folder = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/") + 1) : "top folder";
      return h("tr", {},
        h("td", { class: "cbcell" }, cb),
        h("td", { class: "file" }, f.path.split("/").pop(), h("small", {}, f.from ? `renamed from ${f.from}` : folder)),
        h("td", {}, h("span", { class: "pill " + cls }, word), cb.indeterminate ? h("span", { class: "pill amber refpill" }, "partly staged") : ""),
        h("td", { class: "end" },
          h("button", { class: "btn small", onclick: () => reviewFile(f) }, icon("eye"), "Review & pick lines"), " ",
          h("button", { class: "btn small ghost danger", onclick: () => discardFiles([f.path], f.path) }, "Discard")));
    });
    const staged = files.filter((f) => f.staged).length;
    const headBtns = files.length ? h("span", { class: "inline" },
      h("button", { class: "btn small", onclick: () => tryAct("stage", { files: [] }, "Everything is ready to commit") }, "Select all"),
      h("button", { class: "btn small ghost", onclick: () => tryAct("unstage", { files: [] }) }, "Clear"),
      h("button", { class: "btn small ghost", onclick: async () => {
        const v = await relayAsk({ mood: "thinking", title: "Put these changes aside?", text: "I'll stash them (tuck them away safely) so you get a clean folder. Bring them back any time from the Stashes tab.", yes: "Stash them", no: "Cancel", yesMood: "wink", fields: [{ name: "message", label: "A note to remember them by (optional)", placeholder: "e.g. half-done login page" }] });
        if (v) tryAct("stash", { message: v.message }, "Tucked away in Stashes", "wink");
      } }, "Stash all"),
      h("button", { class: "btn small ghost danger", onclick: () => discardFiles([], "every change") }, "Discard all")) : null;

    const msg = h("input", { type: "text", placeholder: "What did you change? (e.g. Fix the login button)" });
    const coAuth = h("input", { type: "text", placeholder: "Co-authors (optional): Name <email>, Name <email>" });
    const amend = h("input", { type: "checkbox" });
    const aiBtn = h("button", { class: "btn small", title: "Claude reads the staged changes and writes a message", onclick: async () => {
      aiBtn.disabled = true;
      aiBtn.textContent = "Writing…";
      try {
        const r = await api("GET", gitURL("ai-message"));
        msg.value = r.message;
      } catch (e) { toast(e.message, true); }
      aiBtn.disabled = false;
      aiBtn.textContent = "✨ Write it for me";
    } }, "✨ Write it for me");
    amend.onchange = () => {
      if (amend.checked && !msg.value && st.lastCommit) msg.value = st.lastCommit.subject;
    };
    const commitBtn = h("button", { class: "btn primary", disabled: !staged && !st.head ? true : null }, icon("commit"), staged ? `Commit ${plural(staged, "file")} to ${st.branch || "HEAD"}` : "Commit");
    const issueKey = (st.branch.match(/^([A-Z][A-Z0-9_]+-\d+)/) || [])[1];
    if (issueKey && S.conns && S.conns.jira.connected) msg.placeholder = `${issueKey}: what did you change?`;
    commitBtn.onclick = async () => {
      if (issueKey && localStorage.getItem("ferry-jira-prefix") !== "off" && msg.value.trim() && !msg.value.includes(issueKey)) msg.value = `${issueKey}: ${msg.value.trim()}`;
      const coAuthors = coAuth.value.split(/,(?=[^>]*(?:<|$))/).map((x) => x.trim()).filter(Boolean);
      const r = await tryAct("commit", { message: msg.value, amend: amend.checked, co_authors: coAuthors }, (r) => amend.checked ? `Updated the last commit (${r.commit})` : `Committed ${r.commit}`, "party");
      if (r) { msg.value = ""; coAuth.value = ""; }
    };
    const last = st.lastCommit;
    const undoBtn = last ? h("button", { class: "btn small ghost", onclick: async () => {
      const ok = await relayAsk({ mood: last.pushed ? "worried" : "thinking", title: `Undo “${last.subject}”?`, text: (last.pushed ? "This commit is already on the remote, so after undoing you'd need to force-push. " : "") + "The commit goes away but its changes stay, ready to commit again.", yes: "Undo it", no: "Keep it", yesMood: "wink" });
      if (ok) tryAct("undo", {}, (r) => `Undid “${r.subject}”; the changes are still here`, "wink");
    } }, "↶ Undo last commit") : null;
    const form = h("div", { style: { padding: "4px 16px 14px" } },
      h("div", { class: "field" }, h("div", { class: "inline", style: { justifyContent: "space-between", marginBottom: "6px" } }, h("span", { class: "label", style: { margin: 0 } }, "Message"), aiBtn), msg),
      h("label", { class: "field" }, coAuth),
      last ? h("label", { class: "check" }, amend, h("span", {}, `Add to the last commit instead (“${last.subject}”)`, last.pushed ? h("small", { class: "hint" }, "It's already pushed: you'd need to force-push afterwards.") : null)) : null,
      h("div", { class: "inline", style: { justifyContent: "space-between" } }, commitBtn, undoBtn));
    // a repository a pair syncs into: Ferry recorded the work, so it can be shaped into commits
    const shapeSlot = h("div");
    if (st.pairs && st.pairs.length && files.length) shapeCallout(shapeSlot, st);
    else if (files.length && localStorage.getItem("ferry-tip-shape") !== "off") {
      // opened directly: nothing recorded the work, so say where shaping is available
      shapeSlot.append(h("div", { class: "shape-tip" }, icon("info"),
        h("span", {}, "Shape my history, which turns your work into a few clean commits, works on repositories a folder pair syncs into: Ferry records each sync there."),
        h("button", { class: "btn small ghost", "aria-label": "Hide this tip", onclick: () => { localStorage.setItem("ferry-tip-shape", "off"); shapeSlot.replaceChildren(); } }, "Got it")));
    }
    body.replaceChildren(shapeSlot,
      section("g-changes", "Changes", files.length, "blue", rows.length ? h("table", { class: "table" }, h("tbody", {}, rows)) : h("div", { class: "empty-row" }, "No changes. Edit some files and they show up here."), headBtns),
      section("g-commit", "Commit", null, "", form));
  }

  // ---------- shape my history ----------

  const span = (a, b) => { const m = Math.round((Date.parse(b) - Date.parse(a)) / 60000); return m < 1 ? "a moment" : m < 60 ? plural(m, "minute") : `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + " min" : ""}`.trim(); };
  const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const dayAndClock = (iso) => { const d = new Date(iso), today = new Date(); return (d.toDateString() === today.toDateString() ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + ", ") + hhmm(iso); };

  async function shapeCallout(slot, st) {
    const t = await api("GET", gitURL("shape")).catch(() => null);
    if (!t || !t.batches.length || S.gitTab !== "changes") return;
    const first = t.batches[0].time, last = t.batches[t.batches.length - 1].time;
    slot.replaceChildren(h("div", { class: "card shape-callout" },
      h("img", { class: "float", src: face("excited"), alt: "" }),
      h("div", { class: "grow" }, h("b", {}, `I recorded ${plural(t.batches.length, "sync")} since your last commit, over ${span(first, last)}.`),
        h("small", {}, "Instead of one big commit, I can split the work where you paused and make a commit for each part.")),
      h("button", { class: "btn brand", onclick: () => openShape(st) }, icon("commit"), "Shape my history")));
  }

  /** A short message for a group, from what it changed (you'll usually want to edit it). */
  function suggestMessage(files, st) {
    const name = (p) => p.split("/").pop();
    const verbs = { add: "Add", update: "Update", delete: "Remove" };
    const byOp = {};
    for (const f of files) (byOp[f.op] ||= []).push(name(f.path));
    const list = (xs) => xs.length <= 2 ? xs.join(" and ") : `${xs.slice(0, 2).join(", ")} and ${xs.length - 2} more`;
    // "Add about.html, update index.html": each kind of change in turn, the first one capitalised
    const parts = ["add", "update", "delete"].filter((op) => byOp[op]).map((op) => `${verbs[op].toLowerCase()} ${list(byOp[op])}`);
    let msg = parts.length ? parts.join(", ") : "Update files";
    msg = msg[0].toUpperCase() + msg.slice(1);
    const key = st && (st.branch.match(/^([A-Z][A-Z0-9_]+-\d+)/) || [])[1];
    if (key && localStorage.getItem("ferry-jira-prefix") !== "off") msg = `${key}: ${msg}`;
    return msg;
  }

  async function openShape(st) {
    const dr = drawer({ title: "Shape my history", sub: `${st.name} · on ${st.branch}`, wide: true });
    dr.body.append(relayLoading("Replaying your work", { mood: "thinking", card: false, sub: "Putting the syncs since your last commit in order." }));
    let t;
    try { t = await api("GET", gitURL("shape")); } catch (e) { dr.body.replaceChildren(h("p", { class: "muted" }, e.message)); return; }
    if (!t.batches.length) { dr.body.replaceChildren(h("div", { class: "empty" }, h("img", { class: "float", src: face("happy"), alt: "" }), h("h2", {}, "Nothing to shape."), h("p", {}, "I haven't synced anything into this repository since its last commit."))); return; }

    const B = t.batches;
    const GAPS = [[5, "5 min"], [15, "15 min"], [30, "30 min"], [60, "1 hour"], [0, "Never (one commit)"]];
    let gap = Number(localStorage.getItem("ferry-shape-gap") || 15);
    let cuts = new Set(); // batch index where a new commit starts
    const messages = new Map(); // first batch id → message you typed
    const fromGap = () => { cuts = new Set(); if (gap) for (let i = 1; i < B.length; i++) if (Date.parse(B[i].time) - Date.parse(B[i - 1].time) >= gap * 60000) cuts.add(i); };
    fromGap();
    const groups = () => { const out = [[]]; B.forEach((b, i) => { if (cuts.has(i)) out.push([]); out[out.length - 1].push(i); }); return out; };
    // what a group did to each file overall: added then edited is still "added"; added then deleted is nothing
    const filesOf = (idx) => {
      const seen = new Map();
      for (const f of idx.flatMap((i) => B[i].files)) { const x = seen.get(f.path); seen.set(f.path, x ? { first: x.first, last: f.op } : { first: f.op, last: f.op }); }
      return [...seen].flatMap(([path, { first, last }]) => first === "add" && last === "delete" ? [] : [{ path, op: first === "add" ? "add" : last === "delete" ? "delete" : "update" }]);
    };

    const list = h("div", { class: "shape-list" });
    const total = new Set(B.flatMap((b) => b.files.map((f) => f.path))).size;
    const say = h("div", { class: "say" });
    const hint = h("div", { class: "hint" });
    const gapSeg = h("div", { class: "seg", role: "radiogroup", "aria-label": "Start a new commit after a pause of" });
    const paintGap = () => gapSeg.replaceChildren(...GAPS.map(([v, label]) => h("button", { class: gap === v ? "on" : "", role: "radio", "aria-checked": gap === v ? "true" : "false",
      onclick: () => { gap = v; localStorage.setItem("ferry-shape-gap", String(v)); fromGap(); paintGap(); paint(); } }, label)));
    paintGap();
    const go = h("button", { class: "btn brand" }, icon("commit"), "Create commits");

    const paint = () => {
      const gs = groups();
      say.textContent = `${plural(B.length, "sync")} between ${dayAndClock(B[0].time)} and ${hhmm(B[B.length - 1].time)}, touching ${plural(total, "file")}.`;
      hint.textContent = gs.length === 1 ? "That's one commit for now. Pick a shorter pause, or split it yourself with ✂." : `I split them into ${plural(gs.length, "commit")} where you paused for ${gap >= 60 ? "an hour" : gap + " minutes"} or more. Name each one, join or split them, then create them.`;
      go.replaceChildren(icon("commit"), `Create ${plural(gs.length, "commit")} on ${t.branch}`);
      list.replaceChildren(...gs.map((idx, gi) => {
        const files = filesOf(idx);
        const key = B[idx[0]].id;
        const input = h("input", { type: "text", value: messages.get(key) ?? suggestMessage(files, st), "aria-label": `Message for commit ${gi + 1}` });
        input.oninput = () => messages.set(key, input.value);
        const aiBtn = S.settings && S.settings.ai && S.settings.ai.configured ? h("button", { class: "btn small", title: "Claude reads what this step changed and writes a message", onclick: async () => {
          aiBtn.disabled = true; aiBtn.textContent = "Writing…";
          try { const r = await api("POST", gitURL("shape-message"), { batches: idx.map((i) => B[i].id) }); input.value = r.message; messages.set(key, r.message); } catch (e) { toast(e.message, true); }
          aiBtn.disabled = false; aiBtn.textContent = "✨ Write it";

  /**

      const before = lanes.slice(), beforeColour = colour.slice();

        colour[col] = next++ % LANE_COLOURS.length;

      const lines = [];

        if (!hash) return;
        if (hash === c.hash) { lines.push({ from: j, to: col, half: "top", c: beforeColour[j] }); if (j !== col) lanes[j] = null; }

      const [first, ...others] = c.parents;
      lanes[col] = first || null;
      if (first) lines.push({ from: col, to: col, half: "bottom", c: colour[col] });

  function showChecks(p) {

  // ---------- files: a folder-at-a-time browser, with that folder's README below ----------
  const README_RE = /^readme(\.(md|markdown|mdown|mkd|txt|rst))?$/i;
  const FT_KIND = [
    [/\.(ts|tsx|js|jsx|mjs|cjs|py|go|rs|java|kt|cs|cpp|cc|c|h|hpp|rb|php|swift|scala|sh|ps1|bat|cmd|sql|vue|svelte)$/i, "code"],
    [/\.(md|markdown|mdown|mkd|txt|rst|adoc|pdf|docx?)$/i, "doc"],
    [/\.(png|jpe?g|gif|svg|webp|ico|bmp|avif)$/i, "img"],
    [/\.(json|ya?ml|toml|ini|env|xml|lock|config|conf|editorconfig|npmrc|prettierrc|eslintrc|gitignore|gitattributes)$|^\.[^.]+$/i, "conf"],
    [/\.(css|scss|sass|less|html?)$/i, "web"],
  ];
  const ftKind = (name) => (FT_KIND.find(([re]) => re.test(name)) || [null, "other"])[1];
  const ftExt = (name) => { const m = /\.([^.]+)$/.exec(name); return m && m.index > 0 ? m[1].slice(0, 4) : ""; };
  const ftSize = (n) => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB" : (n / 1048576).toFixed(1) + " MB";
  function ftWhen(iso) {
    const t = Date.parse(iso);
    if (!t) return "";
    const s = (Date.now() - t) / 1000;
    const units = [[31536000, "year"], [2592000, "month"], [604800, "week"], [86400, "day"], [3600, "hour"], [60, "minute"]];
    for (const [sec, u] of units) if (s >= sec) { const n = Math.floor(s / sec); return `${n} ${u}${n > 1 ? "s" : ""} ago`; }
    return "just now";
  }

  async function gitFiles(body, st) {
    body.replaceChildren(relayLoading("Listing the repository's files", { sub: "Every file git tracks." }));
    const paths = await act(null, () => api("GET", gitURL("files")));
    if (!paths || S.gitTab !== "files") return;
    const repo = S.repoSel;
    S.filesDir = S.filesDir || {};
    const infoCache = new Map(); // dir -> entries with commits

    if (!paths.length) {
      body.replaceChildren(h("div", { class: "card fb-empty" }, icon("folder"), h("b", {}, "Nothing here yet"), h("span", { class: "muted" }, "Commit some files and they show up here.")));
      return;
    }

    // folder -> { dirs:Set, files:[] } from the flat list, built once
    const tree = new Map([["", { dirs: new Set(), files: [] }]]);
    for (const p of paths) {
      const parts = p.split("/");
      let cur = "";
      for (let i = 0; i < parts.length - 1; i++) {
        const next = cur ? cur + "/" + parts[i] : parts[i];
        tree.get(cur).dirs.add(parts[i]);
        if (!tree.has(next)) tree.set(next, { dirs: new Set(), files: [] });
        cur = next;
      }
      tree.get(cur).files.push(parts[parts.length - 1]);
    }
    const countUnder = (dir) => dir ? paths.filter((p) => p.startsWith(dir + "/")).length : paths.length;

    const card = h("div", { class: "card fb" });
    const readmeSlot = h("div", {});
    body.replaceChildren(card, readmeSlot);
    let query = "";

    const open = (dir) => { S.filesDir[repo] = dir; query = ""; draw(); };
    const cur = () => { const d = S.filesDir[repo] || ""; return tree.has(d) ? d : ""; };

    function crumbs(dir) {
      const parts = dir ? dir.split("/") : [];
      const bar = h("nav", { class: "fb-crumbs", "aria-label": "Folder" });
      bar.append(h("button", { type: "button", class: parts.length ? "" : "here", onclick: parts.length ? () => open("") : null }, icon("home"), st.name || "repository"));
      parts.forEach((p, i) => {
        bar.append(h("span", { class: "fb-sep", "aria-hidden": "true" }, "/"));
        const last = i === parts.length - 1;
        bar.append(h("button", { type: "button", class: last ? "here" : "", onclick: last ? null : () => open(parts.slice(0, i + 1).join("/")) }, p));
      });
      return bar;
    }

    function fileIcon(name, isDir) {
      if (isDir) return h("span", { class: "fb-ic k-dir" }, icon("folder"));
      const ext = ftExt(name);
      return h("span", { class: "fb-ic k-" + ftKind(name) }, icon("files"), ext ? h("i", {}, ext) : null);
    }

    function row(e, info) {
      const go = () => e.dir ? open(e.path) : showRepoFile(e.path);
      const c = info && info.commit;
      const pending = !info;
      return h("tr", { class: "fb-row" + (e.dir ? " is-dir" : ""), tabindex: "0", onclick: go, onkeydown: (ev) => { if (ev.key === "Enter") go(); } },
        h("td", { class: "fb-name" }, fileIcon(e.name, e.dir), h("span", { class: "fb-label" }, e.name),
          e.dir ? h("span", { class: "fb-n" }, countUnder(e.path)) : null),
        h("td", { class: "fb-msg" }, pending ? h("span", { class: "fb-skel" })
          : c ? h("button", { type: "button", class: "fb-commit", title: c.subject + " (" + c.short + ")", onclick: (ev) => { ev.stopPropagation(); showCommit(c.hash); } }, c.subject)
          : h("span", { class: "faint" }, "not committed yet")),
        h("td", { class: "fb-when" }, pending ? h("span", { class: "fb-skel short" }) : c ? h("span", { title: new Date(c.date).toLocaleString() }, ftWhen(c.date)) : ""),
        h("td", { class: "fb-size" }, e.dir ? "" : info ? ftSize(info.size) : ""));
    }

    function latest(entries) {
      const cs = entries.map((e) => e.commit).filter(Boolean).sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
      const c = cs[0];
      if (!c) return null;
      const initials = (c.author || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      return h("div", { class: "fb-latest" },
        h("span", { class: "fb-avatar", "aria-hidden": "true" }, initials),
        h("b", {}, c.author),
        h("button", { type: "button", class: "fb-commit grow", onclick: () => showCommit(c.hash) }, c.subject),
        h("span", { class: "mono faint" }, c.short),
        h("span", { class: "muted", title: new Date(c.date).toLocaleString() }, ftWhen(c.date)));
    }

    function draw() {
      const dir = cur();
      const node = tree.get(dir);
      const entries = [
        ...[...node.dirs].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true })).map((n) => ({ name: n, path: dir ? dir + "/" + n : n, dir: true })),
        ...[...node.files].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true })).map((n) => ({ name: n, path: dir ? dir + "/" + n : n, dir: false })),
      ];
      const search = h("input", { type: "text", class: "fb-search-in", placeholder: "Go to file…", value: query, "aria-label": "Find a file", spellcheck: "false" });
      const latestSlot = h("div", {});
      const tbody = h("tbody", {});
      const table = h("table", { class: "fb-table" },
        h("thead", {}, h("tr", {}, h("th", {}, "Name"), h("th", { class: "fb-msg" }, "Last commit"), h("th", { class: "fb-when" }, "Updated"), h("th", { class: "fb-size" }, "Size"))),
        tbody);

      const fillRows = () => {
        const info = infoCache.get(dir);
        const byPath = info ? new Map(info.map((e) => [e.path, e])) : null;
        const up = dir ? h("tr", { class: "fb-row is-up", tabindex: "0", onclick: () => open(dir.split("/").slice(0, -1).join("/")), onkeydown: (ev) => { if (ev.key === "Enter") open(dir.split("/").slice(0, -1).join("/")); } },
          h("td", { colspan: "4", class: "fb-name" }, h("span", { class: "fb-ic k-dir" }, icon("up")), h("span", { class: "fb-label muted" }, ".."))) : null;
        tbody.replaceChildren(...[up, ...entries.map((e) => row(e, byPath ? (byPath.get(e.path) || { commit: null, size: null }) : null))].filter(Boolean));
        latestSlot.replaceChildren(info ? latest(info) || "" : h("div", { class: "fb-latest" }, h("span", { class: "fb-avatar skel" }), h("span", { class: "fb-skel" })));
      };

      const results = h("div", { class: "fb-results hidden" });
      const runSearch = () => {
        query = search.value.trim().toLowerCase();
        const on = !!query;
        results.classList.toggle("hidden", !on);
        table.classList.toggle("hidden", on);
        latestSlot.classList.toggle("hidden", on);
        if (!on) return;
        const terms = query.split(/\s+/);
        const hits = paths.filter((p) => { const l = p.toLowerCase(); return terms.every((t) => l.includes(t)); })
          .sort((a, b) => a.split("/").length - b.split("/").length || a.length - b.length).slice(0, 100);
        results.replaceChildren(hits.length
          ? h("div", { class: "fb-hit-list" }, hits.map((p) => {
            const name = p.split("/").pop(), where = p.slice(0, -name.length).replace(/\/$/, "");
            return h("button", { type: "button", class: "fb-hit", onclick: () => showRepoFile(p) }, fileIcon(name, false), h("span", { class: "fb-label" }, name), where ? h("span", { class: "fb-where" }, h("bdi", {}, where)) : null);
          }))
          : h("div", { class: "fb-empty-row" }, "No file matches “" + search.value.trim() + "”."));
      };
      search.addEventListener("input", runSearch);
      search.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") { search.value = ""; runSearch(); }
        if (ev.key === "Enter") { const first = results.querySelector(".fb-hit"); if (first) first.click(); }
      });

      card.replaceChildren(
        h("div", { class: "fb-head" }, crumbs(dir),
          h("div", { class: "fb-tools" },
            h("label", { class: "fb-search" }, icon("search"), search),
            h("span", { class: "pill" }, countUnder(dir) + (countUnder(dir) === 1 ? " file" : " files")))),
        latestSlot, table, results);
      fillRows();
      if (query) runSearch();

      // commits for this folder, then fill them in
      if (!infoCache.has(dir)) {
        api("GET", gitURL("folder") + "?dir=" + enc(dir)).then((r) => {
          infoCache.set(dir, r.entries);
          if (cur() === dir && S.gitTab === "files" && S.repoSel === repo) fillRows();
        }, () => { infoCache.set(dir, []); if (cur() === dir) fillRows(); });
      }
      drawReadme(dir, node);
    }

    let readmeFor = null;
    async function drawReadme(dir, node) {
      const name = node.files.filter((f) => README_RE.test(f)).sort((a, b) => (/\.md$/i.test(b) ? 1 : 0) - (/\.md$/i.test(a) ? 1 : 0))[0];
      readmeFor = dir;
      if (!name) { readmeSlot.replaceChildren(); return; }
      const p = dir ? dir + "/" + name : name;
      const box = h("div", { class: "fb-readme-body" }, relayLoading("Reading " + name, { card: false }));
      readmeSlot.replaceChildren(h("div", { class: "card fb-readme" },
        h("div", { class: "fb-readme-head" }, h("span", { class: "fb-ic k-doc" }, icon("list")), h("b", {}, name),
          h("button", { type: "button", class: "btn small ghost", style: { marginLeft: "auto" }, onclick: () => showRepoFile(p) }, "View raw")),
        box));
      try {
        const f = await api("GET", gitURL("file") + "?path=" + enc(p));
        if (readmeFor !== dir || S.gitTab !== "files") return;
        box.replaceChildren(f.tooBig ? h("p", { class: "muted" }, "This README is too large to show here.")
          : /\.(md|markdown|mdown|mkd)$/i.test(name) ? ((S.mdBase = dir), (() => { try { return mdRender(f.text); } finally { S.mdBase = ""; } })()) : h("div", { class: "md" }, h("pre", { class: "mono md-pre" }, f.text)));
      } catch (e) {
        if (readmeFor === dir) box.replaceChildren(h("p", { class: "muted" }, e.message));
      }
    }

    draw();
  }

  /** A file from the tree, in the drawer. */
  /** A file from the repository, in the drawer: its content, who changed each line (blame), and its history. */
  async function showRepoFile(p, view = "content") {
    const name = p.split("/").pop();
    const dr = drawer({ title: name, sub: p, wide: true });
    const pane = h("div", { class: "fv-pane" });
    const seg = h("div", { class: "seg fv-seg", role: "tablist", "aria-label": "Show" });
    const views = [["content", "Content", "files"], ["blame", "Who changed what", "user"], ["history", "History", "clock"]];
    const show = (v) => {
      view = v;
      seg.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
      ({ content: fvContent, blame: fvBlame, history: fvHistory })[v](pane, p, dr);
    };
    seg.append(...views.map(([v, label, ic]) => { const b = h("button", { type: "button", role: "tab", onclick: () => show(v) }, icon(ic), label); b.dataset.v = v; return b; }));
    dr.body.replaceChildren(seg, pane);

  async function fvContent(pane, p) {
    pane.replaceChildren(relayLoading("Reading " + p.split("/").pop(), { card: false }));
    try {
      const f = await api("GET", gitURL("file") + "?path=" + enc(p));
      if (f.binary) return pane.replaceChildren(h("div", { class: "empty-row" }, "That's a binary file, so I can't show it as text."));
      if (f.tooBig) return pane.replaceChildren(h("div", { class: "empty-row" }, "That file is too large to show here (over 1 MB)."));
      const lines = f.text.replace(/\n$/, "").split("\n");
      pane.replaceChildren(h("div", { class: "fv-code mono" }, lines.map((l, i) => h("div", { class: "fv-line" }, h("span", { class: "fv-n" }, i + 1), h("span", { class: "fv-t" }, l || " ")))));
    } catch (e) { pane.replaceChildren(h("p", { class: "muted" }, e.message)); }
  }

  async function fvBlame(pane, p) {
    pane.replaceChildren(relayLoading("Finding who changed each line", { card: false, mood: "thinking" }));
    let r;
    try { r = await api("GET", gitURL("blame") + "?path=" + enc(p)); } catch (e) { return pane.replaceChildren(h("p", { class: "muted" }, e.message)); }
    if (!r.chunks.length) return pane.replaceChildren(h("div", { class: "empty-row" }, "This file is empty."));
    // newer changes glow brighter on the strip
    const times = r.chunks.map((c) => Date.parse(c.date) || Date.now());
    const oldest = Math.min(...times), newest = Math.max(...times), span = Math.max(newest - oldest, 1);
    const authors = new Set(r.chunks.filter((c) => !c.uncommitted).map((c) => c.author));
    pane.replaceChildren(
      h("div", { class: "bl-sum muted" }, `${plural(authors.size, "person", "people")} · ${plural(new Set(r.chunks.map((c) => c.hash)).size, "commit")} · newest change ${ago(new Date(newest).toISOString())}` + (r.truncated ? " · showing the first 6000 lines" : "")),
      h("div", { class: "bl" }, r.chunks.map((c, i) => {
        const heat = c.uncommitted ? 1 : (times[i] - oldest) / span;
        return h("div", { class: "bl-chunk" + (c.uncommitted ? " mine" : ""), style: { "--heat": String(0.15 + heat * 0.85) } },
          h("button", { type: "button", class: "bl-meta", disabled: c.uncommitted ? true : null, title: c.uncommitted ? "Not committed yet" : `${c.subject}\n${c.author} · ${new Date(c.date).toLocaleString()}`, onclick: () => showCommit(c.hash) },
            avatarFor({ author: c.author, email: c.author }),
            h("span", { class: "bl-txt" }, h("span", { class: "bl-subj" }, c.subject), h("small", {}, c.uncommitted ? "you, just now" : `${c.author} · ${ago(c.date)}`))),
          h("div", { class: "bl-lines mono" }, c.lines.map((l, j) => h("div", { class: "fv-line" }, h("span", { class: "fv-n" }, c.start + j), h("span", { class: "fv-t" }, l || " ")))));
      })));
  }

  async function fvHistory(pane, p, dr) {
    pane.replaceChildren(relayLoading("Reading this file's history", { card: false, mood: "thinking" }));
    let vs;
    try { vs = await api("GET", gitURL("file-history") + "?path=" + enc(p)); } catch (e) { return pane.replaceChildren(h("p", { class: "muted" }, e.message)); }
    if (!vs.length) return pane.replaceChildren(h("div", { class: "empty-row" }, "This file hasn't been committed yet."));
    const diff = h("div", { class: "fv-diff" });
    const word = { A: ["Created", "solid-green"], M: ["Changed", "solid-blue"], D: ["Deleted", "solid-red"], R: ["Renamed", "solid-violet"], C: ["Copied", "violet"] };
    const list = h("div", { class: "fh-list" });
    const open = async (v, btn) => {
      list.querySelectorAll(".fh-row").forEach((b) => b.classList.toggle("on", b === btn));
      diff.replaceChildren(relayLoading("Comparing", { mood: "comparing", card: false }));
      try {
        const d = await api("GET", gitURL("commit-diff") + "?hash=" + enc(v.hash) + "&path=" + enc(v.path));
        storyInto(diff, null, d, v.path.split("/").pop(), null, dr.panel);
      } catch (e) { diff.replaceChildren(h("p", { class: "muted" }, e.message)); }
    };
    vs.forEach((v, i) => {
      const [w, cls] = word[v.status] || [v.status, ""];
      const renamed = v.path !== p;
