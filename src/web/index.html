    ui.actions.replaceChildren(fetchBtn, pullBtn, pushBtn);
    renderOperation(st);

    const n = st ? st.files.filter((f) => !f.conflicted).length : 0;
    const tabs = [["files", "Files", "folder", 0], ["changes", "Changes", "files", n], ["history", "History", "clock", 0], ["insights", "Insights", "chart", 0], ["branches", "Branches", "branch", 0], ["stashes", "Stashes", "box", st ? st.stashes : 0],
      ["prs", "Pull requests", "pr", 0], ["issues", "Jira", "ticket", 0], ["tags", "Tags", "tag", 0], ["worktrees", "Worktrees", "tree", 0]]
      .filter(([id]) => id !== "issues" || (S.conns && S.conns.jira.connected));
    if (!tabs.some(([id]) => id === S.gitTab)) S.gitTab = "changes";
    ui.tabs.replaceChildren(...tabs.map(([id, name, ic, c]) => h("button", { class: "tab" + (S.gitTab === id ? " on" : ""), "aria-pressed": S.gitTab === id ? "true" : "false", onclick: () => { S.gitTab = id; S.gshown = ""; render(); } },
      icon(ic), name, c ? h("span", { class: "count blue" }, c) : null)));
    renderGitBody(st);
  }

  async function doPull(strategy) {
    try {
      await gitAct("pull", { strategy: strategy || "" }, "Pulled the latest commits", "party");
    } catch (e) {
      if (e.code === "diverged") {
        const choice = await relayAsk({ mood: "thinking", title: "Both sides have new commits.", text: "Your branch and the remote have each moved on. Merge keeps both histories as they are; rebase replays your commits on top of the remote's, for a straight line.", yes: "Rebase my commits", no: "Merge them", yesMood: "wink", noMood: "happy" });
        await tryAct("pull", { strategy: choice ? "rebase" : "merge" }, "Caught up with the remote", "party");
      } else if (e.code !== "conflicts") toast(e.message, true);
    }
  }

  async function doPush(force) {
    try {
      await gitAct("push", { force }, (r) => `Pushed ${r.branch}`, "party");
    } catch (e) {
      if (e.code === "rejected" && !force) {
        const st = S.repo;
        const rewrote = st && st.lastCommit && st.lastCommit.pushed === false;
        const ok = await relayAsk({ mood: "worried", title: "The remote has commits you don't have.", text: rewrote ? "Pull first to bring them in. If you rewrote commits on purpose (amend, undo), you can force-push instead, which replaces the remote's version." : "Pull first to bring them in, then push again.", yes: "Pull now", no: "Not now" });
        if (ok) await doPull();
      } else toast(e.message, true);
    }
  }

  async function removeRepo(r) {
    const ok = await relayAsk({ mood: "thinking", title: `Remove ${r.name} from the list?`, text: "Only the list entry goes. The repository and its files stay exactly where they are.", yes: "Remove", no: "Keep it" });
    if (!ok) return;
    await act("Removed from the list", () => api("POST", "/git/repos/remove", { id: r.id }), "wink");
    S.repoSel = "";
    refreshGit();
  }

  /** The "merge in progress" card: conflicted files with one-click choices, plus Continue and Abort. */
  function renderOperation(st) {
    const ui = S.gui;

    const conflicts = st.files.filter((f) => f.conflicted);
    const rows = conflicts.map((f) => h("tr", {},
      h("td", { class: "file" }, f.path, h("small", {}, "changed on both branches")),
      h("td", { class: "end" },
        h("button", { class: "btn small brand", onclick: () => showConflict(f.path) }, icon("eye"), "See both"), " ",
        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "ours" }, `${f.path}: kept your version`) }, "Keep mine"), " ",
        h("button", { class: "btn small", onclick: () => tryAct("resolve", { path: f.path, choice: "theirs" }, `${f.path}: kept theirs`) }, "Keep theirs"), " ",
        h("button", { class: "btn small", title: "Keep every line from both sides", onclick: () => tryAct("resolve", { path: f.path, choice: "both" }, `${f.path}: kept both`) }, "Keep both"), " ",
        h("button", { class: "btn small ghost", title: "I fixed it in my editor", onclick: () => tryAct("resolve", { path: f.path, choice: "done" }, `${f.path}: marked as resolved`) }, "I fixed it")),
    ));
    const cont = h("button", { class: "btn brand", disabled: conflicts.length ? true : null, onclick: () => tryAct("finish", { action: "continue" }, "Done! Finished the " + st.operation, "party") }, "Continue");
    const abort = h("button", { class: "btn ghost danger", onclick: async () => {
      const ok = await relayAsk({ mood: "worried", title: `Abort the ${st.operation}?`, text: "I'll put everything back the way it was before it started.", yes: "Abort", no: "Keep going", yesMood: "sad" });
      if (ok) tryAct("finish", { action: "abort" }, `Aborted the ${st.operation}`, "sleepy");
    } }, "Abort");
    const title = { merge: `Merging ${st.operationBranch || "a branch"}`, rebase: "Rebase in progress", "cherry-pick": "Cherry-pick in progress", revert: "Revert in progress" }[st.operation];
    ui.op.replaceChildren(h("div", { class: "card section op-card" },
      h("div", { class: "section-head" }, h("span", { class: "section-title" }, title, conflicts.length ? h("span", { class: "count red" }, conflicts.length) : null), h("div", { class: "grow" }), abort, cont),
      conflicts.length ? h("table", { class: "table" }, h("tbody", {}, rows)) : h("div", { class: "empty-row" }, "Every conflict is settled. Press Continue to finish.")));

  async function showConflict(file) {

    dr.body.append(relayLoading("Comparing your version with theirs", { mood: "comparing", card: false }));

      const pick = (choice, text) => { tryAct("resolve", { path: file, choice }, `${file}: ${text}`); dr.close(); };

        h("button", { class: "btn small", onclick: () => pick("theirs", "kept theirs") }, "Keep theirs"),
        h("button", { class: "btn small brand", onclick: () => pick("both", "kept both") }, "Keep both")], dr.panel);
    } catch (e) {
      dr.body.replaceChildren(h("p", { class: "muted" }, e.message));
    }
  }

  function renderGitBody(st) {
    const ui = S.gui;
    const key = [S.repoSel, S.gitTab, S.gitBump, S.gitTab === "changes" ? JSON.stringify(st && st.files) + (st && st.lastCommit && st.lastCommit.hash) : ""].join("|");
    const typing = ui.body.contains(document.activeElement) && document.activeElement.tagName === "INPUT" && document.activeElement.type === "text";
    if (S.gshown === key || (typing && S.gshown.startsWith(S.repoSel + "|" + S.gitTab))) return;
    S.gshown = key;
    if (!st) { ui.body.replaceChildren(S.repoError ? h("div", { class: "card empty-row" }, S.repoError) : relayLoading("Opening the repository", { sub: "Looking at branches and changes." })); return; }
    ({ files: gitFiles, changes: gitChanges, history: gitHistory, insights: gitInsights, branches: gitBranches, stashes: gitStashes, prs: gitPRs, issues: gitIssues, tags: gitTags, worktrees: gitWorktrees })[S.gitTab](ui.body, st);
  }

  const STATUS = (f) => f.conflicted ? ["Conflict", "red"] : f.untracked ? ["New", "solid-green"] : (f.x === "A" ? ["New", "solid-green"] : f.x === "R" ? ["Renamed", "solid-violet"] : (f.x === "D" || f.y === "D") ? ["Deleted", "solid-red"] : ["Modified", "solid-blue"]);

  // ---------- changes ----------
  function gitChanges(body, st) {
    const files = st.files.filter((f) => !f.conflicted);
    const rows = files.map((f) => {
      const cb = h("input", { type: "checkbox", "aria-label": "Include " + f.path + " in the next commit" });
      cb.checked = f.staged;
      cb.indeterminate = f.staged && f.unstaged && !f.untracked;
      cb.onchange = () => tryAct(cb.checked ? "stage" : "unstage", { files: [f.path] });
      const [word, cls] = STATUS(f);
      const folder = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/") + 1) : "top folder";
      return h("tr", {},
        h("td", { class: "cbcell" }, cb),
        h("td", { class: "file" }, f.path.split("/").pop(), h("small", {}, f.from ? `renamed from ${f.from}` : folder)),
        h("td", {}, h("span", { class: "pill " + cls }, word), cb.indeterminate ? h("span", { class: "pill amber refpill" }, "partly staged") : ""),
        h("td", { class: "end" },
          h("button", { class: "btn small", onclick: () => reviewFile(f) }, icon("eye"), "Review & pick lines"), " ",
          h("button", { class: "btn small ghost danger", onclick: () => discardFiles([f.path], f.path) }, "Discard")));
    });
    const staged = files.filter((f) => f.staged).length;
    const headBtns = files.length ? h("span", { class: "inline" },
      h("button", { class: "btn small", onclick: () => tryAct("stage", { files: [] }, "Everything is ready to commit") }, "Select all"),
      h("button", { class: "btn small ghost", onclick: () => tryAct("unstage", { files: [] }) }, "Clear"),
      h("button", { class: "btn small ghost", onclick: async () => {
        const v = await relayAsk({ mood: "thinking", title: "Put these changes aside?", text: "I'll stash them (tuck them away safely) so you get a clean folder. Bring them back any time from the Stashes tab.", yes: "Stash them", no: "Cancel", yesMood: "wink", fields: [{ name: "message", label: "A note to remember them by (optional)", placeholder: "e.g. half-done login page" }] });

  /** A short message for a group, from what it changed (you'll usually want to edit it). */

  // ---------- history ----------
  // ---------- history: commits with their branch graph ----------

  const LANE_COLOURS = ["#22A06B", "#2A78D6", "#E0592A", "#8B5CF6", "#D6457A", "#1FA3B8", "#C99A1B", "#5B6B8A"];
  const GRAPH = { row: 44, lane: 14, pad: 10, max: 12 };

  /**
   * Lays commits (newest first, children before parents) out in lanes.
   * Each row gets its node's lane and colour, and the line pieces that cross
   * it: lanes passing straight through, lanes curving into this commit (where
   * branches meet), and lines out to its parents (where a merge forks).
   */
  function graphLayout(commits, pin) {
    const lanes = [], colour = [];
    let next = 0, width = 1;
    // the branch you're on always runs down the first lane
    if (pin && commits.some((c) => c.hash === pin)) { lanes[0] = pin; colour[0] = 0; next = 1; }
    const rows = commits.map((c) => {
      const before = lanes.slice(), beforeColour = colour.slice();
      let col = lanes.indexOf(c.hash);
      if (col < 0) { // a branch tip: no child seen yet
        col = lanes.indexOf(null);
        if (col < 0) col = lanes.length;
        colour[col] = next++ % LANE_COLOURS.length;
        beforeColour[col] = colour[col];
      }
      const lines = [];
      before.forEach((hash, j) => {
        if (!hash) return;
        if (hash === c.hash) { lines.push({ from: j, to: col, half: "top", c: beforeColour[j] }); if (j !== col) lanes[j] = null; }
        else lines.push({ from: j, to: j, half: "all", c: beforeColour[j] });
      });
      const [first, ...others] = c.parents;
      lanes[col] = first || null;
      if (first) lines.push({ from: col, to: col, half: "bottom", c: colour[col] });
      for (const p of others) {
        let k = lanes.indexOf(p);
        if (k < 0) { k = lanes.indexOf(null); if (k < 0) k = lanes.length; lanes[k] = p; colour[k] = next++ % LANE_COLOURS.length; }
        lines.push({ from: col, to: k, half: "bottom", c: colour[k] });
      }
      while (lanes.length && lanes[lanes.length - 1] === null) lanes.pop();
      width = Math.max(width, before.length, lanes.length, col + 1);
      return { col, c: colour[col], lines };
    });
    return { rows, width: Math.min(width, GRAPH.max) };
  }

  function graphCell(row, width, c) {
    const { row: H, lane: L, pad } = GRAPH;

  /** Pace: commits per week with a 4-week average. */
  function insightWeekly(d, first, today) {

      const start = new Date(first); start.setDate(first.getDate() + w * 7);
      let n = 0;
      for (let r = 0; r < 7; r++) { const t = new Date(start); t.setDate(start.getDate() + r); if (t <= today) n += d.days[ymdLocal(t)] || 0; }

    const W = 1000, H = 330, L = 48, R = 16, T = 16, B = 44, pw = W - L - R, ph = H - T - B;

    const wrap = h("div", { class: "heat-wrap" }, g,

    const W = 1000, H = 200, L = 34, R = 8, T = 12, B = 46, pw = W - L - R, ph = H - T - B;

      if (dd.files) g.append(sv("rect", { x: x(i) + 2, y: y(dd.files), width: Math.max(1, bw - 4), height: y(0) - y(dd.files), rx: Math.min(4, (bw - 4) / 2), class: "bar" + (dd.commits ? "" : " open") }));

  function linkIssues(t) {
    const site = S.conns && S.conns.jira.connected ? S.conns.jira.where : "";
    if (!site) return [t];
    const out = [];
    let last = 0;
    for (const m of t.matchAll(/\b[A-Z][A-Z0-9_]+-\d+\b/g)) {
      out.push(t.slice(last, m.index));
      out.push(h("a", { href: `${site}/browse/${m[0]}`, target: "_blank", rel: "noopener noreferrer", onclick: (e) => e.stopPropagation(), class: "pill blue refpill", style: { textDecoration: "none" } }, m[0]));
      last = m.index + m[0].length;
    }
    out.push(t.slice(last));
    return out;
  }

        const st = c[svc.id];
        const card = h("div", { class: "card section", style: { marginBottom: "12px", padding: "14px 16px", background: "var(--card2)" } });
        const head = h("div", { class: "inline", style: { justifyContent: "space-between", gap: "10px", flexWrap: "wrap" } },
          h("div", {}, h("b", { style: { fontSize: "16px" } }, svc.name), h("div", { class: "muted", style: { fontSize: "13px" } }, svc.blurb)),
          st && st.connected ? h("span", { class: "pill green" }, "✓ connected") : svc.id === "github" ? h("span", { class: "pill" }, "via gh CLI") : h("span", { class: "pill" }, "not connected"));
        card.append(head);
        if (svc.id === "github") { card.append(h("p", { class: "hint" }, svc.how)); return card; }
        if (st && st.connected) {
          card.append(h("p", { class: "hint", style: { marginTop: "8px" } }, `As ${st.user || "you"} · ${st.where}`),
            st.fromEnv ? h("p", { class: "hint" }, "Set by environment variables where ferry runs; change them there.")
              : h("button", { class: "btn small ghost danger", onclick: async () => { await act(`Disconnected ${svc.name}`, () => api("POST", `/connections/${svc.id}/remove`), "sleepy"); paint(); refreshGit(); } }, "Disconnect"));
          return card;
        }
        const inputs = {};
        const form = h("div", { style: { marginTop: "12px" } }, svc.fields.map((f) => {
          const el = h("input", { type: f.secret ? "password" : "text", placeholder: f.placeholder, value: f.value || "", autocomplete: "off" });
          inputs[f.name] = el;
          return h("label", { class: "field" }, h("span", { class: "label" }, f.label), el, f.hint ? h("small", {}, f.hint) : null);
        }));
        const btn = h("button", { class: "btn brand small" }, "Connect");
        btn.onclick = async () => {
          btn.disabled = true;
          btn.textContent = "Checking…";
          const values = Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value.trim()]));
          const r = await act(null, () => api("POST", `/connections/${svc.id}`, values));
          btn.disabled = false;
          btn.textContent = "Connect";
          if (r) { toast(`Connected to ${svc.name} as ${r.user}`, false, "party"); paint(); refreshGit(); }
        };
        card.append(form, h("div", { class: "inline", style: { justifyContent: "space-between", flexWrap: "wrap" } },
          h("span", { class: "hint", style: { margin: 0 } }, svc.help, " ", h("a", { href: svc.link, target: "_blank", rel: "noopener noreferrer" }, "Create a token")), btn));
        return card;
      });
      dr.body.replaceChildren(
        h("div", { class: "narrator" }, h("img", { src: face(n ? "happy" : "excited"), alt: "" }), h("div", { class: "bubble" },
          h("div", { class: "say" }, n ? `I'm connected to ${plural(n, "service")}.` : "Which services do you use?"),
          h("div", { class: "hint" }, "Tokens stay on this computer, in a file only you can read. The browser never sees them."))),
        ...cards);
    };
    dr.foot.replaceChildren(h("span", { class: "hint left", style: { margin: 0 } }, "Pull requests and Jira show up in the Git area."), h("button", { class: "btn", onclick: dr.close }, "Done"));
    paint();
  }

  // ---------- add a repository ----------
  function openAddRepo() {
    if (!S.info || !S.info.can_open_repos) return toast("Start ferry with “ferry ui” to open repositories here.", true);
    const dr = drawer({ title: "Add a repository", sub: "Clone, create, or open one you already have." });
    let mode = "clone";
    const seg = h("div", { class: "seg big", role: "group", "aria-label": "How" });
    const formView = h("div");
    const pickerView = h("div", { class: "hidden" });
    const go = h("button", { class: "btn brand" });
    const cancel = h("button", { class: "btn ghost", onclick: dr.close }, "Cancel");
    const restore = () => dr.foot.replaceChildren(cancel, go);
    const url = h("input", { type: "text", placeholder: "https://github.com/owner/repo.git  or  git@gitlab.com:owner/repo.git" });
    const parent = h("input", { type: "text", value: S.info.home + S.info.sep + "code" });
    const name = h("input", { type: "text", placeholder: "folder name" });
    const existing = h("input", { type: "text", placeholder: "the repository's folder" });
    url.addEventListener("input", () => { const m = /([^/:]+?)(\.git)?\/?$/.exec(url.value.trim()); if (m && !name.dataset.touched) name.value = m[1]; });
    name.addEventListener("input", () => { name.dataset.touched = "1"; });
    const chooser = (input, title) => h("button", { class: "btn small", type: "button", onclick: () => pickFolder(dr, formView, pickerView, restore, title, input.value || S.info.home, (dir) => { input.value = dir; }) }, "Choose…");
    const paint = () => {
      seg.replaceChildren(...[["clone", "Clone"], ["create", "Create new"], ["add", "Open existing"]].map(([id, label]) => h("button", { class: mode === id ? "on" : "", onclick: () => { mode = id; paint(); } }, label)));
      const say = { clone: "Paste the address of a repository on GitHub, GitLab or anywhere else.", create: "I'll make a fresh repository with a main branch.", add: "Pick a folder that's already a git repository." }[mode];
      formView.replaceChildren(
        h("div", { class: "narrator" }, h("img", { src: face("excited"), alt: "" }), h("div", { class: "bubble" }, h("div", { class: "say" }, { clone: "Which repository should I copy?", create: "Let's start something new!", add: "Which repository is it?" }[mode]), h("div", { class: "hint" }, say))),
        h("div", { style: { marginBottom: "16px" } }, seg),
        mode === "clone" ? h("label", { class: "field" }, h("span", { class: "label" }, "Repository address"), url, h("small", {}, "Private repositories use your usual git login (SSH keys or a credential helper).")) : "",
        mode !== "add" ? h("div", { class: "field" }, h("span", { class: "label" }, "Put it inside"), h("div", { class: "inline" }, parent, chooser(parent, "Choose where to put it"))) : "",
        mode !== "add" ? h("label", { class: "field" }, h("span", { class: "label" }, "Folder name"), name) : "",
        mode === "add" ? h("div", { class: "field" }, h("span", { class: "label" }, "Repository folder"), h("div", { class: "inline" }, existing, chooser(existing, "Choose the repository"))) : "");
      go.textContent = { clone: "Clone it", create: "Create it", add: "Open it" }[mode];
    };
    go.onclick = async () => {
      const dest = parent.value.replace(/[\\/]+$/, "") + S.info.sep + name.value.trim();
      const body = mode === "clone" ? { action: "clone", url: url.value.trim(), path: dest } : mode === "create" ? { action: "create", path: dest } : { action: "add", path: existing.value.trim() };
      if ((mode === "clone" && !body.url) || (mode !== "add" && !name.value.trim()) || (mode === "add" && !body.path)) return toast("Fill in the empty field first", true);
      go.disabled = true;
      go.textContent = mode === "clone" ? "Cloning…" : "Working…";
      const r = await act(null, () => api("POST", "/git/repos", body));
      go.disabled = false;
      paint();
      if (!r) return;
      toast({ clone: "Cloned! ", create: "Created! ", add: "Opened " }[mode] + short(r.path), false, "party");
      dr.close();
      S.repoSel = r.id;
      localStorage.setItem("ferry-repo", r.id);
      S.gui = null;
      refreshGit();
    };
    dr.body.append(formView, pickerView);
    restore();
    paint();
  }

  /**
   * Swaps a drawer's form for a folder browser. pick(dir) gets the chosen
   * folder; restoreFoot puts the form's buttons back.
   */
  function pickFolder(dr, formView, pickerView, restoreFoot, title, start, pick) {
    const oldTitle = dr.titleEl.textContent;
    dr.titleEl.textContent = title;
    formView.classList.add("hidden");
    pickerView.classList.remove("hidden");
    let showHidden = false, cur = null;
    const back = () => { dr.titleEl.textContent = oldTitle; pickerView.classList.add("hidden"); formView.classList.remove("hidden"); restoreFoot(); };
    const choose = h("button", { class: "btn brand", type: "button", onclick: () => { if (cur) { pick(cur); back(); } } }, "Choose this folder");
    dr.foot.replaceChildren(h("button", { class: "btn ghost left", type: "button", onclick: back }, "← Back"), choose);
    const go = async (dir) => {
      let r;
      try {
        r = await api("GET", "/fs?path=" + enc(dir) + (showHidden ? "&hidden=1" : ""));
      } catch (e) {
        if (dir !== S.info.home) return go(S.info.home);
        pickerView.replaceChildren(h("p", { class: "muted" }, e.message));
        return;
      }
      cur = r.path;
      choose.textContent = `Choose “${r.path.split(/[\\/]/).filter(Boolean).pop() || r.path}”`;
      const sep = S.info.sep, parts = r.path.split(/[\\/]/).filter(Boolean), win = /^[A-Za-z]:/.test(r.path);
      const crumbs = h("div", { class: "crumbpath" });
      parts.forEach((part, i) => {
        const full = (win ? "" : sep) + parts.slice(0, i + 1).join(sep) + (win && i === 0 ? sep : "");
        if (i > 0 || !win) crumbs.append(h("span", { class: "sep" }, sep));
        const last = i === parts.length - 1;
        crumbs.append(h("button", { type: "button", class: last ? "here" : "", onclick: last ? null : () => go(full) }, part));
      });
      const hid = h("input", { type: "checkbox", checked: showHidden ? true : null });
      hid.addEventListener("change", () => { showHidden = hid.checked; go(r.path); });
      const join = (n) => r.path.replace(/[\\/]+$/, "") + sep + n;
      pickerView.replaceChildren(crumbs,
        h("div", { class: "dirs" },
          r.parent ? h("button", { type: "button", class: "dir", onclick: () => go(r.parent) }, "↑", h("span", { class: "muted" }, "Up one level")) : "",
          r.dirs.length ? r.dirs.map((n) => h("button", { type: "button", class: "dir", onclick: () => go(join(n)) }, icon("folder"), h("span", {}, n), h("span", { class: "chev" }, "›"))) : h("div", { class: "dir muted", style: { cursor: "default" } }, "This folder has no sub-folders.")),
        h("div", { class: "inline", style: { marginTop: "12px", gap: "14px", flexWrap: "wrap" } },
          r.is_git ? h("span", { class: "pill green" }, "this folder is a git repo") : "",
          h("button", { type: "button", class: "btn small", onclick: () => go(r.home) }, "Home folder"),
          h("label", { class: "check", style: { margin: 0 } }, hid, "show hidden folders")),
        h("p", { class: "hint" }, "Click a folder to open it, then press “Choose” below."));
    };
    go(start);
  }

  // ---------- start ----------
  setupRail();
  (async () => {
    try {
      S.info = await api("GET", "/info");
    } catch (e) {
      setConn(false);
      if (/token/i.test(e.message)) toast("This page needs the access token: open the link ferry printed.", true);
    }
    // connections first: they decide which tabs a repository shows (Jira's Issues tab)
    S.conns = await api("GET", "/connections").catch(() => null);
    await refresh();
    S.notes = await api("GET", "/events/recent").catch(() => []);
    S.settings = S.settings || (await api("GET", "/settings").catch(() => null));
    paintMe();
    if (devState && devState.scroll) for (const ms of [0, 300, 900]) setTimeout(() => window.scrollTo(0, devState.scroll), ms);
    paintBadge();
    connectEvents();
    setInterval(refresh, 3000);
  })();
})();
</script>
</body>
</html>
